.hs .hs-choices{display:grid;gap:8px;margin-block-start:14px}
.hs .hs-ch{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:48px;padding:10px 14px;text-align:start;background:var(--hs-panel);border:1px solid var(--hs-line);border-radius:10px;color:var(--hs-text);font:var(--hs-fs)/1.45 var(--hs-serif);cursor:pointer;transition:filter .5s ease,border-color .2s ease}
.hs .hs-ch:hover{border-color:var(--hs-text-2)}

.hs .hs-ch .t{display:flex;flex-direction:column;gap:2px;min-width:0}

.hs .hs-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.hs .hs-list{margin:0;padding-inline-start:1.2em;display:grid;gap:6px}

.hs .hs-log .when{display:block;font:15px/1.4 var(--hs-sans);color:var(--hs-text-2)}
.hs .hs-log .line{display:block}

/* ---------- sizes. Container queries follow the game root; data-layout covers browsers without them and the player's choice */
@container (max-width:599px){
  .hs .hs-epiq{font-size:21px}
  .hs .hs-askrow{flex-direction:row}
  .hs .hs-status{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hs .hs-status .hs-coins{grid-column:1 / -1;text-align:end}
  .hs .hs-bar .lab{white-space:normal}
  .hs .hs-mgrid{grid-template-columns:1fr}
  .hs .hs-radios{grid-template-columns:1fr}
  .hs .hs-full{min-height:calc(100dvh - 96px)}
}
@container (max-width:379px){.hs .hs-dots{display:none}.hs .hs-tools{flex-wrap:nowrap}}
.hs[data-layout="mobile"] .hs-epiq{font-size:21px}

.hs[data-layout="mobile"] .hs-status .hs-coins{grid-column:1 / -1;text-align:end}
.hs[data-layout="mobile"] .hs-bar .lab{white-space:normal}
.hs[data-layout="mobile"] .hs-mgrid{grid-template-columns:1fr}
.hs[data-layout="mobile"] .hs-play,.hs[data-layout="mobile"] .hs-cine{max-width:34em}

.hs[data-short="1"] .hs-full{min-height:0;justify-content:flex-start;padding-block:8px}
.hs[data-short="1"] .hs-stage{height:clamp(20vh,var(--hs-stage-h,30vh),30vh)}
.hs[data-short="1"] .hs-btn.big{min-height:56px}

.hs[data-short="1"] .hs-ch{min-height:44px;padding:6px 12px}
.hs[data-short="1"] .hs-status{min-height:0}
/* two columns: wide and not tall (307.2, I37-02) — picture left 58 %, words right */
@media (max-height:899px){
  @container (min-width:1200px){
    .hs .hs-play:has(.hs-stage){max-width:none;display:grid;grid-template-columns:58% minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:24px}
    .hs .hs-play:has(.hs-stage) .hs-stage{grid-column:1;grid-row:1 / span 2;height:auto;min-height:60vh}
    .hs .hs-play:has(.hs-stage) .hs-status,.hs .hs-play:has(.hs-stage) .hs-textbox{grid-column:2}
  }
}

   The picture never shakes the words or the buttons: effects move only .hs-cam inside the SVG (155.5). */
.hs .hs-svg{display:block;width:100%;height:100%}
.hs .hs-svg .hs-world,.hs .hs-svg .hs-hue{transition:filter 1.4s ease}
@keyframes hs-fall{from{transform:translateY(-20px)}to{transform:translateY(520px)}}

.hs .hs-svg .hs-cam{transform-origin:40% 70%}

ML 파일로 구성되어 있으며, 그래픽은 웹 표준인 SVG(Scalable Vector Graphics)를 사용해 구현되었습니다. SVG는 XML 기반의 2차원 벡터 그래픽 기술로, 해상도에 관계없이 선명한 화면을 유지하면서도 용량이 작고 렌더링 속도가 뛰어나 다양한 기기에서 일관된 사용자 경험을 제공합니다.","q.madeMore":"그림은 일부러 단순한 선과 몇 가지 색만으로 그렸습니다. 이 작품에서 색과 얼굴은 플레이어의 선택을 통해 하나씩 돌아옵니다.","q.madeH":"제작 방식","lt.ask":"사랑하는 자식에게 편지를 보내겠습니까?","lt.yes":"편지를 보낸다","lt.no":"지금은 아니다","lt.h":"소리 편지","lt.body":"편지는 이 기기의 스피커에서 짧은 멜로디가 됩니다. 가까이 있는 휴대폰이 그 소리를 들을 수 있습니다. 어떤 네트워크로도 보내지 않으며, 아무것도 녹음하지 않습니다.","lt.yours":"보낼 편지","lt.pick":"소리 편지는 영어 대문자만 실을 수 있습니다. 하나를 고르세요:","lt.code":"편지 코드: {c}","lt.codeHelp":"소리를 내기 어려운 곳에서는 받는 사람이 \"편지 듣기\"에 이 코드를 입력하면 됩니다.","lt.send":"편지 보내기","lt.playing":"멜로디가 흐르는 중…","lt.sent":"편지가 공기 속으로 보내졌습니다.","lt.nosound":"이 브라우저에서는 소리를 낼 수 없습니다. 편지는 수첩에 남습니다.","decl.top":"2D 텍스트 인터랙티브 시네마","decl.body":"이 작품은 SVG 실루엣과 정제된 텍스트, 그리고 시스템 규칙(스탯과 선택지 터널링) 자체를 영화적 연출 도구로 사용합니다.","cred.1":"Morgan J. 제공","cred.2":"감독 Morgan J.","cred.3":"시나리오·연출 Morgan J.","cred.4":"© 2026 Morgan J. 모든 권리 보유.","op.1":"아침을 향한 창이 있는 작은 집. 부엌에서는 아내가 노래를 불렀고, {hero}는 물류 창고에서 지게차를 몰았다.","op.2":"노래는 어느 겨울에 멈췄다. 두 살이던 {son}은 그 목소리를 기억하지 못한다.","op.3":"그 뒤의 일은 종이 몇 장으로 남았다. 병원 영수증, 해고 통지서, 이삿날을 적은 쪽지.","op.4":"그는 세 살이던 {son}을 '햇살의 집'에 맡겼다. 형편이 나아지면 데리러 오겠다고 약속했다.","op.5":"형편은 나아지지 않았다. 다섯 해가 지났고, 이번 겨울 그에게 남은 곳은 공원 벤치 하나다.","op.6b":"벤치에서 그는 사진을 꺼낸다. 엄지가 닿는 모서리가 부드럽게 닳았다.","draw.btn":"아들의 얼굴을 그린다.","op.6b.r":"전단 뒷면에 연필 선 몇 개. 작은 얼굴, 거의 웃는 얼굴.","op.6b.more":"그 옆이 조금 비어 있다.","op.7":"이번 주에 아들의 생일이 온다.","op.skip":"이야기 건너뛰기","tc.note":"첫 여정은 보통 난이도로 진행됩니다. 30일째의 엔딩을 보면 어려움과 극악이 열립니다.","diff.h":"이 30일을 어떻게 걸을지 고르세요","diff.normal":"이 아버지의 30일을 함께 걷겠습니다","diff.hard":"이 30일의 현실을 더 가까이 보겠습니다","diff.extreme":"가장 혹독한 30일을 견뎌 보겠습니다","diff.normal.r":"쓰러지면 그 막의 처음부터 다시 시작합니다.","diff.hard.r":"쓰러지면 첫날부터 다시 시작합니다.","diff.extreme.r":"쓰러지면 첫날부터 다시 시작합니다.","diff.foot":"난이도는 게임 도중 바꿀 수 없으니 신중하게 선택하세요.","diff.confirm":"이 난이도에서는 쓰러지면 첫날부터 다시 시작합니다. 계속할까요?","diff.again":"다시 고르기","diff.go":"계속","map.h":"어디로 갈까","map.here":"지금 있는 곳","map.near":" "],"ph":[5,6],"tier":1},"warm":{"at":["L6"],"tier":2},"rest":{"tier":2},"clean":{"at":["L1","L7"],"ph":[2,4],"tier":3},"help":{"at":["L2"],"ph":[4],"tier":3},"wash":{"at":["L3"],"tier":5}},"actsSrc":"302.2·302.3, 8.1 거점·영업 시간, 147.3, 샘플 290(tier)","talk":{"N03":{"at":["L1"],"ph":[2,3],"jeong":true},"P07":{"at":["L1","L7"],"ph":[2,4],"jeong":false},"N01":{"at":["L2"],"ph":[3,4],"jeong":true},"L4":{"at":["L4"],"ph":[1,6],"jeong":false},"N05":{"at":["L6"],"ph":[2,3,4],"jeong":true},"N04":{"at":["L8"],"ph":[5,6],"jeong":true,"needFlag":"metMina"}},"talkSrc":"302.5","finds":[{"i":1,"at":["L1"]},{"i":2,"at":["L1","L7","L10"]},{"i":3,"at":["L7"]},{"i":4,"at":["L1","L7"]},{"i":5,"at":["L1","L7","L4"]},{"i":6,"at":["L7","L8"]},{"i":7,"at":["L1","L7"]},{"i":8,"at":["L1"],"effect":{"hun":3}}],"findsSrc":"302.4(8종, 회차당 각 1회, 8번만 포만 +3)","restLine":{"L4":"fa.rest.L4","L6":"fa.rest.L6","L2":"fa.rest.L2"},"toward":{"L2":{"L4":"L1","L3":"L1","L5":"L6","L7":"L1","L8":"L7","L10":"L4","L9":"L2"}},"endArt":{"e0a":["u1.end.van","u1.end.room","u1.end.work","u1.house.out","u1.end.window"],"e0b":["u1.house.door","u1.end.room","u1.house.out","u1.end.window","u1.end.room"]}}}</script><!-- HS:MOD D-U1 END -->
<!-- HS:MOD L-en-U1 START 17875961911a4830 --><script type="application/json" data-hs-pack data-hs-lang="en" data-hs-mod="L-en-U1">{"id":"L-en-U1","lang":"en","unit":1,"strings":{"c0101.t":"Someone taps the leg of the bench with his shoe. “You can't sleep here, sir. I've told you.” The guard's flashlight passes over {hero}'s face and stops on the prosthetic leg. The light hesitates for a moment.","c0101.t.x":"Someone taps the leg of the bench with his shoe. “You can't sleep here, sir. I've told you.” The guard's flashlight passes over {hero}'s face, then stops on the folded trouser leg and the crutch. The light hesitates for a moment.","c0101.a":"Get up.","c0101.a.r":"Below the knee, everything is cold. While he fits the leg, the guard stands with his back turned. Waiting for him, or not wanting to watch; hard to say.","c0101.a.r.x":"Below the knee there is only folded cloth, and the cold settles into it. While he gets the crutch under his arm, the guard stands with his back turned. Waiting for him, or not wanting to watch; hard to say.","c0101.b":"Lie there a little longer.","c0101.b.r":"“Five minutes.” The guard sighs and walks away. Five minutes is shorter than it sounds.","c0102.t":"On the next bench, an old man folds his newspaper. “First time, isn't it? It shows. You hold your bag too tight.” He laughs with a mouth missing a few teeth.","c0102.a":"Ask where the meal center is.","c0102.a.r":"The old man draws a map in the dirt with a stick. Across the big road, a red brick building. “From half eleven. Come late and there's only soup.”","c0102.b":"Say he will find it himself.","c0102.b.r":"“Fair enough. That's a way too.” The old man opens his paper again.","c0103.t":"Nothing since lunch yesterday. The hollow in his stomach has grown loud enough to hear, and right then, across the park, someone tears open a bag of bread.","c0103.p":"Polished shoes click past the bench, a briefcase swinging beside them. They don't slow down.","c0103.in":"When you're hungry, your thoughts get narrow.","c0103.still":"The thoughts he was holding drift away, one by one.","c0103.1":"Look in the trash can.","c0103.2":"Walk toward the meal center.","c0103.3":"Say hello to the person eating bread.","c0103.4":"Write today's plan in the notebook.","c0103.1.r":"Under an empty cup, only crumpled newspaper; nothing that could ease the hunger. Only then does he remember the old man's directions to the meal center.","c0103.2.r":"On a cold path every step costs a little more than it should. Crossing the big road the way the old man told him, he feels the cold climb from his toes.","c0103.2.r.u":"On a cold path every step costs a little more than it should. He follows the smell of soup across the big road, and the cold climbs from his toes.","line.front":"He is near the front of the line.","line.mid":"The line already reaches the corner. He takes his place in the middle.","line.back":"By the time he arrives, the line has folded back on itself twice.","c0104.t":"Ladle in hand, the woman behind the counter looks up. “First time here? What's your name?” Someone behind him clears his throat. When did he last say his own name out loud?","c0104.a":"“{hero}.”","c0104.a.r":"“{hero}, it's hot. Be careful.” Steam rises from the bowl. The way she says his name is warmer than the soup.","c0104.b":"Just lower his head.","c0104.b.r":"She doesn't ask again, only adds another ladle of soup. The bowl, held in both hands, finds its way to a corner table.","ret.t":"As the soup goes down, the thoughts he couldn't hold this morning return, one by one. Around then the woman turns a flyer over and slides it across with a pen.","ret.rest":"Say thank you and rest a while.","ret.rest.r":"“Not at all.” She turns away smiling, and for a while there is only the sound of spoons.","draw.q":"The photograph is old. {son} was three then. The pencil waits above the paper.","draw.d1":"Draw the ears, a little big.","draw.d2":"Draw the hair at the crown.","draw.d3":"Draw the dimple on one cheek.","draw.r0":"A face he couldn't picture this morning. A round face.","draw.r.d1":"The ears are a little big. His hand remembers before he does.","draw.r.d2":"A little hair stands up at the crown, just as it does in the photo.","draw.r.d3":"One cheek has a small dimple. The pencil lingers there a moment.","draw.fold":"He folds the paper twice and puts it in the bag, next to the photo.","choi.t":"{N02} checks the gate before speaking. “If you are going that way, could you bring back a coffee?” He explains the payment before {hero} decides. The request stays separate from the order to leave the path.","choi.a":"Do the errand.","choi.b":"Keep to today's route.","choi.a.r":"{N02} takes the cup. “Thank you for bringing it back.” He moves a small box away from the path before {hero} lifts his bag again.","alt.u1.park.guard2":"The park in the morning. A guard in a cap stands by the gate. A man sits on the bench.","p01.t":"For the third time today the same shoes click past the bench, and this time the rhythm slows.","p01.t7":"Across the square, the same shoes click past for the third time today, and this time the rhythm slows.","p01.a":"“Hello.”","p01.b":"Look down at the ground.","p01.ok":"The footsteps stop. “Hello,” says a voice above him. He looks up, and for the first time there is a face.","p01.down":"The footsteps don't stop; they fade. Where a face should be, there is only shadow.","p01.no.1":"“Hello.” The shoes speed up; whoever it is, he is late for something. The face goes by too fast to keep.","p01.no.2":"“Hello.” A bus pulls away at the same moment. The man walks on without turning round.","p01.no.3":"The man is on the phone. He nods once toward the hello and keeps talking. Half of the face stays in shadow.","c0105.t":"The streetlights come on one by one. The bench looks wider than it did by day, and the wind is sharper. From the underpass comes the sound of someone dragging a box.","night2.t":"The lamps come on. Tonight the wind is thin and sharp, and finds its way in at every seam.","nt.here.L1":"Lie down on the bench.","nt.here.L4":"Lie down on the cardboard.","nt.here.L7":"Sleep sitting against the fountain wall.","nt.go.L1":"Go back to the bench.","nt.go.L4":"Go to the underpass.","nt.go.L7":"Go to the square.","nt.r.L1":"A few stars. Only as many as he can count.","nt.r.L4":"Under the fluorescent light, people shift their boxes one sheet each. No one speaks, but a space opens.","nt.r.L7":"The dry fountain's wall keeps off half the wind.","night.note":"Before sleep, he opens the notebook. On the first page: “{note}”","night.note0":"Before sleep, he opens the notebook. The first page is still empty.","x0201.t":"A woman in a green vest kneels beside the bench. “I'm from the Morning Path Center. We help people find a place to stay and work.” She hands {hero} a card. Then she adds, more quietly, “The director of Sunshine House asked me to give you this.” It is a letter. A family has asked to adopt {son}. The director wants to know what his father thinks.","x0201.t4":"At the mouth of the underpass, a woman in a green vest kneels beside his cardboard. “I'm from the Morning Path Center. We help people find a place to stay and work.” She hands {hero} a card. Then she adds, more quietly, “The director of Sunshine House asked me to give you this.” It is a letter. A family has asked to adopt {son}. The director wants to know what his father thinks.","x0201.t6":"In the hospital waiting room, a woman in a green vest kneels beside his chair. “I'm from the Morning Path Center. We help people find a place to stay and work.” She hands {hero} a card. Then she adds, more quietly, “The director of Sunshine House asked me to give you this.” It is a letter. A family has asked to adopt {son}. The director wants to know what his father thinks.","x0201.a":"Go to Sunshine House today.","x0201.b":"For his sake, go with the center alone.","x0201.c":"Sign the consent.","x0201.a.r":"“Visiting is in the afternoon and the evening.” She writes it on the back of the card. “There's a sink by the door. They let you wash first.”","x0201.bd":"Five days until his son's birthday.","cf.end":"This choice ends this story here, on the second day. It is one way of loving him, and the story will not judge it.","cf.think":"Think again","cf.b":"Go with the center","cf.c":"Sign","e0a.1":"The center's van smells of coffee and wet coats. Nobody asks him to talk.","e0a.2":"In the first month, he sleeps in a shared room and learns to wake without fear.","e0a.3":"In the third month, he drives a forklift again, slowly, on a new leg.","e0a.4":"Every Sunday he walks past Sunshine House. He does not go in. Through the window, a boy is drawing.","e0a.5":"He writes letters that he does not send. The first line is always the same: “{note}”","e0a.5n":"He writes letters that he does not send.","e0a.h":"Early ending — The Quiet Promise","e0a.l":"He is safe. He is working. And a window is still between them.","e0b.1":"He signs his name slowly, so that it looks like his own.","e0b.2":"The center helps him find a room, then a job, then a reason to keep the room.","e0b.3":"In spring, the director sends a photo. {son} is standing between two people, holding a dinosaur.","e0b.4":"On the back, in a child's handwriting: “This is my new house.”","e0b.5":"{hero} puts the photo above his small table. Every morning, he says the words he once wanted to say: “{note}”","e0b.5n":"{hero} puts the photo above his small table.","e0b.h":"Early ending — A New Home","e0b.l":"He kept his promise in another way.","e0.other":"The other road, the one that goes to Sunshine House today, is still there in a new story.","c0202.who.k":"{N01} sees him in the line and lifts the ladle a little.","c0202.who.u":"The woman at the counter sees him in the line and lifts the ladle a little.","c0202.say.n":"“{hero}. You came back.”","c0202.say.u":"“You came back.”","c0202.t2":"Her eyes rest for a moment on the Morning Path card sticking out of his pocket.","c0202.a":"Ask the way to Sunshine House.","c0202.a.r":"She draws the way past the hospital on a napkin. “This way is quicker. There's a hill, but no stairs.”","c0202.b":"Save a bread roll for later.","c0202.b.r":"He wraps the roll in a napkin and puts it in his pocket. For a while the pocket is warm.","lunch.front":"A full bowl, still too hot to hold.","lunch.mid":"A full bowl. The bread runs out two people behind him.","lunch.back":"Only soup is left by the time he reaches the counter.","m01.ent":"“You can wash your hands here.” At the sink the director points to, he folds his coat over one arm, and his eyes go first to a small pair of shoes by the inner door.","m01.wash":"The water is warm. He scrubs the grey from the lines of his knuckles.","m01.go":"Dry his hands.","m01.dir":"By the door, the director speaks quietly. “The family can wait. Nothing will be decided without you.”","m01.ask":"Her voice drops further. “As you asked, I won't tell him first. That's yours to tell.” A pause. “Just don't make him wait too long.”","m01.nod":"Nod.","m01.meet":"“He knew your mom and dad,” the director says, but {son} stays close to her side. “Who are you, Mister?” His hand comes down before it reaches the boy's hair.","m01.det.d1":"The ears are a little big. They have not changed.","m01.det.d2":"At the crown, a little hair still stands up.","m01.det.d3":"When he speaks, a dimple appears on one cheek.","m01.det.0":"He looks for the face from the photograph and finds it slowly, one part at a time.","m01.a":"Ask about the swing.","m01.b":"Let him choose a seat.","m01.a.r":"“Which swing do you like?” A small finger finds one through the window without hesitating. “The blue one. The other one makes a noise.” While the boy looks out, he stands beside him, saying nothing.","m01.b.r":"{son} pulls a chair a little away from the door. “You can sit there.” When he sits, the boy, who has been standing, drags the other chair over.","m01.out":"At the door, {son} turns back. “I saw a little dinosaur on a key ring.” He shows its size with two fingers. The director waits until he finishes speaking.","m01.snack":"On the way out, the director puts a packet of crackers in his hand. “For the road.”","m01.miss":"Across the city, the lights in the windows of Sunshine House go out one by one.","mina.t":"Behind the counter, a young clerk is checking dates on the rice balls. She sets three aside, then looks at him. “These expire at midnight. I'd throw them out anyway.”","mina.a":"Take them and say thanks.","mina.b":"Take one and leave the rest.","mina.a.r":"“I'm Mia,” she adds, as offhand as handing over the receipt.","mina.b.r":"She raises an eyebrow, then puts the other two under the counter. “They'll be here tomorrow too.”","d3.slug":"Day 3 · Rain","d3.t1":"Rain before light. It finds the gap between the bench slats and the gap in his collar.","d3.t4":"Rain before light. At the mouth of the underpass, grey lines of rain hang straight down like a blind.","c0301.leg":"Where the prosthetic meets the knee, the damp makes it sting.","c0301.crutch":"Under his arm, where the wet crutch sits, the skin rubs raw.","omen":"The sky is one shade heavier. Near the square, strangers are lingering.","d3.a":"Wait out the rain in the underpass.","d3.a.s":"Dry. Late for the meal line.","d3.b":"Line up early at the meal center.","d3.b.s":"Wet. Near the front of the line.","d3.m.a":"He decides to wait under the fluorescent tubes until the rain thins.","d3.m.b":"To be among the first ten, he has to go now. He steps out into the rain.","c0302.t":"People sheltering from the rain crowd the mouth of the underpass. Wet boxes lean against the wall to dry.","c0302.walt":"{N03} comes in without an umbrella and shakes off the water. “Rainy days, you get your wash for free.” A few people laugh.","c0302.t1":"The rain shows no sign of letting up.","c0302.road":"There is still a way to go to the meal center.","c0302.go":"Walk toward the meal center.","c0302.line":"At the door of the meal center he stands with the first ten. Rain pools on his shoulders.","c0302.wait":"Wait in the line.","c0302.wait.r":"When the door opens, steam rises from every coat.","c0302.stay":"He waits for the rain to thin.","c0302.late":"The line at the meal center will already be long.","c0303l.t":"The hands with the ladles are busy. Today the smell of wet coats is stronger than the soup.","c0303l.a":"Take a bowl of soup.","d3.p01":"Under an umbrella, the man with the briefcase nods once as he passes. The face is still there.","d3.hosp":"In the afternoon, the rain pushes him toward the hospital waiting room.","c0303.in":"Go into the hospital.","cut.intake":"An old record comes up on the intake screen. Five years ago, a rainy night, the emergency room.","cut.go":"Take a number.","s01.t":"{N05} places a form beside the examination bed. “This is for an assessment. It does not promise a new leg today.” {hero} checks the first line before taking the pen.","s01.a":"Ask about the documents.","s01.b":"Keep the notice for later.","s01.a.r":"“Bring the confirmation from the kitchen first.” She writes down the hospital hours. {hero} puts the notice where it will stay dry.","s01.b.r":"He folds the notice into the dry pocket, next to the card from the center.","c0304.t":"The rain stops. The wet cardboard starts to smell.","d3.night":"Near morning he dreams of the forklift: the forks rising, the pallet steady. His hands have not forgotten where a single lever is.","c0304.bd":"Four days until his son's birthday.","col.t":"The cold seeps all the way into his head. After that, he remembers nothing.","col.r":"He wakes under a white ceiling. Someone has taken off his wet shoe. “You collapsed by the road,” a nurse says. “Rest. Then eat something.”","col.rest":"Lie still and rest.","col.after":"By the time he can sit up, the light in the window has moved.","loc.L1":"Frost on the slats where no one sat. The lamp hums above the path.","loc.L1.n":"The lamps are on. The bench looks wider than it does by day.","loc.L2":"Red brick, a steamed window, a line that starts before the door opens.","loc.L2.c":"The door is shut. A paper sign: lunch from half past eleven.","loc.L3":"A tiled room that smells of bleach. The tap runs cold, and colder if he waits.","loc.L4":"Fluorescent tubes, cardboard laid edge to edge, the low hum of traffic overhead.","loc.L5.c":"The gate is shut. A sign: visiting in the afternoon and evening, on visiting days.","loc.L5.done":"The swing moves a little in the wind. Today's visit is over.","loc.L6":"A waiting room with numbered tickets and a radiator that ticks.","loc.L7":"Pigeons, a fountain switched off for winter, and a red box for donations.","loc.L8":"Bright aisles behind glass. A bell rings each time the door opens.","loc.L8.c":"The store is lit, but the clerk who lets him stay comes in the evening.","loc.L10":"Wire bales, a scale with a shaking needle, a man in gloves who does not look up.","loc.L10.c":"The gate is chained. The scrapyard buys in the morning, the afternoon and the evening.","hub.lunch":"Lunch is being served at the meal center.","hub.visit":"It is visiting time at Sunshine House.","hub.visit.last":"The last visiting hour of the day.","tl.visit.4":"Today's visit runs until the evening. If he leaves for Sunshine House now, he arrives in the afternoon.","tl.visit.5":"Today's visit runs until the evening. If he leaves for Sunshine House now, he arrives in the evening, the last visiting hour.","tl.visit.now":"To reach today's visit, he has to leave for Sunshine House now. Anything else first, and the visit moves to the next date.","tl.visit.gone":"Today's visiting hours are out of reach from here now. The next visiting day is day {d}.","tl.visit.gone0":"Today's visiting hours are out of reach from here now.","tl.visit.7.4":"The birthday visit is in the afternoon only. If he leaves for Sunshine House now, he arrives in time.","tl.visit.now.7":"The birthday visit is in the afternoon only. To reach it, he has to leave for Sunshine House now.","tl.van":"The director's van leaves from here in the afternoon and the evening. It reaches the visit in the same part of the day.","tl.van.7":"The director's van leaves from here in the afternoon. The birthday visit is in the afternoon only.","tl.dinner":"The shelter serves dinner in the evening. From the meal centre or the underpass he can go straight there.","tl.both":"This evening holds either the visit or the shelter's dinner, not both.","go.t":"Where to go?","go.L1":"Go to the park bench.","go.L2":"Go to the meal center.","go.L3":"Go to the public restroom.","go.L4":"Go to the underpass.","go.L5":"Go to Sunshine House.","go.L6":"Go to the hospital.","go.L7":"Go to the square.","go.L8":"Go to the corner store.","go.L9":"Go to the shelter.","go.L10":"Go to the scrapyard.","go.back":"Stay here.","go.s.1":"One step","go.s.1r":"One step · crosses the big road","go.s.2":"A walk","go.s.2r":"A walk · crosses the big road","go.s.3":"A long way","go.s.3r":"A long way · crosses the big road","go.s.lunch":"Arrive for lunch","go.s.visit":"Arrive for the visit","mv.1":"A short walk. The cold gets in through the gap at the knee.","mv.2":"A near path, and still his good leg tires first.","mv.3":"A long way on one good leg. He rests twice to let the ache settle.","mv.road":"At the big road, he waits for the light with everyone else.","mv.rain":"Rain runs down inside his collar.","fa.beg":"Hold out a hand.","fa.scrap":"Collect cans and cardboard.","fa.sell":"Sell what he collected.","fa.bread":"Buy a bread roll.","fa.warm":"Warm up in the waiting room.","fa.clean":"Help the cleaner pick up the litter.","fa.help":"Help wipe the tables.","fa.wash":"Wash his face and hands.","fa.rest":"Sit for a while and rest.","fa.rest.L1":"Lean back on the bench and rest.","fa.eat":"Eat the bread from the napkin.","fa.eat.r":"Cold now, and a little flattened. It still tastes of lunch.","fa.rest.L1.1":"He leans back. The ache where the prosthetic meets the knee settles for a while.","fa.rest.L1.1.x":"He leans back. The ache under his arm, where the crutch sits, settles for a while.","fa.rest.L1.2":"Two pigeons come right up to his feet, find nothing, and leave.","fa.rest.L1.3":"Across the road, a window lights up and goes dark again.","fa.rest.L4":"A tube flickers and steadies. Someone's radio murmurs low.","fa.rest.L6":"A chair by the radiator. The waiting number changes five times.","fa.rest.L2":"A cleared table. It smells of the wiping cloth.","fa.rest.r":"He sits for a while and lets his breath settle.","fa.scrap.1":"Two cans, one flattened box. Each time he bends, the knee above the prosthetic complains.","fa.scrap.1.x":"Two cans, one flattened box. Each time he bends, the crutch slides on the wet ground.","fa.scrap.2":"Behind the recycling bins, a box. He peels off the tape and flattens it.","fa.scrap.3":"One can still has a little drink in it. He pours it out and steps it flat.","fa.scrap.few":"One can, rolled under a bench. Someone has already been through the rest.","fa.scrap.rain":"Wet cardboard is heavy and worth less. He picks out the dry pieces.","fa.scrap.again":"He looks into the same bins again. Nothing has changed since morning.","fa.scrap.full":"The bag will not take any more.","fa.scrap.note":"What he picks up is not money yet. At the scrapyard the scale turns it into coins.","fa.sell.1":"The scale needle shakes, then settles. A few coins drop into his palm.","fa.sell.2":"The man in gloves looks up for the first time. “Dry boxes only.”","fa.sell.3":"The cans clatter out of the bag. The price is quieter.","fa.wash.1":"Cold water, then the mirror. His eyes meet the man's in it a little longer.","fa.wash.2":"Without soap, he scrubs at the dark lines under his nails.","fa.wash.3":"He wets his hair and combs it back with his fingers.","fa.wash.4":"He brushes off his collar and folds his sleeves back once.","fa.help.1":"The woman hands him a cloth. “I'm Carter. Everyone here says Ms. Carter. Thank you.” The tables shine in long wet stripes.","fa.help.2":"{N01} rinses, he dries. No words, but the rhythm matches.","fa.help.3":"He turns the chairs up onto the tables. The whole floor comes into view.","fa.warm.1":"The radiator ticks. One number is called, then the next.","fa.warm.2":"Someone has left a newspaper. Today's date.","fa.warm.3":"A nurse glances down at his wet shoes as she passes.","fa.bread.r":"The wrapper crackles. He eats half standing by the door, then the other half.","fa.beg.1":"Shoes pass. Some slow down; most don't. A few coins, and a long time looking at the ground.","fa.beg.2":"He sets a paper cup in front of him. It is a long time before the first coin sounds.","fa.beg.3":"Someone opens a wallet, closes it again, and walks on.","fa.beg.4":"A girl tugs her mother back and sets down a coin. The mother does not look at him.","fa.beg.known":"A coin lands in his open hand. He looks up: the face that greeted him. The man nods once and walks on without a word.","fa.beg.again":"The same spot, the same shoes. They pass a little faster than before.","fa.beg.none":"The cup stays as it was. The street has already given what it had to give today.","fa.beg.insult":"“Get a job.” The voice is gone before he can look up.","fa.clean.ok":"The cleaner holds the bag open for him. When it is full, she looks at him properly for the first time: a face, lined and awake.","fa.clean.no":"The cleaner takes the bag without a word and moves on to the next bin.","talk.N03.k":"Say a word to the old man.","talk.N03.1":"“Rice today, not just soup,” the old man says, folding his paper.","talk.N03.2":"The old man brushes off one end of the bench with his palm. An invitation.","talk.P07.k":"Say a word to the cleaner.","talk.P07.1":"“Mind your step. It's iced over there.”","talk.P07.2":"The cleaner leans on her broom and looks at the sky. He looks too.","talk.N01.k":"Say a word to the woman at the counter.","talk.N01.1":"“Did you eat properly?” She lifts the ladle without waiting for an answer.","talk.N01.2":"{N01} slides the last roll to the edge of the tray.","talk.L4.k":"Say a word to the people nearby.","talk.L4.1":"The man across turns his radio down a notch, so he can sleep.","talk.L4.2":"Someone pushes one more sheet of cardboard his way. Nobody asks his name.","talk.N05.k":"Say a word to the nurse.","talk.N05.1":"“No need for a ticket today. Just warm up.”","talk.N05.2":"{N05} sets a paper cup of water on the chair beside him.","talk.N04.k":"Say a word to the clerk.","talk.N04.1":"Mia takes a hand warmer from under the counter. “These don't expire.”","talk.N04.2":"Mia nods at him without looking up from the till.","find.1":"A single glove wedged between the bench slats. Not his size.","find.2":"A dog sniffs the prosthetic, wags its tail once, and trots on.","find.2.x":"A dog sniffs the crutch, wags its tail once, and trots on.","find.3":"The clock in the square runs a few minutes slow. Nobody fixes it.","find.4":"On the bus-stop billboard, a laughing child about {son}'s age.","find.5":"A box of crayons someone threw away. Only the blue is worn down.","find.6":"In the store window, for a moment, he takes his reflection for a stranger.","find.7":"A street sweeper sprays past. The driver lifts a hand in apology.","find.8":"Someone leaves a warm can of coffee at the end of the bench and does not look back.","lk.pickpocket":"Someone brushes past him near the square. By the meal center, he notices the coin pocket is lighter.","lk.pickpocket.g":"“Watch your bag,” says a voice he knows, without stopping. He pulls the strap tight. A moment later, someone brushes past him and finds nothing.","lk.fall":"On the wet stairs, his prosthetic foot slides. The heel of his hand scrapes the ground.","lk.fall.x":"On the wet stairs, the crutch slides out from under him. The heel of his hand scrapes the ground.","lk.fall.g":"On the wet stairs, a hand he knows catches his elbow before his foot goes.","lk.short":"The soup is thinner today. The ladle scrapes the bottom of the pot.","lk.short.g":"The soup is thinner today, but the ladle goes back into the pot once more for him.","lk.crackdown":"Two officers clear the benches. Everyone moves at once, and no one asks where to.","lk.crackdown.g":"Two officers clear the benches. The cleaner says something to one of them, and he waits until all the things are gathered.","lk.coin":"A coin lies by the curb.","lk.coffee":"Someone from the line hands him a paper cup of coffee and does not wait for thanks.","lk.bread":"The bakery's back door opens, and yesterday's bread, meant for the bin, is handed to him.","lk.bed":"A dry sheet of cardboard lies by the wall. It is thick and clean.","lk.night":"The night is longer than the cold alone would make it.","tr.name":"Today, for the first time, someone called him by his name.","tr.face":"Someone in the city has a face now.","tr.hun.down.1":"His empty stomach speaks up again.","tr.hun.down.2":"His good leg grows heavy first.","tr.hun.down.3":"His mouth goes dry. Swallowing doesn't help.","tr.hun.down.4":"The gaps between his steps grow longer.","tr.hun.up.1":"The shaking in his hands eases.","tr.hun.up.2":"His stomach goes quiet.","tr.hun.up.3":"Warmth spreads from somewhere inside.","tr.hun.up.4":"There is room, now, to think about the next step.","tr.hp.down.1":"The cold settles into his joints.","tr.hp.down.2":"The place where the prosthetic meets the knee stings.","tr.hp.down.2.x":"The place under his arm, where the crutch sits, stings.","tr.hp.down.3":"A cough, once, long.","tr.hp.down.4":"His body follows a beat behind.","tr.hp.up.1":"The ache loosens its grip.","tr.hp.up.2":"His shoulders finally come down.","tr.hp.up.3":"His breath goes a little deeper.","tr.se.down.1":"His eyes stay on the ground a little longer.","tr.se.down.2":"His shoulders curl inward.","tr.se.down.3":"His voice gets smaller, in case anyone is listening.","tr.se.down.4":"He turns up his collar.","tr.se.up.1":"His back straightens a little.","tr.se.up.2":"Lifting his head takes a little less effort.","tr.se.up.3":"His voice comes back to its own size.","tr.se.up.4":"If someone called his name, he could answer.","tr.ho.up.1":"The light looks a little warmer.","tr.ho.up.2":"He touches the photograph in his pocket, once.","tr.ho.up.3":"Tomorrow feels less far away.","tr.ho.up.4":"Colour seeps into one corner of the world.","tr.ho.down.1":"The colours step back.","tr.ho.down.2":"He reaches for the photograph, then doesn't.","tr.ho.down.3":"He decides not to think about tomorrow.","tr.money.up.1":"The coin pocket is heavier.","tr.money.up.2":"A few coins grow warm in his palm.","tr.money.down.1":"The coin pocket is lighter.","tr.money.down.2":"He decides not to count what is left.","tr.b.hun.3":"Hunger arrives before any thought.","tr.b.hun.4":"The edges of things go white. He has to sit.","tr.b.hp.3":"His body's warnings come short and sharp.","tr.b.se.3":"His eyes will not come up from the ground.","tr.b.se.4":"His breath comes short. He can see only the next step.","tr.b.ho.1":"Colours have been coming back, one by one.","item.photo":"The photograph of {son}, soft at one corner.","item.drawing":"The drawing on the back of a flyer, folded twice.","item.card":"The Morning Path Center card. Visiting hours on the back.","item.notice":"The hospital notice, kept dry.","item.bread":"A bread roll wrapped in a napkin.","item.scrap":"Cans and flattened cardboard","alt.u1.park":"A winter park. A man sits at the end of a bench, away from the lamp.","alt.u1.park.guard":"A guard's flashlight falls on a man lying on the bench.","alt.u1.park.walt":"Two benches. On the next one, an old man with a newspaper.","alt.u1.park.p01":"A man with a briefcase walks past the bench.","alt.u1.park.worker":"A woman in a green vest kneels beside the bench.","alt.u1.park.stand":"A man stands up beside the bench.","alt.u1.park.lie":"The park at night. A man lies on the bench.","alt.u1.kitchen":"A free meal center. A volunteer holds a ladle behind the counter. A bowl of soup is steaming.","alt.u1.kitchen.seat":"The meal center after lunch. A man sits at a side table.","alt.u1.kitchen.give":"A woman slides a flyer and a pen across the table to a seated man.","alt.u1.house.door":"Inside Sunshine House. By the door, the director stands near a sink.","alt.u1.house.meet":"A room at Sunshine House. A director stands with a small boy. A man stands a little apart. Through the window, two swings, one of them blue.","alt.u1.house.swing":"A man and a boy stand at the window. Outside, the blue swing moves.","alt.u1.house.seat":"A man sits on a chair; a boy pulls another chair beside him.","alt.u1.house.out":"The gate of Sunshine House. A yard with two swings, one of them blue.","alt.u1.L3":"A tiled public restroom. A man stands at a sink under a bare bulb.","alt.u1.L4":"An underpass lit by green-white tubes. People sleep on cardboard along the wall.","alt.u1.L4.worker":"In the underpass, a woman in a green vest kneels beside a man.","alt.u1.L6":"The hospital. A green cross glows above the door.","alt.u1.L6.in":"A hospital room. A nurse stands beside a seated man.","alt.u1.L6.bed":"A hospital bed under a white ceiling.","alt.u1.cut":"Two headlights in the rain. Then the screen turns white.","alt.u1.L7":"A city square with a stopped fountain and a red donation box.","alt.u1.L7.p01":"In the square, a man with a briefcase slows down.","alt.u1.L8":"A corner store glowing behind glass.","alt.u1.L10":"A scrapyard with wire bales and a scale.","alt.u1.end.van":"A small van parked on a street in the morning.","alt.u1.end.room":"A small room with one window and a table.","alt.u1.end.work":"A warehouse floor with a forklift.","alt.u1.end.window":"A dark street with a single window of light. A child inside."}}</script><!-- HS:MOD L-en-U1 END -->
<!-- HS:MOD L-ko-U1 START ff2ffa50d37271c7 --><script type="application/json" data-hs-pack data-hs-lang="ko" data-hs-mod="L-ko-U1">{"id":"L-ko-U1","lang":"ko","unit":1,"strings":{"c0101.t":"누군가 벤치 다리를 발로 툭툭 친다. “아저씨, 여기서 자면 안 된다니까.” 경비원의 손전등이 {hero}의 얼굴을 지나 의족 위에서 멈춘다. 불빛이 잠깐 머뭇거린다.","c0101.t.x":"누군가 벤치 다리를 발로 툭툭 친다. “아저씨, 여기서 자면 안 된다니까.” 경비원의 손전등이 {hero}의 얼굴을 지나, 접어 올린 바짓단과 목발 위에서 멈춘다. 불빛이 잠깐 머뭇거린다.","c0101.a":"일어난다.","c0101.a.r":"무릎 아래가 차갑다. 의족을 끼우는 동안 경비원은 등을 돌리고 서 있다. 기다려 주는 건지, 보기 싫은 건지는 모르겠다.","c0101.a.r.x":"무릎 아래, 접어 올린 바짓단 속으로 찬 기운이 스민다. 목발을 겨드랑이에 끼우는 동안 경비원은 등을 돌리고 서 있다. 기다려 주는 건지, 보기 싫은 건지는 모르겠다.","c0101.b":"조금만 더 누워 있는다.","c0101.b.r":"“오 분이요.” 경비원이 한숨을 쉬고 간다. 오 분은 생각보다 짧다.","c0102.t":"옆 벤치의 노인이 신문지를 개며 말한다. “처음이지? 표가 나. 가방을 너무 꼭 안고 있거든.” 노인은 이가 몇 개 없는 입으로 웃는다.","c0102.a":"급식소가 어디냐고 묻는다.","c0102.a.r":"노인이 막대기로 흙바닥에 지도를 그린다. 큰길 건너, 붉은 벽돌 건물. “열한 시 반부터야. 늦으면 국만 남아.”","c0102.b":"혼자 알아보겠다고 한다.","c0102.b.r":"“그래, 그것도 방법이지.” 노인은 다시 신문을 펼친다.","c0103.t":"어제 점심 뒤로 들어간 것이 없다. 빈속이 울리는 소리가 귀에까지 차오를 무렵, 공원 건너편에서 누군가 빵 봉지를 뜯는다.","c0103.p":"서류 가방을 든 남자의 구두 소리가 벤치 앞을 스쳐 간다. 멈출 기색은 없다.","c0103.in":"배가 고프면, 생각이 좁아진다.","c0103.still":"붙잡고 있던 생각들이 하나씩 멀어진다.","c0103.1":"쓰레기통을 본다.","c0103.2":"급식소 쪽으로 걸음을 옮긴다.","c0103.3":"빵을 먹는 사람에게 인사한다.","c0103.4":"오늘 할 일을 수첩에 적는다.","c0103.1.r":"빈 컵 아래 구겨진 신문지뿐, 허기를 채울 만한 것은 보이지 않는다. 그제야 노인이 일러 준 급식소 길이 떠오른다.","c0103.2.r":"차가운 길에서는 한 걸음이 조금씩 더 비싸다. 노인이 일러 준 대로 큰길을 건너는 동안, 발끝부터 식어 간다.","c0103.2.r.u":"차가운 길에서는 한 걸음이 조금씩 더 비싸다. 국 냄새를 따라 큰길을 건너는 동안, 발끝부터 식어 간다.","line.front":"줄 앞쪽이다.","line.mid":"줄은 벌써 모퉁이까지 닿아 있다. 그는 중간에 선다.","line.back":"그가 도착했을 때, 줄은 이미 두 번 꺾여 있다.","c0104.t":"국자를 든 채 배식대 너머의 여자가 묻는다. “처음 오셨죠? 성함이 어떻게 되세요?” 줄 뒤에서 헛기침 소리가 난다. 마지막으로 제 이름을 소리 내어 말한 게 언제였더라.","c0104.a":"“{hero}입니다.”","c0104.a.r":"“{hero} 님, 뜨거우니까 조심하세요.” 국그릇에서 김이 오른다. 이름 뒤에 붙은 ‘님’이라는 글자가 국보다 뜨겁다.","c0104.b":"고개만 숙인다.","c0104.b.r":"여자는 더 묻지 않고 국을 한 국자 더 얹어 준다. 그릇을 받쳐 든 손이 구석 자리를 찾아간다.","ret.t":"국물이 목을 타고 내려가자, 아침에 붙잡지 못했던 생각들이 하나씩 돌아온다. 그 무렵 여자가 전단 한 장을 뒤집어 볼펜과 함께 건넨다.","ret.rest":"고맙다고 말하고 잠시 쉰다.","ret.rest.r":"“별말씀을요.” 웃으며 돌아서는 여자 뒤로, 한동안 숟가락 부딪는 소리만 남는다.","draw.q":"사진은 오래되었다. 그때 {son}은 세 살이었다. 연필이 종이 위에서 기다린다.","draw.d1":"조금 큰 귀를 그린다.","draw.d2":"정수리 머리카락을 그린다.","draw.d3":"볼의 보조개를 그린다.","draw.r0":"아침에는 떠올리지 못했던 얼굴이다. 동그란 얼굴.","draw.r.d1":"귀가 조금 크다. 그리다 보니 손이 먼저 기억해 낸다.","draw.r.d2":"정수리 머리카락이 조금 뻗쳐 있다. 사진 속 그 아이 그대로다.","draw.r.d3":"한쪽 볼에 작은 보조개. 연필 끝이 그 자리에서 잠시 머문다.","draw.fold":"그는 종이를 두 번 접어, 사진 옆에 넣는다.","choi.t":"{N02}는 입구를 살피고 말한다. “그쪽으로 가시면 커피를 가져다주실 수 있을까요?” {hero}가 결정하기 전에 비용을 설명한다. 심부름 부탁과 통로를 비워 달라는 말은 따로 한다.","choi.a":"심부름을 한다.","choi.b":"오늘의 동선을 따른다.","choi.a.r":"{N02}가 컵을 받는다. “가져다주셔서 고마워요.” {hero}가 가방을 다시 들기 전에, 그가 통로의 작은 상자를 옆으로 옮긴다.","alt.u1.park.guard2":"아침의 공원. 입구 옆에 모자를 쓴 경비원이 서 있다. 벤치에 한 남자가 앉아 있다.","p01.t":"오늘만 세 번째로 그 구두 소리가 벤치 앞을 지난다. 이번에는 박자가 조금 느려진다.","p01.t7":"광장 건너편에서 오늘만 세 번째로 그 구두 소리가 지난다. 이번에는 박자가 조금 느려진다.","p01.a":"“안녕하세요.”","p01.b":"땅을 내려다본다.","p01.ok":"구두 소리가 멈추고, “안녕하세요.” 하는 목소리가 내려온다. 고개를 들자 처음으로 그의 얼굴이 보인다.","p01.down":"구두 소리는 멈추지 않고 멀어진다. 얼굴이 있어야 할 자리에는 그림자만 남는다.","p01.no.1":"“안녕하세요.” 구두 소리가 오히려 빨라진다. 어딘가 늦은 사람이다. 얼굴은 너무 빨리 지나가 버린다.","p01.no.2":"“안녕하세요.” 하는 순간 버스가 출발한다. 남자는 돌아보지 않고 걸어간다.","p01.no.3":"남자는 통화 중이다. 인사 쪽으로 고개만 한 번 끄덕이고 통화를 이어 간다. 얼굴의 반은 그늘에 남는다.","c0105.t":"가로등이 하나씩 켜진다. 벤치는 낮보다 넓어 보이고, 바람은 낮보다 날카롭다. 지하도 쪽에서 누군가 박스를 끄는 소리가 난다.","night2.t":"가로등이 켜진다. 오늘 밤 바람은 가늘고 날카로워, 옷 솔기 틈까지 파고든다.","nt.here.L1":"벤치에 눕는다.","nt.here.L4":"박스 위에 눕는다.","nt.here.L7":"분수대 벽에 기대 잠을 청한다.","nt.go.L1":"벤치로 돌아간다.","nt.go.L4":"지하도로 간다.","nt.go.L7":"광장으로 간다.","nt.r.L1":"별이 몇 개 보인다. 셀 수 있을 만큼만.","nt.r.L4":"형광등 아래, 사람들이 박스를 한 장씩 비켜 준다. 아무도 말하지 않지만 자리가 생긴다.","nt.r.L7":"물 빠진 분수대 벽이 바람을 반쯤 막아 준다.","night.note":"잠들기 전, 수첩을 편다. 첫 장에 적힌 말: “{note}”","night.note0":"잠들기 전, 수첩을 편다. 첫 장은 아직 비어 있다.","x0201.t":"초록 조끼를 입은 여자가 벤치 옆에 무릎을 꿇는다. “새벽길 센터에서 왔어요. 머물 곳과 일자리를 찾도록 돕고 있어요.” 여자가 명함을 건넨다. 그리고 조금 더 조용히 덧붙인다. “햇살의 집 원장님이 이걸 전해 달라고 하셨어요.” 편지다. 한 가정이 {son}을 입양하고 싶다고 했다. 원장은 아버지의 생각을 알고 싶어 한다.","x0201.t4":"지하도 입구, 초록 조끼를 입은 여자가 그의 박스 옆에 무릎을 꿇는다. “새벽길 센터에서 왔어요. 머물 곳과 일자리를 찾도록 돕고 있어요.” 여자가 명함을 건넨다. 그리고 조금 더 조용히 덧붙인다. “햇살의 집 원장님이 이걸 전해 달라고 하셨어요.” 편지다. 한 가정이 {son}을 입양하고 싶다고 했다. 원장은 아버지의 생각을 알고 싶어 한다.","x0201.t6":"병원 대기실, 초록 조끼를 입은 여자가 그의 의자 옆에 무릎을 꿇는다. “새벽길 센터에서 왔어요. 머물 곳과 일자리를 찾도록 돕고 있어요.” 여자가 명함을 건넨다. 그리고 조금 더 조용히 덧붙인다. “햇살의 집 원장님이 이걸 전해 달라고 하셨어요.” 편지다. 한 가정이 {son}을 입양하고 싶다고 했다. 원장은 아버지의 생각을 알고 싶어 한다.","x0201.a":"오늘 햇살의 집에 간다.","x0201.b":"아이를 위해, 혼자 센터로 간다.","x0201.c":"동의서에 서명한다.","x0201.a.r":"“면회는 오후랑 저녁이에요.” 여자가 명함 뒷면에 적는다. “문 옆에 세면대가 있어요. 먼저 씻으셔도 돼요.”","x0201.bd":"아들의 생일까지 닷새.","cf.end":"이 선택은 이야기를 이틀째에 여기서 끝냅니다. 그를 사랑하는 한 가지 방식이며, 이야기는 이 선택을 판단하지 않습니다.","cf.think":"다시 생각한다","cf.b":"센터로 간다","cf.c":"서명한다","e0a.1":"센터의 승합차에서는 커피와 젖은 외투 냄새가 난다. 아무도 그에게 말을 시키지 않는다.","e0a.2":"첫 달, 그는 공동 숙소에서 잠을 자고, 두려움 없이 깨어나는 법을 다시 배운다.","e0a.3":"석 달째, 그는 새 의족으로 다시 지게차를 몬다. 천천히.","e0a.4":"일요일마다 그는 햇살의 집 앞을 지난다. 안으로 들어가지는 않는다. 창 안에서 한 아이가 그림을 그리고 있다.","e0a.5":"그는 부치지 않는 편지를 쓴다. 첫 줄은 언제나 같다. “{note}”","e0a.5n":"그는 부치지 않는 편지를 쓴다.","e0a.h":"조기 엔딩 — 조용한 약속","e0a.l":"그는 안전하다. 그는 일한다. 그리고 두 사람 사이에는 아직 창문 하나가 있다.","e0b.1":"그는 자기 이름처럼 보이도록 천천히 서명한다.","e0b.2":"센터는 그가 방을 구하도록 돕고, 일을 구하도록 돕고, 그 방을 지킬 이유를 찾도록 돕는다.","e0b.3":"봄에 원장이 사진 한 장을 보낸다. {son}이 두 사람 사이에 서서 공룡 인형을 안고 있다.","e0b.4":"사진 뒷면에 아이의 글씨가 있다. “여기가 내 새 집이에요.”","e0b.5":"{hero}는 작은 탁자 위에 사진을 붙인다. 아침마다 그는 언젠가 하고 싶었던 말을 한다. “{note}”","e0b.5n":"{hero}는 작은 탁자 위에 사진을 붙인다.","e0b.h":"조기 엔딩 — 새 가족의 집","e0b.l":"그는 다른 방식으로 약속을 지켰다.","e0.other":"다른 길, 오늘 햇살의 집으로 가는 길은 새 이야기에 그대로 있습니다.","c0202.who.k":"배식대의 {N01}이 줄 속의 그를 알아보고 국자를 조금 든다.","c0202.who.u":"배식대의 여자가 줄 속의 그를 알아보고 국자를 조금 든다.","c0202.say.n":"“{hero} 님, 또 오셨네요.”","c0202.say.u":"“또 오셨네요.”","c0202.t2":"주머니 밖으로 삐죽 나온 새벽길 센터 명함에 눈길이 잠깐 머문다.","c0202.a":"햇살의 집 가는 길을 묻는다.","c0202.a.r":"그녀가 냅킨에 병원을 지나는 길을 그린다. “이쪽이 빨라요. 언덕은 있어도 계단은 없어요.”","c0202.b":"빵 한 조각을 챙겨 둔다.","c0202.b.r":"빵을 냅킨에 싸서 주머니에 넣는다. 한동안 주머니가 따뜻하다.","lunch.front":"국그릇이 가득하다. 아직 손으로 들기에는 뜨겁다.","lunch.mid":"국그릇이 가득하다. 빵은 그 뒤로 두 사람째에서 바닥난다.","lunch.back":"배식대에 닿았을 때는 국만 남아 있다.","m01.ent":"“여기서 손 씻으시면 돼요.” 원장이 가리키는 세면대 앞에서 외투를 한쪽 팔에 걸치는데, 안쪽 문 옆의 작은 신발 한 켤레가 먼저 눈에 들어온다.","m01.wash":"물이 따뜻하다. 손가락 마디 주름에 낀 잿빛을 문질러 낸다.","m01.go":"손을 닦는다.","m01.dir":"문 옆에서 원장이 조용히 말한다. “그 가족 이야기는 기다려도 돼요. 아버님 없이 정하지 않을 거예요.”","m01.ask":"원장이 목소리를 더 낮춘다. “부탁하신 대로, 제가 먼저 말하지는 않을게요. 그건 아버님이 하실 말이에요.” 잠시 뒤에 덧붙인다. “다만 아이를 너무 오래 기다리게 하지는 마세요.”","m01.nod":"고개를 끄덕인다.","m01.meet":"“엄마와 아빠를 알던 분이야.” 원장의 말에도 {son}은 원장 곁에 붙어 선다. “아저씨 누구세요?” 아이 머리에 닿기 전에, 손이 먼저 내려간다.","m01.det.d1":"귀가 조금 크다. 그대로다.","m01.det.d2":"정수리의 머리카락이 아직도 뻗쳐 있다.","m01.det.d3":"말할 때 한쪽 볼에 보조개가 팬다.","m01.det.0":"사진 속 얼굴을 찾는다. 천천히, 한 군데씩.","m01.a":"그네 이야기를 묻는다.","m01.b":"앉을 자리를 맡긴다.","m01.a.r":"“어느 그네가 좋아?” 창밖을 향한 손가락이 망설임 없이 하나를 고른다. “파란 거요. 다른 건 소리가 나요.” 아이가 바깥을 보는 동안, 그 곁에 말없이 선다.","m01.b.r":"{son}이 의자 하나를 문에서 조금 떼어 놓는다. “거기 앉으세요.” 그 의자에 앉자, 잠시 서 있던 아이가 옆 의자를 끌어온다.","m01.out":"문 앞에서 {son}이 돌아본다. “작은 공룡 열쇠고리를 봤어요.” 아이가 손가락 두 개로 크기를 보여 준다. 원장은 아이의 말이 끝날 때까지 기다린다.","m01.snack":"나가는 길에 원장이 크래커 한 봉지를 손에 쥐여 준다. “가시는 길에 드세요.”","m01.miss":"도시 저편, 햇살의 집 창마다 불이 하나씩 꺼진다.","mina.t":"계산대 뒤의 젊은 점원이 삼각김밥 날짜를 확인한다. 세 개를 따로 밀어 두고, 그를 본다. “자정에 기한 지나요. 어차피 버리는 거예요.”","mina.a":"고맙다며 받는다.","mina.b":"하나만 받고 둔다.","mina.a.r":"“전 미나예요.” 영수증을 건네듯 무심하게 덧붙인다.","mina.b.r":"점원이 눈썹을 올리더니 나머지 둘을 계산대 아래로 넣는다. “내일도 여기 있을 거예요.”","d3.slug":"3일 · 비","d3.t1":"날이 밝기 전에 비가 온다. 벤치 틈과 옷깃 틈을 정확히 찾아 들어온다.","d3.t4":"날이 밝기 전에 비가 온다. 지하도 입구 앞으로 잿빛 빗줄기가 발처럼 곧게 드리운다.","c0301.leg":"의족이 닿는 자리가 축축하게 쓰라리다.","c0301.crutch":"젖은 목발이 닿는 겨드랑이가 쓸린다.","omen":"하늘이 한 톤 무겁다. 광장 쪽에 낯선 사람들이 서성인다.","d3.a":"지하도에서 비를 피한다.","d3.a.s":"몸은 마른다. 급식 줄에는 늦는다.","d3.b":"급식소 줄에 일찍 선다.","d3.b.s":"젖는다. 줄 앞쪽에 선다.","d3.m.a":"형광등 아래에서 빗줄기가 가늘어지기를 기다리기로 한다.","d3.m.b":"맨 앞 열 명 안에 들려면 지금 나서야 한다. 그는 빗속으로 나선다.","c0302.t":"지하도 입구에 비를 피하는 사람들이 모여 있다. 젖은 박스들이 벽에 기대어 마르고 있다.","c0302.walt":"{N03}가 우산도 없이 들어와 물을 턴다. “비 오는 날은 공짜로 세수하는 날이지.” 몇 사람이 웃는다.","c0302.t1":"빗줄기가 가늘어질 기미가 없다.","c0302.road":"급식소까지는 아직 길이 남았다.","c0302.go":"급식소 쪽으로 걷는다.","c0302.line":"급식소 문 앞, 맨 앞 열 명 사이에 선다. 빗물이 어깨에 고인다.","c0302.wait":"줄에서 기다린다.","c0302.wait.r":"문이 열리자, 외투마다 김이 오른다.","c0302.stay":"빗줄기가 가늘어지기를 기다린다.","c0302.late":"급식소에는 벌써 줄이 길 것이다.","c0303l.t":"국자를 든 손들이 바쁘다. 오늘은 젖은 외투 냄새가 국 냄새보다 진하다.","c0303l.a":"국그릇을 받는다.","d3.p01":"우산 아래에서 서류 가방의 남자가 지나가며 고개를 한 번 끄덕인다. 얼굴은 그대로 있다.","d3.hosp":"오후, 비에 밀려 병원 대기실 쪽으로 향한다.","c0303.in":"병원으로 들어간다.","cut.intake":"접수 화면에 오래된 기록 하나가 뜬다. 다섯 해 전, 비 오는 밤, 응급실.","cut.go":"번호표를 뽑는다.","s01.t":"{N05}가 진료 침대 옆에 서류를 놓는다. “상담 신청서예요. 오늘 새 의족을 약속하는 건 아니에요.” {hero}는 볼펜을 들기 전에 첫 줄을 확인한다.","s01.a":"필요한 서류를 묻는다.","s01.b":"안내문만 챙겨 둔다.","s01.a.r":"“급식소 확인서부터 가져오세요.” {N05}가 병원 운영 시간을 적는다. {hero}는 젖지 않을 곳에 안내문을 넣는다.","s01.b.r":"안내문을 접어 마른 주머니에 넣는다. 센터 명함 옆이다.","c0304.t":"비가 그친다. 젖은 박스에서 냄새가 올라온다.","d3.night":"새벽녘, 지게차 꿈을 꾼다. 포크가 올라가고, 팔레트는 흔들리지 않는다. 손은 레버의 자리를 하나도 잊지 않았다.","c0304.bd":"아들의 생일까지 나흘.","col.t":"추위가 머릿속까지 스며든다. 그 뒤로는 아무것도 기억나지 않는다.","col.r":"하얀 천장 아래에서 눈을 뜬다. 누군가 젖은 신발을 벗겨 두었다. “길가에서 쓰러지셨어요.” 간호사가 말한다. “쉬시고, 뭐라도 드세요.”","col.rest":"가만히 누워 쉰다.","col.after":"몸을 일으킬 수 있을 즈음, 창의 빛이 자리를 옮겼다.","loc.L1":"아무도 앉지 않은 자리에 서리가 앉았다. 길 위의 가로등이 웅웅거린다.","loc.L1.n":"가로등이 켜져 있다. 벤치는 낮보다 넓어 보인다.","loc.L2":"붉은 벽돌, 김 서린 창, 문이 열리기 전부터 시작되는 줄.","loc.L2.c":"문이 닫혀 있다. 종이 안내문: 점심은 열한 시 반부터.","loc.L3":"락스 냄새가 나는 타일 방. 수도꼭지를 틀면 찬물이 나오고, 기다리면 더 차가워진다.","loc.L4":"형광등, 가장자리를 맞대어 깐 박스, 머리 위로 낮게 울리는 차 소리.","loc.L5.c":"대문이 닫혀 있다. 안내문: 면회는 면회일의 오후와 저녁.","loc.L5.done":"바람에 그네가 조금 흔들린다. 오늘의 면회는 끝났다.","loc.L6":"번호표가 있는 대기실, 딱딱 소리를 내는 라디에이터.","loc.L7":"비둘기, 겨울이라 멈춘 분수, 그리고 빨간 기부함.","loc.L8":"유리 너머 환한 진열대. 문이 열릴 때마다 종이 울린다.","loc.L8.c":"가게에 불은 켜져 있지만, 그를 내쫓지 않는 점원은 저녁에야 온다.","loc.L10":"철사로 묶은 더미, 바늘이 떨리는 저울, 고개를 들지 않는 장갑 낀 남자.","loc.L10.c":"대문에 사슬이 걸려 있다. 고물상은 오전, 오후, 저녁에 물건을 받는다.","hub.lunch":"급식소에서 점심을 배식하고 있다.","hub.visit":"햇살의 집 면회 시간이다.","hub.visit.last":"오늘의 마지막 면회 시간이다.","tl.visit.4":"오늘 면회는 저녁까지다. 지금 햇살의 집으로 떠나면 오후에 닿는다.","tl.visit.5":"오늘 면회는 저녁까지다. 지금 햇살의 집으로 떠나면 마지막 면회 시간인 저녁에 닿는다.","tl.visit.now":"오늘 면회에 닿으려면 지금 햇살의 집으로 떠나야 한다. 다른 일을 먼저 하면 면회는 다음 날짜로 밀린다.","tl.visit.gone":"여기서는 이제 오늘 면회 시간에 닿지 못한다. 다음 면회일은 {d}일이다.","tl.visit.gone0":"여기서는 이제 오늘 면회 시간에 닿지 못한다.","tl.visit.7.4":"생일 면회는 오후에만 있다. 지금 햇살의 집으로 떠나면 시간에 닿는다.","tl.visit.now.7":"생일 면회는 오후에만 있다. 닿으려면 지금 햇살의 집으로 떠나야 한다.","tl.van":"원장님의 승합차가 오후와 저녁에 이곳에서 떠난다. 타면 같은 때에 면회에 닿는다.","tl.van.7":"원장님의 승합차가 오후에 이곳에서 떠난다. 생일 면회는 오후에만 있다.","tl.dinner":"쉼터 저녁은 저녁때다. 급식소나 지하도에 있으면 바로 갈 수 있다.","tl.both":"오늘 저녁에는 면회와 쉼터 저녁 가운데 하나만 할 수 있다.","go.t":"어디로 갈까?","go.L1":"공원 벤치로 간다.","go.L2":"급식소로 간다.","go.L3":"공중화장실로 간다.","go.L4":"지하도로 간다.","go.L5":"햇살의 집으로 간다.","go.L6":"병원으로 간다.","go.L7":"광장으로 간다.","go.L8":"편의점으로 간다.","go.L9":"쉼터로 간다.","go.L10":"고물상으로 간다.","go.back":"여기 있는다.","go.s.1":"한 걸음","go.s.1r":"한 걸음 · 큰길을 건넘","go.s.2":"걷는 길","go.s.2r":"걷는 길 · 큰길을 건넘","go.s.3":"먼 길","go.s.3r":"먼 길 · 큰길을 건넘","go.s.lunch":"점심에 맞춰 도착","go.s.visit":"면회에 맞춰 도착","mv.1":"짧은 길. 무릎 틈으로 찬 기운이 들어온다.","mv.2":"가까운 길인데도 성한 다리가 먼저 지친다.","mv.3":"성한 다리 하나로 가기엔 먼 길이다. 욱신거림이 가라앉도록 두 번 쉬어 간다.","mv.road":"큰길 앞에서, 다른 사람들과 함께 신호를 기다린다.","mv.rain":"빗물이 옷깃 안쪽으로 흘러든다.","fa.beg":"손을 내민다.","fa.scrap":"캔과 박스를 줍는다.","fa.sell":"모은 것을 판다.","fa.bread":"빵 하나를 산다.","fa.warm":"대기실에서 몸을 녹인다.","fa.clean":"청소부를 도와 쓰레기를 줍는다.","fa.help":"탁자 닦는 일을 돕는다.","fa.wash":"얼굴과 손을 씻는다.","fa.rest":"잠시 앉아 쉰다.","fa.rest.L1":"벤치에 등을 기대고 쉰다.","fa.eat":"냅킨에 싼 빵을 먹는다.","fa.eat.r":"식어서 조금 납작해졌다. 그래도 점심때의 빵 맛이 남아 있다.","fa.rest.L1.1":"벤치에 등을 기댄다. 의족이 닿는 자리의 욱신거림이 잠시 가라앉는다.","fa.rest.L1.1.x":"벤치에 등을 기댄다. 목발이 닿던 겨드랑이의 욱신거림이 잠시 가라앉는다.","fa.rest.L1.2":"비둘기 두 마리가 발치까지 왔다가 아무것도 없는 걸 알고 간다.","fa.rest.L1.3":"길 건너 아파트 창 하나에 불이 켜졌다가 다시 꺼진다.","fa.rest.L4":"형광등 하나가 깜빡이다 다시 켜진다. 누군가의 라디오가 낮게 흘러나온다.","fa.rest.L6":"라디에이터 옆 의자에 앉는다. 대기 번호가 다섯 번 바뀐다.","fa.rest.L2":"식사가 끝난 탁자에 잠시 앉는다. 행주 냄새가 난다.","fa.rest.r":"잠시 앉아 숨을 고른다.","fa.scrap.1":"캔 두 개, 납작한 박스 하나. 허리를 굽힐 때마다 의족 쪽 무릎이 시큰하다.","fa.scrap.1.x":"캔 두 개, 납작한 박스 하나. 허리를 굽힐 때마다 목발이 젖은 바닥에서 미끄러진다.","fa.scrap.2":"분리수거함 뒤에서 박스 한 장을 찾는다. 테이프를 떼어 내고 판판하게 편다.","fa.scrap.3":"캔 하나에 아직 음료가 조금 남아 있다. 쏟아 내고 밟아서 납작하게 만든다.","fa.scrap.few":"벤치 밑으로 굴러간 캔 하나. 나머지 쓰레기통은 누가 벌써 훑고 갔다.","fa.scrap.rain":"젖은 박스는 무겁고 값도 덜 나간다. 마른 것만 골라 든다.","fa.scrap.again":"같은 쓰레기통을 다시 들여다본다. 아침과 달라진 것이 없다.","fa.scrap.full":"가방에 더는 들어가지 않는다.","fa.scrap.note":"주운 것은 아직 돈이 아니다. 고물상 저울에 달아야 동전이 된다.","fa.sell.1":"저울 바늘이 흔들리다 멈춘다. 손바닥에 동전 몇 개가 떨어진다.","fa.sell.2":"장갑 낀 남자가 처음으로 고개를 든다. “박스는 마른 걸로만.”","fa.sell.3":"자루를 쏟자 캔 소리가 요란하다. 값은 그만큼 나오지 않는다.","fa.wash.1":"찬물, 그리고 거울. 거울 속 얼굴과 조금 더 오래 눈이 마주친다.","fa.wash.2":"비누 없이 손톱 밑의 검은 때를 문질러 낸다.","fa.wash.3":"머리를 적셔 손가락으로 빗어 넘긴다.","fa.wash.4":"옷깃을 털고, 소매를 한 번 접는다.","fa.help.1":"여자가 행주를 건넨다. “박이에요. 다들 박 선생이라고 불러요. 고마워요.” 탁자 위에 젖은 줄무늬가 길게 남는다.","fa.help.2":"{N01}이 그릇을 헹구고 그가 닦는다. 말은 없어도 손이 맞는다.","fa.help.3":"의자를 탁자 위로 뒤집어 올린다. 바닥이 한눈에 들어온다.","fa.warm.1":"라디에이터가 딱딱 소리를 낸다. 번호 하나가 불리고, 다음 번호가 불린다.","fa.warm.2":"누군가 두고 간 신문을 편다. 오늘 날짜다.","fa.warm.3":"지나가던 간호사가 그의 젖은 신발을 한 번 내려다본다.","fa.bread.r":"포장지가 바스락거린다. 문 옆에 선 채로 반을 먹고, 나머지 반도 먹는다.","fa.beg.1":"구두들이 지나간다. 몇은 느려지고, 대부분은 그대로다. 동전 몇 개, 그리고 바닥만 보는 긴 시간.","fa.beg.2":"종이컵을 앞에 둔다. 한참이 지나서야 첫 동전 소리가 난다.","fa.beg.3":"누군가 지갑을 열었다가 다시 닫고 지나간다.","fa.beg.4":"여자아이가 엄마 손을 끌고 돌아와 동전을 내려놓는다. 엄마는 그를 보지 않는다.","fa.beg.known":"내민 손 위에 동전이 놓인다. 고개를 들자, 인사를 나눈 그 얼굴이다. 남자는 아무 말 없이 고개를 한 번 끄덕이고 간다.","fa.beg.again":"같은 자리, 같은 구두들. 아까보다 조금 더 빨리 지나간다.","fa.beg.none":"종이컵은 그대로다. 이 거리는 오늘 줄 만큼은 이미 주었다.","fa.beg.insult":"“일이나 해요.” 고개를 들기 전에 목소리는 멀어진다.","fa.clean.ok":"청소부가 봉투 입구를 벌려 잡아 준다. 봉투가 차자 청소부가 처음으로 그를 똑바로 본다. 주름지고 또렷한 얼굴이다.","fa.clean.no":"청소부는 말없이 봉투를 받아 들고 다음 쓰레기통으로 간다.","talk.N03.k":"노인에게 말을 건넨다.","talk.N03.1":"“오늘은 국 말고 밥도 나온대.” 노인이 신문을 접으며 알려 준다.","talk.N03.2":"노인이 손바닥으로 벤치 한쪽을 털어 준다. 앉으라는 뜻이다.","talk.P07.k":"청소부에게 말을 건넨다.","talk.P07.1":"“거기 얼었어요. 발 조심해요.”","talk.P07.2":"청소부가 빗자루에 기대 하늘을 본다. 그도 따라 본다.","talk.N01.k":"배식대의 여자에게 말을 건넨다.","talk.N01.1":"“제대로 드셨어요?” 대답을 기다리지 않고 국자를 든다.","talk.N01.2":"{N01}이 남은 빵 하나를 쟁반 끝으로 밀어 둔다.","talk.L4.k":"옆 사람들에게 말을 건넨다.","talk.L4.1":"맞은편 남자가 라디오 소리를 한 칸 줄인다. 그가 잘 수 있게.","talk.L4.2":"누군가 박스 한 장을 더 밀어 준다. 이름은 묻지 않는다.","talk.N05.k":"간호사에게 말을 건넨다.","talk.N05.1":"“오늘은 번호표 안 뽑으셔도 돼요. 몸만 녹이고 가세요.”","talk.N05.2":"{N05}가 옆 의자에 물 한 컵을 놓고 간다.","talk.N04.k":"점원에게 말을 건넨다.","talk.N04.1":"미나가 계산대 밑에서 손난로를 하나 꺼낸다. “이건 유통기한 같은 거 없어요.”","talk.N04.2":"미나가 계산기에서 눈을 떼지 않고 고개만 끄덕인다.","find.1":"벤치 틈에 장갑 한 짝이 끼어 있다. 그의 손에는 작다.","find.2":"개 한 마리가 의족 냄새를 맡고, 꼬리를 한 번 흔들고 간다.","find.2.x":"개 한 마리가 목발 냄새를 맡고, 꼬리를 한 번 흔들고 간다.","find.3":"광장 시계가 몇 분 늦다. 아무도 고치지 않는다.","find.4":"버스 정류장 광고판 속 아이가 웃고 있다. {son}과 비슷한 나이다.","find.5":"누가 버린 크레파스 한 통. 파란색만 닳아 있다.","find.6":"편의점 유리에 비친 자기 모습을 잠깐 다른 사람으로 본다.","find.7":"청소차가 물을 뿌리며 지나간다. 운전사가 미안하다는 듯 손을 든다.","find.8":"누군가 벤치 끝에 따뜻한 캔커피를 두고 간다. 돌아보지 않는다.","lk.pickpocket":"광장 근처에서 누군가 그를 스치고 지나간다. 급식소 앞에 와서야, 동전 주머니가 가벼워진 것을 안다.","lk.pickpocket.g":"“가방 조심하세요.” 아는 목소리가 걸음을 멈추지 않고 말한다. 그는 끈을 바짝 당긴다. 잠시 뒤, 누군가 그를 스치고 지나가지만 아무것도 얻지 못한다.","lk.fall":"젖은 계단에서 의족 쪽 발이 미끄러진다. 땅을 짚은 손바닥이 쓸린다.","lk.fall.x":"젖은 계단에서 목발이 미끄러진다. 땅을 짚은 손바닥이 쓸린다.","lk.fall.g":"젖은 계단에서 발이 미끄러지기 전에, 아는 손이 팔꿈치를 붙잡는다.","lk.short":"오늘은 국이 묽다. 국자가 솥 바닥을 긁는다.","lk.short.g":"오늘은 국이 묽지만, 국자가 그를 위해 한 번 더 솥으로 들어간다.","lk.crackdown":"경관 두 명이 벤치를 비운다. 모두가 한꺼번에 움직이고, 아무도 어디로 가냐고 묻지 않는다.","lk.crackdown.g":"경관 두 명이 벤치를 비운다. 청소부가 경관 한 명에게 무언가 말한다. 경관은 그가 짐을 다 챙길 때까지 기다려 준다.","lk.coin":"연석 옆에 동전 하나가 떨어져 있다.","lk.coffee":"줄에 선 누군가가 종이컵 커피를 건네고, 고맙다는 말을 기다리지 않는다.","lk.bread":"빵집 뒷문이 열리고, 버리려던 어제 빵이 그의 손에 건네진다.","lk.bed":"벽 옆에 마른 박스 한 장이 놓여 있다. 두툼하고 깨끗하다.","lk.night":"추위만으로는 설명되지 않을 만큼 밤이 길다.","tr.name":"오늘 처음으로 누군가 이름을 불러 주었다.","tr.face":"도시의 누군가에게 얼굴이 생겼다.","tr.hun.down.1":"빈속이 다시 소리를 낸다.","tr.hun.down.2":"성한 다리가 먼저 무거워진다.","tr.hun.down.3":"입안이 마른다. 침을 삼켜도 그대로다.","tr.hun.down.4":"걸음과 걸음 사이가 조금 벌어진다.","tr.hun.up.1":"손끝의 떨림이 조금 줄었다.","tr.hun.up.2":"배 속이 조용해진다.","tr.hun.up.3":"몸 안쪽부터 데워진다.","tr.hun.up.4":"다음 걸음을 생각할 여유가 생긴다.","tr.hp.down.1":"추위가 관절에 자리 잡는다.","tr.hp.down.2":"의족이 닿는 자리가 쓰라리다.","tr.hp.down.2.x":"목발이 닿는 겨드랑이가 쓰라리다.","tr.hp.down.3":"기침이 한 번, 길게 난다.","tr.hp.down.4":"몸이 반 박자 늦게 따라온다.","tr.hp.up.1":"욱신거림이 조금 풀린다.","tr.hp.up.2":"굳어 있던 어깨가 풀린다.","tr.hp.up.3":"숨이 조금 깊어진다.","tr.se.down.1":"시선이 바닥에 조금 더 오래 머문다.","tr.se.down.2":"어깨가 안으로 말린다.","tr.se.down.3":"누가 들을까, 목소리가 작아진다.","tr.se.down.4":"외투 깃을 세운다.","tr.se.up.1":"등이 조금 펴진다.","tr.se.up.2":"고개를 드는 일이 조금 덜 힘들다.","tr.se.up.3":"목소리가 제 크기로 돌아온다.","tr.se.up.4":"누가 이름을 부르면 대답할 수 있을 것 같다.","tr.ho.up.1":"빛이 조금 따뜻해 보인다.","tr.ho.up.2":"주머니 속 사진을 한 번 만져 본다.","tr.ho.up.3":"내일이라는 말이 덜 멀다.","tr.ho.up.4":"세상 한쪽에 색이 번진다.","tr.ho.down.1":"색이 한 걸음 물러난다.","tr.ho.down.2":"사진을 꺼내려다 그만둔다.","tr.ho.down.3":"내일은 생각하지 않기로 한다.","tr.money.up.1":"동전 주머니가 묵직해졌다.","tr.money.up.2":"동전 몇 개가 손바닥에서 따뜻해진다.","tr.money.down.1":"동전 주머니가 가볍다.","tr.money.down.2":"남은 동전을 세지 않기로 한다.","tr.b.hun.3":"배고픔이 어떤 생각보다 먼저 온다.","tr.b.hun.4":"눈앞 가장자리가 하얗게 번진다. 앉아야 한다.","tr.b.hp.3":"몸이 보내는 신호가 짧고 날카로워진다.","tr.b.se.3":"시선이 바닥에서 올라오지 않는다.","tr.b.se.4":"숨이 짧아진다. 눈앞의 한 걸음밖에 보이지 않는다.","tr.b.ho.1":"세상에 색이 하나둘 돌아와 있다.","item.photo":"모서리가 부드럽게 닳은 {son}의 사진.","item.drawing":"두 번 접은 전단 뒷면의 그림.","item.card":"새벽길 센터 명함. 뒷면에 면회 시간.","item.notice":"젖지 않게 챙긴 병원 안내문.","item.bread":"냅킨에 싼 빵 한 조각.","item.scrap":"캔과 납작한 박스","alt.u1.park":"겨울 공원. 가로등 빛이 닿지 않는 벤치 끝에 한 남자가 앉아 있다.","alt.u1.park.guard":"경비원의 손전등 빛이 벤치에 누운 남자 위에 떨어진다.","alt.u1.park.walt":"벤치 두 개. 옆 벤치에 신문을 든 노인이 있다.","alt.u1.park.p01":"서류 가방을 든 남자가 벤치 앞을 지나간다.","alt.u1.park.worker":"초록 조끼를 입은 여자가 벤치 옆에 무릎을 꿇는다.","alt.u1.park.stand":"한 남자가 벤치 옆에 일어서 있다.","alt.u1.park.lie":"밤의 공원. 한 남자가 벤치에 누워 있다.","alt.u1.kitchen":"무료 급식소. 봉사자가 배식대 뒤에서 국자를 들고 있다. 국그릇에서 김이 오른다.","alt.u1.kitchen.seat":"점심이 끝난 급식소. 한 남자가 구석 탁자에 앉아 있다.","alt.u1.kitchen.give":"여자가 앉아 있는 남자에게 전단과 볼펜을 밀어 준다.","alt.u1.house.door":"햇살의 집 안. 문 옆 세면대 곁에 원장이 서 있다.","alt.u1.house.meet":"햇살의 집의 방. 원장 곁에 작은 남자아이가 서 있다. 한 남자가 조금 떨어져 서 있다. 창밖에 그네 두 개, 그중 하나는 파란색이다.","alt.u1.house.swing":"남자와 아이가 창가에 서 있다. 바깥에서 파란 그네가 흔들린다.","alt.u1.house.seat":"남자가 의자에 앉아 있고, 아이가 옆 의자를 끌어온다.","alt.u1.house.out":"햇살의 집 대문. 그네 두 개가 있는 마당, 그중 하나는 파란색이다.","alt.u1.L3":"타일로 된 공중화장실. 한 남자가 전구 아래 세면대 앞에 서 있다.","alt.u1.L4":"녹백색 형광등이 비추는 지하도. 벽을 따라 사람들이 박스 위에 누워 있다.","alt.u1.L4.worker":"지하도에서 초록 조끼를 입은 여자가 한 남자 옆에 무릎을 꿇는다.","alt.u1.L6":"병원. 문 위에 초록 십자가가 빛난다.","alt.u1.L6.in":"병원 진료실. 앉아 있는 남자 곁에 간호사가 서 있다.","alt.u1.L6.bed":"하얀 천장 아래의 병원 침대.","alt.u1.cut":"빗속의 전조등 두 개. 그리고 화면이 하얗게 된다.","alt.u1.L7":"멈춘 분수와 빨간 기부함이 있는 도시 광장.","alt.u1.L7.p01":"광장에서 서류 가방을 든 남자가 걸음을 늦춘다.","alt.u1.L8":"유리 너머로 빛나는 편의점.","alt.u1.L10":"철사로 묶은 더미와 저울이 있는 고물상.","alt.u1.end.van":"아침 거리에 서 있는 작은 승합차.","alt.u1.end.room":"창 하나와 탁자가 있는 작은 방.","alt.u1.end.work":"지게차가 있는 물류 창고.","alt.u1.end.window":"어두운 거리에 불 켜진 창 하나. 안에 아이가 있다."}}</script><!-- HS:MOD L-ko-U1 END -->
