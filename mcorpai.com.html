<!-- HS:MOD L-en-U2 START 113df47d3988cc58 --><script type="application/json" data-hs-pack data-hs-lang="en" data-hs-mod="L-en-U2">{"id":"L-en-U2","lang":"en","unit":2,"strings":{"d5.slug":"Day 5 · Cold snap","d6.slug":"Day 6 · Getting ready","d7.slug":"Day 7 · Birthday","d4.dawn":"A grey morning. The visiting notice on the board says: this afternoon.","bd.4":"Three days until his son's birthday.","bd.5":"Two days until his son's birthday.","bd.6":"Tomorrow is his son's birthday.","bd.7":"Today {son} turns eight.","h.early":"On visiting days the meal centre opens a morning line first.","h.van":"On visiting days a van leaves from here for Sunshine House.","h.bday":"The birthday visit is this afternoon.","h.bday.am":"The visit is in the afternoon. There is still the morning.","h.shelter":"The shelter by the underpass takes people in tonight.","u2.paper":"Ask for a sheet of paper.","paper.r":"{N01} turns a flyer over and hands it to him. “The back is clean.”","u2.van":"Take the director's van.","van.r":"He sits in the back between the side-dish tins. The road he would have walked goes by the window quickly.","u2.wait":"Wait by the gate.","wait.r":"He waits by the railings. A light comes on in the kitchen, then the smell of something cooking.","u2.donate":"Put a coin in the red box.","don.r":"There is the sound of a coin reaching the bottom.","u2.buyBest":"Buy the big dinosaur.","buy.best.r":"The shop assistant takes the dinosaur down from the window. It does not fit in the bag. He carries it in both arms.","u2.buySmall":"Buy a small dinosaur keyring.","buy.small.r":"A small green dinosaur hangs from the display. The size {son} showed with two fingers.","buy.small.r0":"A small green dinosaur hangs from the display. He holds it up to the light once before paying.","item.toy_small":"small dinosaur keyring","item.toy_best":"big dinosaur","item.paper":"paper","item.blanket":"thermal blanket","loc.L9":"Bunk beds in rows, a high window, and one purple blanket on a bunk by the wall.","nt.here.L9":"Take the bunk by the wall.","nt.go.L9":"Go to the shelter.","nt.r.L9":"A staff member hands him a purple blanket. It smells of washing powder. The window is high and does not open.","l9.am":"At six the lights come on. The staff fold the blankets and open the door. The shelter is for the night.","l9.am.a":"Fold the blanket and go out.","l9.out":"He leaves the folded blanket at the end of the bunk.","key.t":"A key lies beside the bench. {N02} checks his pockets near the gate. {hero} picks up the key without opening the small door it fits.","key.a":"Return the key.","key.b":"Leave it where it is.","key.a.r":"{N02} closes his hand around it. “I have been looking along the whole path.” He checks the lock once, then puts the key deeper into his pocket.","key.b.r":"He puts the key back where it lay, beside the leg of the bench.","c0401.t":"{N09} lowers the camera before speaking. “May I take your photograph?” {hero} looks at the lens. “Where will it be shown?” The camera stays down while she answers.","c0401.t1":"A young woman with a camera stops by the bench. {N09} lowers the camera before speaking. “May I take your photograph?” {hero} looks at the lens. “Where will it be shown?” The camera stays down while she answers.","c0401.a":"Agree to the photograph.","c0401.b":"Decline the photograph.","c0401.c":"Ask her to keep your face out.","c0401.d":"Offer to draw her instead.","c0401.a.r":"{N09} shows the frame before pressing the button. {hero} checks the edge of his coat. When the photograph is taken, he takes the agreed payment and closes his bag.","c0401.b.r":"“All right. I am sorry,” {N09} says. She puts the camera away. “Thank you for answering.” {hero} watches her move aside so the path is clear.","c0401.c.r":"{N09} adjusts the frame and shows it again. {hero}'s face is outside it. “Like this?” she asks. He checks before giving his answer. She lowers the camera. “May I ask your name?”","c0401.d.r":"{N09} sits on the edge of the bench. “Tell me if I move too much.” {hero} sets the paper on his knee. This time, she waits for him to choose the frame.","lunch.early":"{N01} calls along the line. “Those going to a visit, please eat first.”","lunch.t4":"Today there is radish soup. Someone has put a jar of chopsticks at the end of each table.","lunch.t5":"Steam fogs the windows from the inside. No one in the line takes off a coat.","lunch.t6":"The soup is the same as yesterday. The bread is a little bigger.","lunch.t7":"{N01} looks at his collar for a moment and says nothing about it.","lunch.r4":"He eats with the bowl held in both hands, the way the others do.","lunch.r5":"The warmth reaches his fingers last.","lunch.r6":"He wraps half of the bread in a napkin, then unwraps it and eats it.","lunch.r7":"He eats slowly. There is time before the afternoon.","c0402.t":"Near the counter a man steps in front of him. Another man behind him says, “Hey, there's a line.” The first man does not turn round. His hands are shaking a little.","c0402.a":"Say nothing and wait.","c0402.b":"Tell him there is a line.","c0402.c":"Let him go first.","c0402.a.r":"He looks at the back of the man's coat and waits. The line moves one bowl at a time.","c0402.b.r":"“There's a line,” he says. {N01} looks up from the pot. “It's one line for everyone.” The man steps back without a word, and the line closes up.","c0402.c.r":"He moves half a step to the side. The man takes his bowl and does not look back. His hands are still shaking.","gift.t":"By the sink, he puts his hand into the bag and feels what is there.","gift.give.toy_best":"Give him the big dinosaur.","gift.give.drawing":"Give him the drawing.","gift.give.toy_small":"Give him the small keyring.","gift.keep":"Keep it in the bag for now.","gift.r.toy_best":"{son} opens his arms and then stops. For a while he says nothing. He holds the dinosaur with both arms before he breathes out.","gift.r.drawing":"{son} looks at the drawing for a long time. “I'll put this on the wall.”","gift.r.toy_small":"{son} puts the keyring on his palm and smiles. “I saw this one!”","c0403.t":"{son} points to the chair by the window. “Sit there today.” He opens a picture book on his knees and looks at {hero} once before turning the page.","c0403.a":"Look at the book together.","c0403.b":"Listen while he reads.","c0403.a.r":"On every page with a dinosaur, the small finger stops. “This one eats plants.” He nods, and {son} turns the page.","c0403.b.r":"The voice goes on one syllable at a time. He does not correct the word that comes out wrong. He listens to the end.","visit.out":"At the door the director puts a packet of crackers into his hand. “See you on the next visiting day.”","visit.out7":"The director puts a packet of crackers into his hand.","c0404.t":"Laughter goes round the fountain. Someone holds up a phone. Someone pushes his bag with the toe of a shoe.","c0404.t2":"“Smell that.” A few of them laugh after the first. None of their faces can be seen.","c0404.a":"Hold the bag and leave.","c0404.b":"Raise his head and look at them.","c0404.a.r":"He walks to the other side of the fountain. The laughter does not follow him. It does not need to.","c0404.b.r":"He looks at them one by one. The laughter stops for a moment, then starts again, further away.","c0404.after":"The square is greyer than before.","n4.t":"The lamps come on one at a time. The cold settles into the seams of his coat.","c0405.t":"{N02} checks the clear path. “Keep your bag on this side.” He finishes the round without telling {hero} to leave.","n6.t":"The night before the birthday. The wind has dropped.","n7.t":"The light in the window of Sunshine House goes out last, as it does every night.","c0501.t":"A cold-weather warning runs across the board in the square. His breath hangs in front of his face. The tips of his fingers go first.","c0501.leg":"Where the prosthetic meets the knee, the cold arrives before the pain.","c0501.crutch":"Under the arm, where the crutch rests, the cold arrives before the pain.","c0501.a":"Line his coat with newspaper.","c0501.b":"Start walking toward the meal centre.","c0501.a.r":"Two sheets of newspaper under the coat. They rustle when he moves. They help a little.","c0501.b.r":"Moving is warmer than standing still.","c0502.t":"A police officer stops and holds out a leaflet. “It'll go down to minus fifteen tonight. The shelter by the underpass opens its doors.” He waits for an answer instead of moving on.","c0502.a":"Accept the shelter information.","c0502.b":"Say he will be all right.","c0502.a.r":"He takes the leaflet. The officer traces the way on the map with a finger. “From nine. Ask at the door.”","c0502.ok":"Before leaving, the officer looks at him once more and nods. This time there is a face under the cap.","c0502.no":"The radio on the officer's shoulder calls him away before he can say more.","c0502.b.r":"The officer folds the leaflet back into his pocket. “If you change your mind, it's the building by the underpass.”","c0503.t":"{N01} sets the bowl down and keeps her hand on the tray a moment longer. “The shelter is open tonight. I can write down the way for you.”","c0503.a":"Ask her to write it down.","c0503.b":"Thank her and say not today.","c0503.a.r":"She writes on the back of the menu: past the underpass, the door with the light. “Nine o'clock.”","c0503.b.r":"“All right.” She does not ask again. She puts an extra piece of bread on the tray.","c0504.t":"In the underpass {N03} coughs into his sleeve. The cough goes on longer than it should.","s04.t":"{N03} folds his blanket slowly. “I want to finish this first.” {hero} waits beside the path to the shelter. The older man checks the corner once more before standing.","s04.a":"Wait and walk together.","s04.b":"Tell him where you will go.","s04.a.r":"They walk at the old man's pace. Neither of them says the word shelter until they can see the door.","s04.b.r":"“I will go ahead,” {hero} says. {N03} points to the shelter notice. “I know where it is.” He finishes folding the blanket before choosing what to do.","c0504.notice":"A notice is taped to the wall above him: the shelter opens tonight.","c0504.c":"Ask him to go to the shelter together.","c0504.d":"Sit with him until the cough stops.","c0504.c.r":"{N03} looks at the notice, then at him. “I know where it is.” He starts folding his blanket.","c0504.d.r":"The cough stops after a while. {N03} wipes his mouth. “Don't look like that. I've had worse winters.”","c0505p.t":"On the board in the square, the warning runs again. The shelter by the underpass is taking people in tonight.","c0505p.a":"Walk toward the shelter.","c0505p.b":"Get ready for the night here.","c0505p.a.r":"He turns toward the underpass before the light fades.","c0505p.b.r":"He gathers newspaper and cardboard while there is still light to see by.","c0505.t":"The coldest night of the winter so far. Sounds carry further in the cold. Somewhere a door closes.","u2.shelter":"Go to the shelter after all.","shelter.last.r":"The staff member at the door does not ask why he is late. She writes his name and points to a bunk.","walt.go":"{N03} has folded his blanket and is waiting by the steps.","walt.shelter":"{N03} takes the bunk below. He is asleep before the lights go out.","boiler.t":"{N02} comes along the path with the torch. Then he takes out a key.","u2.boiler":"Follow him to the boiler room.","boiler.r":"{N02} opens the boiler room. “Only for tonight. Keep the path to the door clear.” {hero} places his bag beside the wall and checks where he can rest.","boiler.no":"The small door remains closed. {N02} points to the shelter notice. “They are taking people in tonight.” {hero} checks the route before the light fades.","c0601.t":"Tomorrow is the birthday. He tips the coins out on his palm and counts them twice.","c0601.L9":"Tomorrow is the birthday. He folds the purple blanket, then tips the coins out on his palm and counts them twice.","c0601.m8":"Enough for the big dinosaur in the square window.","c0601.m2":"Enough for something small.","c0601.m0":"Not enough for anything in a shop. He still has the pen.","c0601.a":"Go and look at the shop window in the square.","c0601.b":"Go and find paper to draw on.","c0601.c":"Put the coins away and get up.","c0601.a.r":"He walks toward the square.","c0601.b.r":"The meal centre has flyers with clean backs.","c0601.c.r":"The coins go back into the pocket, all in one place.","c0602.t":"In the shop window on the square there is a big dinosaur. It is taller than the dolls on either side. A card in front of it shows the price.","c0602.can":"The coins in his pocket would just cover it.","c0602.cannot":"He counts again. It is not enough.","c0602.buy":"Go in and buy it.","c0602.look":"Check the price once more and step back.","c0602.buy.r":"The bell on the door rings. The assistant takes the dinosaur down from the window. He carries it out in both arms.","c0602.look.r":"In the glass his reflection stands next to the dinosaur for a moment. He knows where the shop is now.","r01.t":"{son} counts the squares on a calendar. “This one is tomorrow.” He draws a small dinosaur beside the date. {hero} waits while he checks whether the tail fits.","r01.a":"Ask what he wants to play.","r01.b":"Watch him finish the dinosaur.","r01.a.r":"“Drawing,” {son} says. “You do the big one, me the small one.” He leaves the calendar on the table. “We need two pencils.”","r01.b.r":"The tail crosses the edge of the square. {son} looks at it, then adds another line. “Now it has room.” He does not ask {hero} to erase it.","c0604.t":"The last evening on which he can still draw something for tomorrow. The pen, and one sheet of paper.","c0604.a":"Draw {son}'s face.","c0604.b":"Keep the paper for another day.","c0604.a.r":"He draws the face of a seven-year-old from memory. He leaves the eyes for last.","c0604.b.r":"He smooths the paper flat and puts it between the pages of the notebook.","u2.walt":"Go to the underpass, where {N03} sleeps.","c0605.t":"Under the green lights, {N03} is not asleep. He holds a blank sheet of paper on his knee.","s04.2":"“I start a letter in my head,” {N03} says. “Then I think of everything that happened before it.” He smooths a blank page on his knee.","c0605.t2":"“My son was about your age when I last saw him. I kept thinking I would go once I had something to show him. Then it was ten years.” He folds the paper in half and then opens it again.","c0605.a":"Listen first.","c0605.b":"Tell him to write it anyway.","c0605.c":"Lie down without saying anything.","c0605.a.r":"He says nothing and listens. The old man talks about a boy who could not ride a bicycle until he was nine. Then he stops talking, and sleeps.","c0605.b.r":"“Even one line,” {hero} says. {N03} looks at the paper for a long time. “One line,” he repeats, and puts it inside his coat.","c0605.c.r":"He lies down on the cardboard. After a while the paper rustles, then is quiet.","m02.pre":"{hero} checks the bag, then stops counting the coins. He takes out the child's photograph. The corner has become soft where his thumb rests.","c0701.a":"Look at the photograph a while longer.","c0701.b":"Get up and set out.","c0701.a.r":"The three-year-old in the photograph is turning eight today. He puts it back in the inside pocket.","c0701.b.r":"He sets out early. There is no hurry, and still he walks faster.","c0702.t":"On the way he catches his reflection in a bus-stop window: the collar, the hair, the stubble.","c0702.a":"Straighten his collar and smooth his hair.","c0702.b":"Wash at the public toilet first.","c0702.c":"Keep walking toward Sunshine House.","c0702.a.r":"The collar stays where he puts it. The hair does not quite.","c0702.b.r":"Cold water on his face and neck. He presses his wet hair flat with his palm and checks the mirror twice.","c0702.c.r":"He keeps to the side of the road where the sun reaches.","m02.t":"“How did you know it was my birthday?” {son} asks. A yellow pencil rests behind his ear. {hero} sees it and nearly reaches out to put it back on the table.","r01.back":"{son} puts two pencils between them. “I remembered.” He takes the yellow one and waits for {hero} to choose the other.","m02.a":"Say the director told you.","m02.b":"Let him show you his drawing.","m02.a.r":"“The director told me.” {son} nods, then holds out his page. “This dinosaur needs a friend.” He gives {hero} a pencil and keeps the yellow one.","m02.b.r":"“Would you show me what you drew?” {son} lays the page between them. “You draw this one. I'll do the little one.” He leaves a space beside his dinosaur.","m02.gift":"{son} puts the gift beside the drawing. “It can watch us.” He turns it toward the table. The pencil still waits in {hero}'s hand.","m02.empty":"{son} pulls the page closer to {hero}. “The tail goes here.” He points to an empty corner. There is room for both of their hands on the table.","m02.miss":"The visit time passes. {hero} writes the date beside the child's name. The next visit is still on the notice. He folds the notice without crossing out that date.","b1.t":"Near the end of the visit, {son} takes his sleeve and pulls him out into the yard. The blue swing. {son} sits on it and waits. {hero} stands behind him and pushes, once, then again.","b1.toy_best":"The big dinosaur sits on the bench by the swing, watching.","b1.drawing":"Inside, on the wall by the window, the drawing is already up.","b1.toy_small":"The small dinosaur keyring swings on the strap of his bag, a beat behind the swing.","b1.song":"From beyond the fence comes a guitar, playing a birthday song. The man playing it does not come closer.","b1.end":"Eighth birthday. Clear skies.","b2.t":"The visit happens. He hears what {son} says and answers. But when the door closes, he cannot remember the colour of his son's jumper.","b2.eyes":"He could not meet his son's eyes.","b2.hands":"He put his empty hands in his pockets.","b2.paper":"On his way out, he looks back. On the window of the room, a sheet of paper has been stuck up from inside.","b1.go":"Go back inside with him.","b2.go":"Look at the window a little longer.","c0704.dir":"When {son} has gone back into his room, the director stops beside him in the corridor. “Sir, in a month there is a review for permission to go out. I'll tell you the conditions.”","c0704.a":"Nod.","c0704.b":"Ask what the conditions are.","c0704.a.r":"The director writes a date in her notebook and hands him the page. A month from today.","c0704.b.r":"“Next week, properly. One at a time,” the director says. She writes a date on a page and gives it to him. A month from today.","b3.t":"He does not reach Sunshine House that day. In the evening the windows across the city light up one by one.","b3.faces":"In this city, a few faces now know him. He thinks of them, then of the one face he did not see today.","b3.nofaces":"No one in this city knows his face yet. He thinks of the one face he did not see today.","b3.go":"Fold the notice.","b3.r":"The notice goes into the inside pocket, next to the photograph.","ltr.t":"Before sleeping, he takes a page out of the notebook. The first line of a letter. He chooses it slowly.","letter.d07.a":"Happy birthday. Tonight, just this one line.","letter.d07.b.B1":"The blue swing did not squeak today.","letter.d07.b.B2":"I saw the paper you put on the window.","letter.d07.b.B3":"I could not come today. I have written down the next visiting day first.","letter.d07.c":"To you, now eight: this is the first letter. I will write the next line slowly.","ltr.skip":"Leave the page blank tonight.","ltr.r":"He folds the page twice and puts it beside the photograph.","ltr.b3":"In the morning he will put it in the letterbox of Sunshine House.","ltr.skip.r":"The page stays blank. He keeps it anyway.","p08.t":"By the fountain a man is playing a guitar, his case open in front of him. The song is nearly at its end.","p08.a":"Clap when the song ends.","p08.b":"Walk on.","p08.a.r":"His clapping is the only clapping in the square.","p08.ok":"The man lifts his head and looks straight at him. “Thanks.” For the first time, there is a face behind the guitar.","p08.no":"The man is already tuning for the next song. He does not look up.","p08.b.r":"The last chord follows him a little way.","h081.t":"The guitarist nods to him between songs. “The one who claps. Anything you want to hear?”","h081.a":"Say tomorrow is his son's birthday.","h081.b":"Say this one is fine.","h081.a.r":"“Sunshine House? I pass it in the afternoon.” The man writes something on the inside of the case. “I won't come in. Just over the fence.”","h081.b.r":"The man plays it again, a little slower.","mina2.t":"{N04} is checking the dates on the lunch boxes. When she sees him she puts one aside without saying anything.","mina2.a":"Thank her and take it.","mina2.b":"Take it and keep half for later.","mina2.a.r":"“Before midnight, it's still today,” {N04} says, and goes back to the till.","mina2.b.r":"He eats half by the window and wraps the rest. {N04} pretends not to see.","mina3.t":"{N04} hands him the lunch box with the receipt roll still in her other hand. “This is the last one I can do. The manager's started counting.”","mina3.a":"Thank her and take it.","mina3.b":"Take it and keep half for later.","mina3.a.r":"As he turns to go, she speaks to the till. “Actually, last year I didn't have a place either.”","mina3.b.r":"He wraps half of it. Before he reaches the door she says, to the till, “Actually, last year I didn't have a place either.”","alt.u2.L7":"The square: a fountain without water, a board, a shop window and a red donation box. A man stands to one side.","alt.u2.L7.seojin":"The square. A young woman holds a camera lowered, facing a man.","alt.u2.L7.insult":"The square at night. A man sits on the edge of the fountain. Four figures without faces stand around him.","alt.u2.L7.busker":"The square. A man plays a guitar by the fountain, his case open on the ground.","alt.u2.L7.window":"The square. In a shop window there is a large dinosaur. A man stands in front of the glass.","alt.u2.L7.police":"The square. A police officer holds out a leaflet to a man.","alt.u2.park.key":"The park. A key lies on the ground by a bench where a man sits. A guard stands by the gate.","alt.u2.park.seojin":"The park. A young woman with a lowered camera stands in front of a bench.","alt.u2.park.police":"The park. A police officer holds out a leaflet to a man on a bench.","alt.u2.L9":"The shelter: bunk beds, a high window, and a purple blanket on one bunk.","alt.u2.L4.walt":"The underpass under green lights. An old man sits bent forward beside a man.","alt.u2.house.calendar":"A room at Sunshine House. A boy and a man at a table with a calendar between them. Outside the window, a blue swing.","alt.u2.house.birthday":"A room at Sunshine House. A sheet of paper and two pencils on the table, one of them yellow.","alt.u2.house.yard":"The yard of Sunshine House in full colour. A boy on a blue swing, a man standing behind it.","alt.u2.house.window":"Sunshine House from outside. A sheet of paper is stuck to a lit window. A man stands in the street.","alt.u2.house.corridor":"A corridor at Sunshine House. The director stands beside a man. There is no child.","alt.u2.van":"A van on a winter road, a man in the back seat.","alt.u2.boiler":"A small boiler room, warm light, a man sitting by the wall.","alt.u2.letter":"A notebook page under a lamp, one line written at the top.","alt.u2.photo":"An old photograph of a three-year-old, held by a thumb at the corner."}}</script><!-- HS:MOD L-en-U2 END -->
<!-- HS:MOD L-ko-U2 START d60fe5ea96845cb1 --><script type="application/json" data-hs-pack data-hs-lang="ko" data-hs-mod="L-ko-U2">{"id":"L-ko-U2","lang":"ko","unit":2,"strings":{"d5.slug":"5일 · 한파","d6.slug":"6일 · 준비","d7.slug":"7일 · 생일","d4.dawn":"잿빛 아침. 게시판의 면회 안내에는 '오늘 오후'라고 적혀 있다.","bd.4":"아들의 생일까지 사흘.","bd.5":"아들의 생일까지 이틀.","bd.6":"내일이 아들의 생일이다.","bd.7":"오늘, {son}이 여덟 살이 된다.","h.early":"면회일에는 급식소가 오전에 먼저 줄을 연다.","h.van":"면회일에는 이곳에서 햇살의 집 승합차가 출발한다.","h.bday":"생일 면회는 오늘 오후다.","h.bday.am":"면회는 오후다. 아직 오전이 남았다.","h.shelter":"지하도 옆 쉼터가 오늘 밤 사람을 받는다.","u2.paper":"종이 한 장을 부탁한다.","paper.r":"{N01}이 전단 한 장을 뒤집어 건넨다. “뒷면은 깨끗해요.”","u2.van":"원장님의 승합차를 탄다.","van.r":"승합차 뒷자리, 반찬 통 사이에 앉는다. 걸어서 갔을 길이 창밖으로 빠르게 지나간다.","u2.wait":"대문 앞에서 기다린다.","wait.r":"철책 옆에서 기다린다. 부엌에 불이 켜지고, 무언가 끓는 냄새가 난다.","u2.donate":"빨간 모금함에 동전을 넣는다.","don.r":"동전이 바닥에 닿는 소리가 났다.","u2.buyBest":"큰 공룡 인형을 산다.","buy.best.r":"점원이 진열장에서 공룡을 내린다. 가방에는 들어가지 않는다. 두 팔로 안고 나온다.","u2.buySmall":"작은 공룡 열쇠고리를 산다.","buy.small.r":"진열대에 작은 초록 공룡이 매달려 있다. {son}이 손가락 두 개로 보여 준 크기다.","buy.small.r0":"진열대에 작은 초록 공룡이 매달려 있다. 값을 내기 전에 한 번 불빛에 비춰 본다.","item.toy_small":"작은 공룡 열쇠고리","item.toy_best":"큰 공룡 인형","item.paper":"종이","item.blanket":"보온 담요","loc.L9":"줄지어 선 이층 침대, 높은 창, 벽 쪽 침대 위의 보랏빛 담요 한 장.","nt.here.L9":"벽 쪽 침대에 눕는다.","nt.go.L9":"쉼터로 간다.","nt.r.L9":"직원이 보랏빛 담요를 건넨다. 세제 냄새가 난다. 창은 높고 열리지 않는다.","l9.am":"여섯 시에 불이 켜진다. 직원들이 담요를 개고 문을 연다. 쉼터는 밤에만 머무는 곳이다.","l9.am.a":"담요를 개고 나간다.","l9.out":"갠 담요를 침대 끝에 두고 나온다.","key.t":"벤치 옆에 열쇠가 떨어져 있다. {N02}가 입구에서 주머니를 살핀다. {hero}는 열쇠가 맞는 작은 문을 열지 않고 열쇠를 줍는다.","key.a":"열쇠를 돌려준다.","key.b":"이번에는 줍지 않는다.","key.a.r":"{N02}가 열쇠를 받아 쥔다. “길을 전부 찾고 있었어요.” 그는 자물쇠를 한 번 확인하고 열쇠를 주머니 깊이 넣는다.","key.b.r":"열쇠를 있던 자리, 벤치 다리 옆에 도로 둔다.","c0401.t":"{N09}은 말을 걸기 전에 카메라를 내린다. “사진을 찍어도 될까요?” {hero}는 렌즈를 본다. “어디에 보여 줄 건가요?” {N09}이 답하는 동안 카메라는 내려가 있다.","c0401.t1":"카메라를 든 젊은 여자가 벤치 앞에 멈춘다. {N09}은 말을 걸기 전에 카메라를 내린다. “사진을 찍어도 될까요?” {hero}는 렌즈를 본다. “어디에 보여 줄 건가요?” {N09}이 답하는 동안 카메라는 내려가 있다.","c0401.a":"사진을 허락한다.","c0401.b":"사진을 거절한다.","c0401.c":"얼굴을 빼 달라고 한다.","c0401.d":"{N09}을 그리겠다고 한다.","c0401.a.r":"{N09}은 버튼을 누르기 전에 구도를 보여 준다. {hero}는 외투 끝을 확인한다. 촬영이 끝나면 약속한 돈을 받고 가방을 닫는다.","c0401.b.r":"“알겠습니다. 죄송해요.” {N09}이 카메라를 넣는다. “답해 주셔서 고맙습니다.” {hero}는 {N09}이 길을 비켜 주는 것을 본다.","c0401.c.r":"{N09}이 구도를 바꾸고 다시 보여 준다. {hero}의 얼굴은 화면 밖에 있다. “이렇게요?” {N09}이 묻는다. {hero}는 확인한 뒤 답한다. {N09}은 카메라를 내린다. “이름을 여쭤봐도 될까요?”","c0401.d.r":"{N09}이 벤치 끝에 앉는다. “많이 움직이면 알려 주세요.” {hero}는 무릎에 종이를 놓는다. 이번에는 {N09}이 {hero}의 구도를 기다린다.","lunch.early":"{N01}이 줄을 따라 말한다. “면회 가시는 분들은 먼저 드세요.”","lunch.t4":"오늘은 뭇국이다. 탁자마다 끝에 젓가락 통이 하나씩 놓여 있다.","lunch.t5":"김이 안쪽에서 창을 뿌옇게 덮는다. 줄에 선 누구도 외투를 벗지 않는다.","lunch.t6":"국은 어제와 같다. 빵이 조금 크다.","lunch.t7":"{N01}이 옷깃 쪽을 잠깐 보고, 거기에 대해서는 아무 말도 하지 않는다.","lunch.r4":"다른 사람들처럼 그릇을 두 손으로 받쳐 들고 먹는다.","lunch.r5":"온기는 손가락에 맨 나중에 닿는다.","lunch.r6":"빵 반쪽을 냅킨에 쌌다가, 다시 풀어서 먹는다.","lunch.r7":"천천히 먹는다. 오후까지는 시간이 있다.","c0402.t":"배식대 가까이에서 한 남자가 앞으로 끼어든다. 뒤에서 누군가 “줄 있어요.” 하고 말한다. 끼어든 남자는 돌아보지 않는다. 손이 조금 떨리고 있다.","c0402.a":"참는다.","c0402.b":"따진다.","c0402.c":"양보한다.","c0402.a.r":"남자의 외투 등판을 보며 기다린다. 줄은 그릇 하나씩 움직인다.","c0402.b.r":"“줄 있습니다.” 그가 말한다. {N01}이 솥에서 고개를 든다. “줄은 하나예요.” 남자가 말없이 물러서고, 줄이 다시 이어진다.","c0402.c.r":"그는 반걸음 옆으로 비킨다. 남자는 그릇을 받고 돌아보지 않는다. 손은 여전히 떨리고 있다.","gift.t":"세면대 옆에서, 가방 속에 손을 넣어 거기 있는 것을 만져 본다.","gift.give.toy_best":"큰 공룡 인형을 건넨다.","gift.give.drawing":"그림을 건넨다.","gift.give.toy_small":"작은 열쇠고리를 건넨다.","gift.keep":"오늘은 가방에 그대로 둔다.","gift.r.toy_best":"{son}은 팔을 벌리다가 멈춘다. 한동안 아무 말이 없다. 공룡을 두 팔로 안고 나서야 숨을 내쉰다.","gift.r.drawing":"{son}이 그림을 한참 본다. “이거 벽에 붙일래요.”","gift.r.toy_small":"{son}이 열쇠고리를 손바닥에 올리고 웃는다. “이거 봤던 거예요!”","c0403.t":"{son}이 창가 의자를 가리킨다. “오늘은 저기 앉아요.” 아이는 무릎에 그림책을 펴고, 장을 넘기기 전에 {hero}를 한 번 본다.","c0403.a":"그림책을 같이 본다.","c0403.b":"아이가 읽는 것을 듣는다.","c0403.a.r":"공룡이 나오는 장마다 작은 손가락이 멈춘다. “이건 풀 먹어요.” 그가 고개를 끄덕이자 {son}이 다음 장을 넘긴다.","c0403.b.r":"또박또박 한 글자씩 목소리가 이어진다. 틀리게 읽은 낱말도 고쳐 주지 않는다. 끝까지 듣는다.","visit.out":"문 앞에서 원장이 크래커 한 봉지를 손에 쥐여 준다. “다음 면회일에 봬요.”","visit.out7":"원장이 크래커 한 봉지를 손에 쥐여 준다.","c0404.t":"웃음소리가 분수대를 돈다. 누군가 휴대전화를 들어 올린다. 누군가 구두 끝으로 가방을 민다.","c0404.t2":"“냄새 봐.” 몇 사람이 따라 웃는다. 그들 중 누구의 얼굴도 보이지 않는다.","c0404.a":"가방을 끌어안고 자리를 뜬다.","c0404.b":"고개를 들고 그들을 본다.","c0404.a.r":"분수대 건너편까지 걷는다. 웃음소리는 따라오지 않는다. 따라올 필요가 없다.","c0404.b.r":"한 사람씩 본다. 웃음소리가 잠깐 끊겼다가, 조금 떨어진 곳에서 다시 시작된다.","c0404.after":"광장이 아까보다 더 잿빛이다.","n4.t":"가로등이 하나씩 켜진다. 추위가 외투 솔기 사이에 자리 잡는다.","c0405.t":"{N02}가 비워진 통로를 살핀다. “가방은 이쪽에 두세요.” {hero}에게 떠나라고 하지 않고 순찰을 마친다.","n6.t":"생일 전날 밤. 바람이 잦아들었다.","n7.t":"햇살의 집 창의 불이 늘 그렇듯 마지막으로 꺼진다.","c0501.t":"광장 전광판에 한파 경보가 흐른다. 입김이 얼굴 앞에 머문다. 손끝이 먼저 둔해진다.","c0501.leg":"의족이 무릎에 닿는 자리에, 아픔보다 추위가 먼저 온다.","c0501.crutch":"목발이 닿는 겨드랑이에, 아픔보다 추위가 먼저 온다.","c0501.a":"신문지를 외투 안에 덧댄다.","c0501.b":"급식소 쪽으로 걷기 시작한다.","c0501.a.r":"외투 안에 신문지 두 장. 움직일 때마다 바스락거린다. 조금은 낫다.","c0501.b.r":"가만히 있는 것보다는 걷는 편이 덜 춥다.","c0502.t":"경찰관이 멈춰 서서 전단을 내민다. “오늘 밤 영하 십오 도까지 내려갑니다. 지하도 옆 쉼터가 문을 열어요.” 그는 지나가지 않고 대답을 기다린다.","c0502.a":"쉼터 안내를 받아들인다.","c0502.b":"괜찮다고 한다.","c0502.a.r":"전단을 받는다. 경찰관이 지도 위의 길을 손가락으로 짚어 준다. “아홉 시부터예요. 문에서 물어보세요.”","c0502.ok":"떠나기 전에 경찰관이 그를 한 번 더 보고 고개를 끄덕인다. 이번에는 모자 아래에 얼굴이 있다.","c0502.no":"어깨의 무전기가 경찰관을 부른다. 그는 더 말하지 못하고 간다.","c0502.b.r":"경찰관이 전단을 도로 주머니에 넣는다. “마음이 바뀌면, 지하도 옆 건물이에요.”","c0503.t":"{N01}이 그릇을 내려놓고, 쟁반에서 손을 잠깐 더 떼지 않는다. “오늘 밤 쉼터가 열려요. 가는 길을 적어 드릴 수 있어요.”","c0503.a":"가는 길을 적어 달라고 한다.","c0503.b":"고맙다고 하고, 오늘은 괜찮다고 한다.","c0503.a.r":"그녀가 식단표 뒷면에 적는다. 지하도를 지나, 불 켜진 문. “아홉 시예요.”","c0503.b.r":"“그래요.” 그녀는 다시 묻지 않는다. 쟁반에 빵 한 조각을 더 얹는다.","c0504.t":"지하도에서 {N03}가 소매에 대고 기침을 한다. 기침이 생각보다 오래 이어진다.","s04.t":"{N03}가 담요를 천천히 접는다. “이것부터 마치고 싶어.” {hero}는 쉼터로 가는 길 옆에서 기다린다. {N03}는 모서리를 한 번 더 확인하고 일어선다.","s04.a":"기다렸다 함께 간다.","s04.b":"갈 곳을 알려 준다.","s04.a.r":"노인의 걸음에 맞춰 걷는다. 문이 보일 때까지 둘 다 쉼터라는 말을 꺼내지 않는다.","s04.b.r":"“먼저 갈게요.” {hero}가 말한다. {N03}는 쉼터 안내문을 가리킨다. “어딘지 알아.” 담요를 다 접고 나서 다음 일을 고른다.","c0504.notice":"머리 위 벽에 안내문이 붙어 있다. 오늘 밤 쉼터가 문을 연다.","c0504.c":"쉼터에 같이 가자고 한다.","c0504.d":"기침이 멎을 때까지 곁에 앉는다.","c0504.c.r":"{N03}가 안내문을 보고, 그를 본다. “어딘지 알아.” 노인이 담요를 개기 시작한다.","c0504.d.r":"한참 뒤에 기침이 멎는다. {N03}가 입가를 닦는다. “그런 얼굴 하지 마. 더한 겨울도 있었어.”","c0505p.t":"광장 전광판에 경보가 다시 흐른다. 지하도 옆 쉼터가 오늘 밤 사람을 받는다.","c0505p.a":"쉼터 쪽으로 걷는다.","c0505p.b":"여기서 밤을 준비한다.","c0505p.a.r":"빛이 더 어두워지기 전에 지하도 쪽으로 몸을 돌린다.","c0505p.b.r":"아직 보일 때 신문지와 박스를 모은다.","c0505.t":"이번 겨울 들어 가장 추운 밤. 추위 속에서는 소리가 멀리 간다. 어딘가에서 문이 닫힌다.","u2.shelter":"그래도 쉼터로 간다.","shelter.last.r":"문 앞의 직원은 왜 늦었는지 묻지 않는다. 이름을 적고 침대 하나를 가리킨다.","walt.go":"{N03}가 담요를 개어 들고 계단 옆에서 기다리고 있다.","walt.shelter":"{N03}가 아래 침대를 쓴다. 불이 꺼지기 전에 잠든다.","boiler.t":"{N02}가 손전등을 들고 통로를 따라온다. 그리고 열쇠를 꺼낸다.","u2.boiler":"보일러실로 따라간다.","boiler.r":"{N02}가 보일러실 문을 연다. “오늘 밤만이에요. 문까지 통로는 비워 주세요.” {hero}는 벽 옆에 가방을 놓고 쉴 자리를 확인한다.","boiler.no":"작은 문은 닫혀 있다. {N02}가 쉼터 안내문을 가리킨다. “오늘 밤 들어갈 수 있대요.” {hero}는 빛이 더 어두워지기 전에 길을 확인한다.","c0601.t":"내일이 생일이다. 동전을 손바닥에 쏟아 두 번 센다.","c0601.L9":"내일이 생일이다. 보랏빛 담요를 개어 놓고, 동전을 손바닥에 쏟아 두 번 센다.","c0601.m8":"광장 진열장의 큰 공룡에 닿는 돈이다.","c0601.m2":"작은 것 하나에는 닿는 돈이다.","c0601.m0":"가게의 무엇에도 닿지 않는다. 볼펜은 아직 있다.","c0601.a":"광장 가게 진열장을 보러 간다.","c0601.b":"그림 그릴 종이를 구하러 간다.","c0601.c":"동전을 주머니에 넣고 일어난다.","c0601.a.r":"광장 쪽으로 걷는다.","c0601.b.r":"급식소에는 뒷면이 깨끗한 전단이 있다.","c0601.c.r":"동전이 한곳에 모여 주머니로 돌아간다.","c0602.t":"광장 가게 진열장에 큰 공룡 인형이 있다. 양옆의 인형들보다 키가 크다. 앞에 놓인 카드에 값이 적혀 있다.","c0602.can":"주머니 속 동전이 딱 그만큼이다.","c0602.cannot":"다시 세어 본다. 모자란다.","c0602.buy":"들어가서 산다.","c0602.look":"값을 한 번 더 확인하고 돌아선다.","c0602.buy.r":"문의 종이 울린다. 점원이 진열장에서 공룡을 내린다. 두 팔로 안고 나온다.","c0602.look.r":"유리에 비친 모습이 잠깐 공룡 옆에 선다. 이제 가게가 어디 있는지 안다.","r01.t":"{son}이 달력의 칸을 센다. “여기가 내일이에요.” 날짜 옆에 작은 공룡을 그린다. {hero}는 꼬리가 칸 안에 들어가는지 아이가 살필 때까지 기다린다.","r01.a":"하고 싶은 놀이를 묻는다.","r01.b":"공룡을 마저 그리는 걸 본다.","r01.a.r":"“그림이요. 큰 건 아저씨, 작은 건 저요.” {son}은 달력을 탁자에 둔다. “연필 두 개가 필요해요.”","r01.b.r":"꼬리가 칸 밖으로 나간다. {son}은 보더니 선을 하나 더 긋는다. “이제 자리 있어요.” {hero}에게 지워 달라고 하지 않는다.","c0604.t":"내일을 위해 무언가를 그릴 수 있는 마지막 저녁. 볼펜, 그리고 종이 한 장.","c0604.a":"{son}의 얼굴을 그린다.","c0604.b":"종이를 아껴 둔다.","c0604.a.r":"일곱 살의 얼굴을 떠올려 그린다. 눈은 맨 나중에 그린다.","c0604.b.r":"종이를 판판하게 펴서 수첩 사이에 끼운다.","u2.walt":"{N03}가 자는 지하도로 간다.","c0605.t":"초록 형광등 아래, {N03}는 잠들지 않았다. 무릎 위에 빈 종이 한 장을 들고 있다.","s04.2":"“머릿속으로 편지를 시작해.” {N03}가 말한다. “그러면 그전에 있었던 일이 전부 생각나.” 그는 무릎 위 빈 종이를 편다.","c0605.t2":"“마지막으로 봤을 때, 내 아들이 자네만 했어. 보여 줄 게 생기면 가야지, 그렇게 생각하다 보니 십 년이야.” 그는 종이를 반으로 접었다가 다시 편다.","c0605.a":"먼저 듣는다.","c0605.b":"그래도 써 보라고 한다.","c0605.c":"아무 말 없이 눕는다.","c0605.a.r":"아무 말 없이 듣는다. 노인은 아홉 살까지 자전거를 못 타던 아이 이야기를 한다. 그러다 말을 멈추고, 잠이 든다.","c0605.b.r":"“한 줄이라도요.” {hero}가 말한다. {N03}가 종이를 오래 본다. “한 줄.” 그렇게 되뇌고, 종이를 외투 안에 넣는다.","c0605.c.r":"박스 위에 눕는다. 한참 뒤에 종이가 바스락거리다가 조용해진다.","m02.pre":"{hero}는 가방을 살피다가 동전 세기를 멈춘다. 아이의 사진을 꺼낸다. 엄지가 닿는 모서리가 부드럽게 닳았다.","c0701.a":"사진을 조금 더 본다.","c0701.b":"일어나 길을 나선다.","c0701.a.r":"사진 속 세 살 아이가 오늘 여덟 살이 된다. 사진을 안주머니에 도로 넣는다.","c0701.b.r":"일찍 나선다. 서두를 일은 없는데도 걸음이 빨라진다.","c0702.t":"가는 길에 정류장 유리에 비친 자기 모습을 본다. 옷깃, 머리, 수염.","c0702.a":"옷깃을 바로 하고 머리를 쓸어 넘긴다.","c0702.b":"공중화장실에서 먼저 씻는다.","c0702.c":"햇살의 집 쪽으로 계속 걷는다.","c0702.a.r":"옷깃은 둔 자리에 있다. 머리는 그렇지 않다.","c0702.b.r":"얼굴과 목에 찬물. 젖은 머리를 손바닥으로 눌러 펴고, 거울을 두 번 본다.","c0702.c.r":"햇빛이 닿는 쪽 길로 걷는다.","m02.t":"“제 생일을 어떻게 알아요?” {son}이 묻는다. 귀 뒤에 노란 연필이 걸려 있다. {hero}는 연필을 탁자에 놓아 주려다가 손을 멈춘다.","r01.back":"{son}이 둘 사이에 연필 두 자루를 놓는다. “기억했어요.” 노란 연필을 들고 {hero}가 다른 하나를 고르기를 기다린다.","m02.a":"원장님께 들었다고 한다.","m02.b":"아이의 그림을 본다.","m02.a.r":"“원장님께 들었어.” {son}은 고개를 끄덕이고 종이를 내민다. “이 공룡은 친구가 필요해요.” 아이가 {hero}에게 연필을 주고 노란 연필은 갖고 있는다.","m02.b.r":"“네가 그린 것 보여 줄래?” {son}이 둘 사이에 종이를 놓는다. “이건 아저씨가 그려요. 작은 건 제가요.” 아이가 자기 공룡 옆에 자리를 남긴다.","m02.gift":"{son}이 선물을 그림 옆에 놓는다. “우리가 그리는 걸 볼 수 있어요.” 아이가 선물을 탁자 쪽으로 돌린다. {hero}의 손에는 연필이 남아 있다.","m02.empty":"{son}이 종이를 {hero} 쪽으로 당긴다. “꼬리는 여기예요.” 아이가 빈 모서리를 가리킨다. 탁자에는 두 사람의 손이 놓일 자리가 있다.","m02.miss":"면회 시간이 지난다. {hero}는 아이 이름 옆에 날짜를 쓴다. 안내문에는 다음 면회가 남아 있다. {hero}는 그 날짜를 지우지 않고 안내문을 접는다.","b1.t":"면회가 끝나 갈 무렵, {son}이 소매를 잡고 마당으로 끈다. 파란 그네. {son}이 앉아서 기다린다. {hero}는 뒤에 서서 한 번, 또 한 번 민다.","b1.toy_best":"큰 공룡 인형이 그네 옆 벤치에 앉아 지켜본다.","b1.drawing":"안쪽, 창가 벽에 그림이 벌써 붙어 있다.","b1.toy_small":"작은 공룡 열쇠고리가 가방끈에서 그네보다 한 박자 늦게 흔들린다.","b1.song":"울타리 너머에서 기타 소리가 생일 노래를 연주한다. 연주하는 남자는 더 가까이 오지 않는다.","b1.end":"여덟 번째 생일. 날씨 맑음.","b2.t":"면회는 한다. {son}의 말을 듣고 대답도 한다. 그러나 문이 닫히고 나니, 아들의 스웨터 색이 기억나지 않는다.","b2.eyes":"눈을 마주치지 못했다.","b2.hands":"빈손을 주머니에 넣었다.","b2.paper":"나오는 길에 돌아본다. 방 창문에 종이 한 장이 안쪽에서 붙어 있다.","b1.go":"아이와 함께 안으로 들어간다.","b2.go":"창문을 조금 더 본다.","c0704.dir":"{son}이 방으로 들어간 뒤, 원장이 복도에서 곁에 와 멈춘다. “아버님, 한 달 뒤에 외출 허가 심사가 있어요. 조건을 알려 드릴게요.”","c0704.a":"고개를 끄덕인다.","c0704.b":"“조건이 뭔가요?” 하고 묻는다.","c0704.a.r":"원장이 수첩에 날짜를 적어, 그 장을 뜯어 건넨다. 오늘부터 한 달 뒤.","c0704.b.r":"“다음 주에 자세히 말씀드릴게요. 하나씩이요.” 원장이 종이에 날짜를 적어 건넨다. 오늘부터 한 달 뒤.","b3.t":"그는 그날 햇살의 집에 가지 못한다. 저녁이 되자 도시의 창들이 하나씩 켜진다.","b3.faces":"이 도시에는 이제 그를 알아보는 얼굴이 몇 있다. 그 얼굴들을 생각하고, 오늘 보지 못한 얼굴 하나를 생각한다.","b3.nofaces":"이 도시에서 그의 얼굴을 아는 사람은 아직 없다. 오늘 보지 못한 얼굴 하나를 생각한다.","b3.go":"안내문을 접는다.","b3.r":"안내문이 사진 옆, 안주머니로 들어간다.","ltr.t":"잠들기 전, 수첩에서 한 장을 뜯는다. 편지의 첫 줄. 천천히 고른다.","letter.d07.a":"생일 축하해. 오늘은 이 한 줄만 쓴다.","letter.d07.b.B1":"오늘은 파란 그네가 소리를 내지 않았어.","letter.d07.b.B2":"창문에 붙인 종이, 잘 봤어.","letter.d07.b.B3":"오늘은 가지 못했어. 다음 면회 날짜를 먼저 적어 둘게.","letter.d07.c":"여덟 살이 된 너에게, 처음으로 편지를 쓴다. 다음 줄은 천천히 쓸게.","ltr.skip":"오늘 밤은 빈 장으로 둔다.","ltr.r":"종이를 두 번 접어 사진 옆에 넣는다.","ltr.b3":"내일 아침, 햇살의 집 우편함에 넣을 것이다.","ltr.skip.r":"종이는 비어 있다. 그래도 넣어 둔다.","p08.t":"분수대 옆에서 한 남자가 기타를 친다. 앞에 기타 가방이 열려 있다. 노래가 끝나 간다.","p08.a":"노래가 끝날 때 박수를 친다.","p08.b":"지나간다.","p08.a.r":"광장에서 박수 소리는 그의 것 하나다.","p08.ok":"남자가 고개를 들어 그를 똑바로 본다. “고마워요.” 기타 뒤에 처음으로 얼굴이 보인다.","p08.no":"남자는 벌써 다음 노래를 위해 줄을 고르고 있다. 고개를 들지 않는다.","p08.b.r":"마지막 화음이 조금 따라오다 그친다.","h081.t":"기타 치는 남자가 노래 사이에 그에게 고개를 끄덕인다. “박수 쳐 주던 분이네. 듣고 싶은 거 있어요?”","h081.a":"내일이 아들 생일이라고 말한다.","h081.b":"지금 이 노래면 된다고 한다.","h081.a.r":"“햇살의 집이요? 오후에 그 앞을 지나가요.” 남자가 가방 안쪽에 무언가를 적는다. “들어가진 않을게요. 울타리 너머에서만.”","h081.b.r":"남자가 그 노래를 한 번 더, 조금 느리게 친다.","mina2.t":"{N04}가 도시락 날짜를 확인하고 있다. 그를 보더니 아무 말 없이 하나를 따로 밀어 둔다.","mina2.a":"고맙다며 받는다.","mina2.b":"받아서 반은 남겨 둔다.","mina2.a.r":"“자정 전이면 아직 오늘이에요.” {N04}가 말하고 계산대로 돌아간다.","mina2.b.r":"창가에서 반을 먹고 나머지를 싼다. {N04}는 못 본 척한다.","mina3.t":"{N04}가 다른 손에 영수증 뭉치를 든 채 도시락을 건넨다. “이게 마지막이에요. 점장님이 세기 시작했어요.”","mina3.a":"고맙다며 받는다.","mina3.b":"받아서 반은 남겨 둔다.","mina3.a.r":"그가 돌아서려는데, 그녀가 계산대를 보며 말한다. “사실 저도 작년에 집이 없었어요.”","mina3.b.r":"반을 싸 둔다. 그가 문에 닿기 전에 그녀가 계산대를 보며 말한다. “사실 저도 작년에 집이 없었어요.”","alt.u2.L7":"광장: 물 빠진 분수대, 게시판, 가게 진열장, 빨간 모금함. 한 남자가 한쪽에 서 있다.","alt.u2.L7.seojin":"광장. 젊은 여자가 카메라를 내린 채 한 남자를 마주하고 있다.","alt.u2.L7.insult":"밤의 광장. 한 남자가 분수대 가장자리에 앉아 있다. 얼굴 없는 네 사람이 그를 둘러서 있다.","alt.u2.L7.busker":"광장. 분수대 옆에서 한 남자가 기타를 치고, 바닥에 가방이 열려 있다.","alt.u2.L7.window":"광장. 가게 진열장에 큰 공룡 인형이 있다. 한 남자가 유리 앞에 서 있다.","alt.u2.L7.police":"광장. 경찰관이 한 남자에게 전단을 내밀고 있다.","alt.u2.park.key":"공원. 한 남자가 앉은 벤치 옆 땅바닥에 열쇠가 떨어져 있다. 입구 옆에 경비원이 서 있다.","alt.u2.park.seojin":"공원. 카메라를 내린 젊은 여자가 벤치 앞에 서 있다.","alt.u2.park.police":"공원. 경찰관이 벤치의 남자에게 전단을 내밀고 있다.","alt.u2.L9":"쉼터: 이층 침대들, 높은 창, 한 침대 위의 보랏빛 담요.","alt.u2.L4.walt":"초록 형광등 아래의 지하도. 한 노인이 몸을 숙이고 한 남자 곁에 앉아 있다.","alt.u2.house.calendar":"햇살의 집의 방. 소년과 남자가 달력을 사이에 두고 탁자에 있다. 창밖에 파란 그네.","alt.u2.house.birthday":"햇살의 집의 방. 탁자 위에 종이 한 장과 연필 두 자루, 그중 하나는 노란색.","alt.u2.house.yard":"햇살의 집 마당, 온전한 색으로. 파란 그네에 소년이 앉아 있고 한 남자가 뒤에 서 있다.","alt.u2.house.window":"밖에서 본 햇살의 집. 불 켜진 창에 종이 한 장이 붙어 있다. 한 남자가 길에 서 있다.","alt.u2.house.corridor":"햇살의 집 복도. 원장이 한 남자 곁에 서 있다. 아이는 없다.","alt.u2.van":"겨울 길 위의 승합차, 뒷자리의 한 남자.","alt.u2.boiler":"작은 보일러실, 따뜻한 불빛, 벽 옆에 앉은 한 남자.","alt.u2.letter":"등불 아래 수첩 한 장, 맨 위에 한 줄이 적혀 있다.","alt.u2.photo":"세 살 아이의 오래된 사진, 모서리를 엄지가 쥐고 있다."}}</script><!-- HS:MOD L-ko-U2 END -->

0 벤치의 노부부·P06 개 산책·P02 유모차), 결정 D-U3-07","favours":"39.1(H101 8일·H061 9일·H021 10일)","montFaces":"195.3 ①·181.5(얼굴의 일상 회수)"}}}</script><!-- HS:MOD D-U3 END -->
<!-- HS:MOD L-en-U3 START 0d8a70dc676a50d4 --><script type="application/json" data-hs-pack data-hs-lang="en" data-hs-mod="L-en-U3">{"id":"L-en-U3","lang":"en","unit":3,"strings":{"a2.slug":"Act 2 · Papers and the Body","d8.slug":"Day 8 · Three conditions","d9.slug":"Day 9 · The papers","d10.slug":"Day 10 · Our family","d11.slug":"Day 11","a2.h":"Act Two — Papers and the Body","a2.faces":"In act one, the faces of {n} people came back.","a2.faces0":"In act one, no face has come back yet.","a2.son.B1":"Birthday: the day of the blue swing.","a2.son.B2":"Birthday: a sheet of paper on the window.","a2.son.B3":"Birthday: a day he could not reach. The next date is written down.","a2.mem.look":"What stayed longest: raising his head and looking at them.","a2.mem.listen":"What stayed longest: the night he heard {N03}'s letter to the end.","a2.mem.urge":"What stayed longest: the night he told {N03} to send the letter.","a2.mem.noface":"What stayed longest: asking for his face to be left out of the photograph.","a2.mem.shelter":"What stayed longest: the shelter door on the night of the cold.","a2.mem.name":"What stayed longest: saying his own name at the meal centre.","a2.mem.days":"What stayed longest: seven days that passed with no one watching.","a2.new":"Now he can be properly admitted to the shelter.","a2.rest":"You can rest here. The story will wait.","a2.back":"If he falls during this act, you will return here.","a2.go":"Begin the eighth day","a2.letterbox":"The letter is in the letterbox of Sunshine House. The director will find it in the morning.","d8.t":"The dawn of the eighth day. Two days are left until the next visiting day written in his notebook.","d8.t9":"The eighth morning at the shelter. The lights come on; it is time to fold the blankets. Two days until the next visit.","d8.goal":"The director's words stay with him: the review for leave in a month, and the conditions she will explain.","d8.a":"Walk toward the meal centre.","d8.b":"Walk toward Sunshine House.","d8.c":"Stay a little longer.","d8.a.r":"He walks toward the meal centre. The line is still short.","d8.b.r":"He takes the road toward Sunshine House.","d8.c.r":"He sits until the sun clears the buildings.","h3.director":"At Sunshine House he can ask the director about the conditions in person.","m03.t":"The director places three sheets on the desk. “A room, a work record, and a reference letter. We check each one separately.” {hero} looks at the empty spaces for his name.","m03.a":"Ask what to do first","m03.b":"Ask about the next visit","m03.a.r":"“Start with the identity papers. The shelter can explain the steps.” She writes the office hours on the edge. “You do not have to finish all of this today.”","m03.b.r":"She points to the next visit date. “You can still come while you prepare.” {hero} folds the list with the date on the outside.","m03.sheet":"A notice from Sunshine House is pinned beside the counter. The information lists three requirements: a room, a work record, and a reference letter. {hero} checks the identity-paper steps and the next visit date. The page does not say that any requirement is already complete.","m03.sheet.r":"On the way past with his bowl, he reads the notice once more.","h3.shelter":"In the evening the shelter holds admission interviews.","c0802.t":"An admission form lies on the desk of the shelter office. The counsellor pulls out a chair. “If you register, you get a bed number of your own. May I ask a few questions?”","c0802.t.card":"At the desk of the shelter office, {N23} looks up and recognises the centre's card. “We met at dawn. If you register, you get a bed number of your own. May I ask a few questions?”","c0802.a":"Take the interview","c0802.b":"Just use a bed tonight","c0802.a.r":"The questions are short: his name, his date of birth, the last place he stayed. The counsellor writes the answers down and signs the record. “This record is your shelter registration.”","c0802.b.r":"The counsellor puts the form back in the drawer. “I am here tomorrow evening as well.”","c0802.key":"One key: the counsellor's interview record. It opens the ‘shelter registration’ arrow on the document board.","c0802n.t":"{N01} puts the ladle down. “The shelter by the underpass does admission interviews. Will you go this evening?”","c0802n.a":"Say he will go","c0802n.b":"Think about it later","c0802n.a.r":"{N01} writes the shelter's name and the dinner hour on a napkin.","c0802n.b.r":"{N01} nods. “The door opens every evening.”","u3.dinner":"Go to the shelter for dinner","dinner.r":"His bed number is on the list beside the trays. Steam rises from the soup.","dinner.r0":"He joins the line for trays. A staff member says there is an interview hour after dinner.","u3.toShelter":"Go to the shelter for the interview","c0901.t":"Sorting the bag, his hand stops. The pocket where the identity card used to be is empty. He cannot remember when it went.","c0901.board":"The document board: open it from the menu (‘Papers’) or with the D key.","c0901.a":"Go to the meal centre first","c0901.b":"Go to the service counter","c0901.c":"Look at the empty pocket","c0901.a.r":"He closes the bag and walks toward the meal centre. There is one more thing to ask {N01}.","c0901.b.r":"He closes the bag. The service counter is on the ground floor of the hospital building.","c0901.c.r":"He puts a finger into the empty pocket. Only the worn marks of the corners are left.","h3.counter":"The service counter on the hospital's ground floor is open from morning until early evening.","m04.t":"The form asks for an address before it asks for a name. {hero} turns it over. The clerk brings a second sheet. “Let us see which part you can confirm today.”","m04.a":"Write your name","m04.b":"Ask which document is missing","m04.a.r":"{hero} writes his full name. The clerk places the two sheets side by side. His name is the same on both. The marks beside the required papers are different.","m04.b.r":"The clerk points to the two marked lines. “These are different requirements. Another copy of this paper will not replace the other document.” {hero} marks both lines.","m04.short":"The clerk returns the papers in their original order. “Bring this one next.” She marks one line. {hero} puts that sheet at the front of the folder.","u3.counter":"Go up to the counter","ctr.t":"The number above the counter changes. The clerk opens his folder. “Which paper shall we check today?”","ctr.need2":"Two lines are still marked on the first sheet of the folder.","ctr.need1":"One marked line is left.","ctr.K1":"Hand in the kitchen's confirmation","ctr.K2":"Hand in the medical record","ctr.K3":"Hand in the interview record","ctr.K4":"Ask the way {N03} showed him","ctr.ask":"Ask what is missing","ctr.leave":"Leave it for today","ctr.leave.r":"He folds the number ticket into the folder. The counter opens at the same hour tomorrow.","ctr.ask.r1":"The clerk points to the one line left. “This line needs a different paper.”","ctr.same":"The clerk reads it and shakes his head. “This is the same requirement as before. Another copy will not replace the other document.”","ctr.ok.id":"The clerk checks the paper and stamps the ‘identity check’ line.","ctr.ok.shelter":"The clerk checks the record and stamps the ‘shelter registration’ line.","ctr.ok.address":"The clerk thinks for a moment and takes out another form. The ‘address registration’ line can take the shelter's address. He stamps it.","ctr.solved":"The clerk closes the folder and hands him a receipt. “Your reissue request is in. Please come back in a few days.” The day to collect it is written on the receipt. {hero} puts it beside the photograph.","ctr.more":"The clerk marks the line still left. “Once this is confirmed too, you can apply.”","u3.k1":"Ask {N01} for a confirmation","k1.t":"{N01} wipes her hands on her apron. “A confirmation? I can write down the days you have eaten here.” She turns the pages of the register.","k1.t0":"{N01} stops turning the register. “A confirmation needs a name. May I ask yours?”","k1.a":"Ask her for it","k1.a0":"Tell her his name","k1.b":"Ask another time","k1.a.r":"{N01} writes the dates and signs. “The counter can use this to confirm who you are.” The paper smells faintly of soup.","k1.a.r0":"{hero} says his name. {N01} writes it at the top of the confirmation, and in the empty space of the register as well.","k1.b.r":"{N01} closes the register. “Any time.”","k1.sq":"This is also the kitchen confirmation {N05} asked for.","u3.nurse":"Look for {N05}","s101.has":"The kitchen confirmation is already in his bag.","s103.t":"{N05} takes out the assessment form again. One space waits for the kitchen confirmation.","s103.a":"Hand in the papers","s103.r":"“You brought the papers,” {N05} says. She checks the name on each sheet. “Now we can make the assessment.” {hero} keeps the receipt rather than the old queue number.","s103.key":"One key: a copy of the medical record. It opens the ‘identity check’ arrow on the document board. The result comes on the eleventh day.","s104.x":"{N05} sets a box on the examination bed. “The assessment came back. Shall we try the fit?”","s104.h":"{N05} looks at the joint. “The repair was approved. We can do it today.”","s104.n":"{N05} turns the result sheet. “What you have now is well kept. Nothing needs changing.” In the waiting room, the person beside him holds a form and searches it for a line.","s104.a":"Sit down in front of {N05}","s104.x.r":"{hero} tests the fit while {N05} watches. “Tell us if it hurts,” she says. He takes one step, stops, and asks how to care for the joint.","s104.h.r":"The joint no longer makes the same sound. {hero} checks it once more before standing. {N05} gives him the repair record. He keeps it with the other papers.","s104.n.r":"The next person cannot find the line the clerk named. {hero} points to it, then moves his hand away. The person writes the answer in their own words.","s104.rehab":"{N05} folds a sheet of exercises for him. “A little every day. It will not fix everything at once.”","k4.t":"{N03} taps the folder with a finger. “No address? Ask whether you can use the shelter's. They have a form for it. It only comes out when somebody asks.”","k4.a":"Listen closely","k4.b":"Hear it another time","k4.a.r":"{hero} writes it on the inside of the folder. {N03} coughs and pulls the blanket up.","k4.b.r":"{N03} shrugs. “No hurry.”","k4.key":"One key: the way to ask at the counter. It opens the ‘address registration’ arrow on the document board.","d10.t":"The morning of the tenth day. This afternoon is a visiting day.","d10.t9":"The tenth morning at the shelter. This afternoon is a visiting day.","d10.plan":"On visiting days the meal centre serves lunch early, and the van leaves in the afternoon.","d10.a":"Go to the meal centre","d10.b":"Walk toward Sunshine House","d10.c":"Rest a little longer","d10.a.r":"He walks toward the meal centre. On visiting days the line forms early.","d10.b.r":"He takes the road toward Sunshine House. There is time until the afternoon.","d10.c.r":"He checks the visiting date in his notebook once more.","gift.give.picturebook":"Give him the picture book.","gift.r.picturebook":"{son} lays the picture book on his knees and turns the first page. “Can you read this to me?”","lgive.t":"In the bag are the letters he wrote at night, folded. If he leaves them with the director, she can pass them to {son}.","lgive.a":"Leave them with the director","lgive.b":"Keep them for now","lgive.r":"The director takes the letters and puts them in a drawer. “I will give them to him.”","m05.t":"{son} opens his school notebook. His mother has a face drawn from a photograph. There is an empty space beside her. “I cannot remember my father's face,” he says.","m05.a":"Look at the page with him","m05.b":"Say his father misses him","m05.c":"Offer to help him draw","m05.a.r":"{hero} keeps his hands beside the notebook. {son} draws a small tree in the corner. “This is near our window.” He turns the page so they can both see it.","m05.b.r":"“I think your father misses you.” {son} looks at the empty space. “Then I will leave room for him.” He draws the edge of a chair below it.","m05.c.r":"“Would you like help with the drawing?” {son} offers the pencil. “Can you draw my father's face?” {hero}'s hand stops above the page. The child waits without taking the pencil back.","m05.c2":"“I want to do that carefully,” {hero} says. “May I sit with you a little longer?” {son} moves the notebook to the middle of the table.","d11.s104":"The morning of the eleventh day. Today the assessment result is ready at the hospital.","d11.go":"Go to the hospital","d11.stay":"Start slowly today","d11.go.r":"He walks toward the hospital.","d11.stay.r":"He starts the day without hurrying.","mont.day":"Day 11","mont.go":"Let the day pass","mont.r":"Lunch, an afternoon's rest, a place to sleep. The day starts to go by like that.","mont.stop":"His good leg tells him today will not go as planned.","mont.P01":"The man with the briefcase nods on his way past.","mont.P07":"The street sweeper leans on the broom and greets him first.","mont.P08":"On the square, the guitarist plays the first song facing his way.","mont.P12":"The officer on patrol points toward the shelter on the way past.","mont.P10":"The old couple on the bench leave the middle seat empty.","mont.P06":"The dog runs to him first and sniffs his shoe.","mont.P02":"The mother with the pushchair raises a gloved hand.","mont.obj.receipt":"The receipt sits beside the photograph, with one more fold in it.","mont.wx.rain":"After the rain, the bench stays wet all day.","mont.obj.paper":"The first sheet in the folder has curled a little overnight.","lunch3.t8":"A new notice beside the counter gives the shelter's dinner hour.","lunch3.t9":"{N01} nods, ladle in hand. The line moves quickly today.","lunch3.t10":"It is a visiting day; side-dish tins are stacked by the door. The van takes them in the afternoon.","lunch3.t11":"There is radish in the soup. The steam clouds the window.","n8.t":"The night of the eighth day. The city's windows go dark one by one.","n9.t":"The night of the ninth day. The empty pocket in the bag catches his fingertips.","n10.t":"The night of the tenth day. The sky over Sunshine House darkens first.","n11.t":"The night of the eleventh day. A radio somewhere gives tomorrow's weather.","ltr3.t":"Before choosing where to sleep, he takes a page from the notebook. Today's line.","letter.d08.a":"The wind was a little less cold today.","letter.d08.b.in":"From today, the place I sleep has a number.","letter.d08.b.out":"Today I wrote down three things to do. I will try them one at a time.","letter.d08.c":"Two days until the next visit.","letter.d09.a":"I stood in a lot of lines today.","letter.d09.b.ctr":"Today I wrote my full name on a form.","letter.d09.b.no":"I am looking for something I lost. I will look slowly.","letter.d09.c":"Tomorrow is a visiting day.","letter.d10.a":"Today was a long day.","letter.d10.b.seen":"I keep thinking about the pages of your notebook.","letter.d10.b.miss":"I could not come today. I have marked the next date again.","letter.d10.c":"On the next visiting day, I will come early.","letter.d11.a":"Today was a quiet day.","letter.d11.b.leg":"Today the hospital fitted my leg. I will walk one step at a time.","letter.d11.b.help":"Today I helped someone find a line on their form.","letter.d11.b.quiet":"Nothing special happened today. Still, the day went all right.","letter.d11.c":"Counting the days is a little easier now.","p10.t":"An old couple sits on the bench. The woman moves her bag onto her knees to make room. “Sit here.”","p10.a":"Thank them and sit","p10.b":"Say it is all right and stand","p10.a.r":"“Thank you.” {hero} sits at the end of the bench.","p10.ok":"The old man pours tea into the cap of a flask and holds it out. The faces of the two of them come into view.","p10.no":"The couple look out over the park in silence. That is as far as it goes.","p10.b.r":"{hero} bows his head and steps aside.","p06.t":"A dog on a lead comes toward him, wagging its tail. The owner pulls the lead back.","p06.a":"Greet the dog first","p06.b":"Step aside","p06.a.r":"{hero} crouches and offers the back of his hand. The dog sniffs it.","p06.ok":"The owner lets the lead go slack. “He knew you before I did.” For the first time, there is a face above the lead.","p06.no":"The owner gives a short nod and walks on with the dog.","p06.b.r":"The dog and its owner go past. Two lines of footprints stay on the path.","p02.t":"A small glove lies where the pushchair has just passed.","p02.a":"Pick it up and hand it over","p02.b":"Leave it","p02.a.r":"{hero} picks up the glove and follows the pushchair. “You dropped this.”","p02.ok":"The mother takes the glove and pulls it onto the child's hand. “Thank you. We nearly had only one.” For the first time, there is a face behind the pushchair.","p02.no":"The mother takes the glove and hurries across the road.","p02.b.r":"The glove stays by the bench. Someone may come back for it.","h101.t":"The old couple untie a cloth bundle. Two lunch boxes come out. “We made too much. Have one tomorrow.”","h101.a":"Take both","h101.b":"Take just one","h101.a.r":"He puts both lunch boxes deep in the bag. They are still warm.","h101.b.r":"“One is plenty.” The old woman nods and wraps the other one again.","h061.t":"From far off the dog knows him and runs over. The lead pulls tight.","h061.a":"Stroke the dog","h061.a.r":"The dog leans its head against his knee. The owner waits for them. For the rest of the day his shoulders feel lighter.","h021.t":"The mother with the pushchair holds out a paper bag. “Clothes he has grown out of, and a picture book. In case they are useful to someone.”","h021.a":"Take the picture book","h021.b":"Thank her and decline","h021.a.r":"A picture book with dinosaurs in it. The corners are a little worn. He puts it at the top of the bag.","h021.b.r":"“Thank you, truly.” She hangs the bag back on the pushchair.","item.picturebook":"picture book","item.bento":"lunch box","u3.bento":"Eat the lunch box","bento.r":"When he lifts the lid, the smell of rice comes up. He eats slowly.","doc.title":"Papers","doc.box.card":"ID reissue","doc.box.address":"Address registration","doc.box.shelter":"Shelter registration","doc.box.id":"Identity check","doc.need.card":"Needs: address registration","doc.need.address":"Needs: shelter registration","doc.need.shelter":"Needs: identity check","doc.need.id":"Needs: an ID card","doc.st.lock":"Locked","doc.st.open":"Opened","doc.st.wait":"Request received","doc.key.K1":"Confirmation letter — opens the identity check","doc.key.K2":"Medical record — opens the identity check","doc.key.K3":"Interview record — opens the shelter registration","doc.key.K4":"The way to ask — opens the address registration","doc.used":"handed in","doc.held":"in hand","doc.nokeys":"No keys yet.","doc.rule":"Open two different arrows and the ID can be requested again. Two papers that open the same arrow are not enough.","doc.solved":"Reissue request received. The day to collect it is written on the receipt.","doc.issued":"ID issued. Beside the three conditions for leave — a room, a work record, a reference — he can now write: identity, yes.","alt.u3.act":"A band of seven colours, one for each dawn of act one, greyer where hope was low. He sits at the far left.","alt.u3.office":"The director's office. Three sheets on the desk, the blue swing beyond the window.","alt.u3.desk":"The shelter office. A form on the desk, a purple blanket folded on a chair.","alt.u3.bag":"An open bag on the ground. Two folded papers, and the dashed outline of a missing card.","alt.u3.counter":"A service counter behind glass, a queue number, two sheets side by side. A green cross on the wall.","alt.u3.house.notebook":"A notebook open on the table: a mother's face, and an empty dashed space beside it. The child sits across from him.","alt.u3.montage":"The park through one day: six dots of the sun's arc over the bench and the yellow flowers.","alt.u3.park.p10":"An old couple on the park bench, making room. He stands beside them.","alt.u3.park.p06":"A man with a dog on a lead in the park. He sits on the bench.","alt.u3.park.p02":"A mother with a pushchair in the park; a small glove on the ground.","alt.u3.L7.p06":"A man with a dog crossing the square past the red donation box.","alt.u3.L7.p02":"A mother with a pushchair on the square; a small glove on the stones.","alt.u3.L7.p10":"An old couple walking slowly across the square, one with a cane."}}</script><!-- HS:MOD L-en-U3 END -->
<!-- HS:MOD L-ko-U3 START 41a2e36f558dfb0b --><script type="application/json" data-hs-pack data-hs-lang="ko" data-hs-mod="L-ko-U3">{"id":"L-ko-U3","lang":"ko","unit":3,"strings":{"a2.slug":"2막 · 서류와 몸","d8.slug":"8일 · 세 조건","d9.slug":"9일 · 서류","d10.slug":"10일 · 우리 가족","d11.slug":"11일","a2.h":"2막 — 서류와 몸","a2.faces":"1막 동안 얼굴을 되찾은 사람: {n}명.","a2.faces0":"1막 동안 얼굴을 되찾은 사람은 아직 없다.","a2.son.B1":"생일: 파란 그네를 함께 민 날.","a2.son.B2":"생일: 창문에 붙은 종이 한 장.","a2.son.B3":"생일: 가지 못한 날. 다음 날짜를 적어 둠.","a2.mem.look":"가장 오래 남은 순간: 고개를 들고 그들을 본 일.","a2.mem.listen":"가장 오래 남은 순간: {N03}의 편지 이야기를 끝까지 들은 밤.","a2.mem.urge":"가장 오래 남은 순간: {N03}에게 편지를 부치자고 한 밤.","a2.mem.noface":"가장 오래 남은 순간: 사진에서 얼굴을 빼 달라고 한 일.","a2.mem.shelter":"가장 오래 남은 순간: 한파의 밤에 연 쉼터 문.","a2.mem.name":"가장 오래 남은 순간: 급식소에서 자기 이름을 말한 일.","a2.mem.days":"가장 오래 남은 순간: 아무도 보지 않는 데서 지나간 일곱 날.","a2.new":"이제 쉼터에 정식으로 들어갈 수 있다.","a2.rest":"여기서 쉬어도 됩니다. 이야기는 기다립니다.","a2.back":"이 막에서 쓰러지면 여기로 돌아옵니다.","a2.go":"여덟째 날을 시작한다","a2.letterbox":"편지는 햇살의 집 우편함에 들어가 있다. 아침에 원장이 꺼낼 것이다.","d8.t":"여덟째 날 새벽. 수첩에 적힌 다음 면회일까지 이틀이 남아 있다.","d8.t9":"쉼터의 여덟째 아침. 불이 켜지고 담요를 갤 시간이다. 다음 면회까지 이틀.","d8.goal":"원장의 말이 남아 있다. 한 달 뒤의 외출 허가 심사, 그리고 알려 주겠다는 조건.","d8.a":"급식소 쪽으로 걷는다.","d8.b":"햇살의 집 쪽으로 걷는다.","d8.c":"조금 더 앉아 있는다.","d8.a.r":"급식소 쪽으로 걷는다. 줄은 아직 짧다.","d8.b.r":"햇살의 집 쪽 길로 든다.","d8.c.r":"해가 건물 위로 올라올 때까지 앉아 있는다.","h3.director":"햇살의 집에 가면 원장에게 조건을 직접 물을 수 있다.","m03.t":"원장이 책상에 종이 세 장을 놓는다. “방, 근무 기록, 추천서예요. 하나씩 따로 확인해요.” {hero}는 자기 이름을 적을 빈칸들을 본다.","m03.a":"먼저 할 일을 묻는다","m03.b":"다음 면회를 묻는다","m03.a.r":"“신분 서류부터 시작하세요. 쉼터에서 절차를 알려 줄 거예요.” 원장이 가장자리에 운영 시간을 적는다. “오늘 전부 끝내실 필요는 없어요.”","m03.b.r":"원장이 다음 면회 날짜를 가리킨다. “준비하는 동안에도 오실 수 있어요.” {hero}는 날짜가 바깥에 보이게 목록을 접는다.","m03.sheet":"배식대 옆에 햇살의 집 안내문이 붙어 있다. 안내에는 방, 근무 기록, 추천서의 세 조건이 나와 있다. {hero}는 신분 서류 절차와 다음 면회 날짜를 확인한다. 어느 조건을 이미 마쳤다고 적혀 있지는 않다.","m03.sheet.r":"국그릇을 들고 지나가며 안내문을 한 번 더 읽는다.","h3.shelter":"저녁에 쉼터에 가면 입소 상담을 받을 수 있다.","c0802.t":"쉼터 사무실 책상에 입소 상담 신청서가 놓여 있다. 상담원이 의자를 당겨 준다. “정식으로 등록하면 침대 번호가 정해져요. 몇 가지만 여쭤봐도 될까요?”","c0802.t.card":"쉼터 사무실 책상에 {N23}이 앉아 있다. 센터 카드를 알아본다. “새벽에 뵈었죠. 정식으로 등록하면 침대 번호가 정해져요. 몇 가지만 여쭤봐도 될까요?”","c0802.a":"상담을 받는다","c0802.b":"오늘은 침대만 쓴다","c0802.a.r":"질문은 짧다. 이름, 생년월일, 마지막으로 머문 곳. 상담원이 답을 받아 적고 면담 기록에 서명한다. “이 기록이 쉼터 등록 서류가 돼요.”","c0802.b.r":"상담원이 신청서를 서랍에 넣는다. “내일 저녁에도 여기 있어요.”","c0802.key":"열쇠 하나: 상담원 면담 기록. 서류판의 ‘쉼터 등록’ 화살표를 연다.","c0802n.t":"{N01}이 국자를 내려놓는다. “지하도 옆 쉼터가 입소 상담을 해요. 저녁에 가 보시겠어요?”","c0802n.a":"가 보겠다고 한다","c0802n.b":"다음에 생각한다","c0802n.a.r":"{N01}이 쉼터 이름과 저녁 시간을 냅킨에 적어 준다.","c0802n.b.r":"{N01}이 고개를 끄덕인다. “문은 저녁마다 열려요.”","u3.dinner":"쉼터로 가서 저녁을 먹는다","dinner.r":"식판 옆 명단에 그의 침대 번호가 있다. 국에서 김이 오른다.","dinner.r0":"식판을 받는 줄에 선다. 직원이 저녁 뒤에 상담 시간이 있다고 알려 준다.","u3.toShelter":"쉼터로 가서 상담을 받는다","c0901.t":"가방을 정리하다가 손이 멈춘다. 신분증이 들어 있던 칸이 비어 있다. 언제 없어졌는지 떠오르지 않는다.","c0901.board":"서류판: 메뉴의 ‘서류’ 또는 D 키로 연다.","c0901.a":"급식소에 먼저 간다","c0901.b":"민원 창구로 간다","c0901.c":"빈 칸을 한참 본다","c0901.a.r":"가방을 닫고 급식소 쪽으로 걷는다. {N01}에게 물어볼 것이 하나 생긴다.","c0901.b.r":"가방을 닫는다. 민원 창구는 병원 건물 1층에 있다.","c0901.c.r":"빈 칸에 손가락을 넣어 본다. 모서리가 닳은 자국만 남아 있다.","h3.counter":"병원 건물 1층 민원 창구는 오전부터 저녁 무렵까지 연다.","m04.t":"서류는 이름보다 먼저 주소를 묻는다. {hero}는 종이를 뒤집는다. 직원이 다른 서류를 가져온다. “오늘 확인할 수 있는 것부터 볼게요.”","m04.a":"이름을 적는다","m04.b":"부족한 서류를 묻는다","m04.a.r":"{hero}는 성과 이름을 쓴다. 직원이 종이 두 장을 나란히 놓는다. 두 장의 이름은 같다. 필요한 서류 옆의 표시는 다르다.","m04.b.r":"직원이 표시된 두 줄을 가리킨다. “서로 다른 조건이에요. 이 서류를 한 장 더 내도 다른 서류를 대신할 수는 없어요.” {hero}는 두 줄에 표시한다.","m04.short":"직원은 서류를 원래 순서로 돌려준다. “다음에는 이걸 가져오세요.” 한 줄에 표시한다. {hero}는 그 종이를 서류 맨 앞에 넣는다.","u3.counter":"창구 앞에 선다","ctr.t":"창구 위 번호가 바뀐다. 직원이 서류철을 펼친다. “오늘은 어느 서류를 확인할까요?”","ctr.need2":"서류철 맨 앞 종이에 표시된 줄이 아직 두 개다.","ctr.need1":"표시된 줄이 하나 남아 있다.","ctr.K1":"급식소 확인서를 낸다","ctr.K2":"진료 기록을 낸다","ctr.K3":"상담원 면담 기록을 낸다","ctr.K4":"{N03}의 요령대로 묻는다","ctr.ask":"무엇이 부족한지 묻는다","ctr.leave":"오늘은 돌아간다","ctr.leave.r":"번호표를 접어 서류철에 끼운다. 창구는 내일도 같은 시간에 연다.","ctr.ask.r1":"직원이 남은 한 줄을 가리킨다. “이 줄은 다른 서류로 확인해야 해요.”","ctr.same":"직원이 서류를 읽고 고개를 젓는다. “앞에서 확인한 것과 같은 조건이에요. 한 장 더 내도 다른 서류를 대신할 수는 없어요.”","ctr.ok.id":"직원이 서류를 확인하고 ‘신원 확인’ 줄에 도장을 찍는다.","ctr.ok.shelter":"직원이 면담 기록을 확인하고 ‘쉼터 등록’ 줄에 도장을 찍는다.","ctr.ok.address":"직원이 잠시 생각하더니 다른 양식을 꺼낸다. ‘주소 등록’ 줄에는 쉼터 주소를 쓸 수 있다. 도장을 찍는다.","ctr.solved":"직원이 서류철을 닫고 접수증을 건넨다. “재발급 신청이 접수됐어요. 며칠 뒤에 다시 오세요.” 접수증에는 찾으러 올 날짜가 적혀 있다. {hero}는 접수증을 사진 옆에 넣는다.","ctr.more":"직원이 남은 줄에 표시한다. “이것까지 확인되면 신청하실 수 있어요.”","u3.k1":"{N01}에게 확인서를 부탁한다","k1.t":"{N01}이 앞치마에 손을 닦는다. “확인서요? 여기서 식사하신 날짜는 제가 적어 드릴 수 있어요.” 장부를 넘긴다.","k1.t0":"{N01}이 장부를 넘기다 멈춘다. “확인서에는 이름이 들어가야 해요. 성함을 여쭤봐도 될까요?”","k1.a":"부탁한다","k1.a0":"이름을 말한다","k1.b":"다음에 부탁한다","k1.a.r":"{N01}이 날짜를 적고 서명한다. “창구에서 신원을 확인할 때 쓰실 수 있어요.” 종이에서 국 냄새가 조금 난다.","k1.a.r0":"{hero}는 자기 이름을 말한다. {N01}이 그 이름을 확인서 맨 위에 적는다. 장부의 빈칸에도 같은 이름을 쓴다.","k1.b.r":"{N01}이 장부를 덮는다. “언제든 말씀하세요.”","k1.sq":"{N05}가 가져오라던 급식소 확인서도 이 종이다.","u3.nurse":"{N05}를 찾는다","s101.has":"가방에는 이미 급식소 확인서가 있다.","s103.t":"{N05}가 상담 신청서를 다시 꺼낸다. 빈칸 하나가 급식소 확인서를 기다린다.","s103.a":"서류를 낸다","s103.r":"“서류를 가져오셨네요.” {N05}가 종이마다 이름을 확인한다. “이제 상담을 진행할 수 있어요.” {hero}는 이전 대기 번호 대신 접수증을 보관한다.","s103.key":"열쇠 하나: 진료 기록 사본. 서류판의 ‘신원 확인’ 화살표를 연다. 결과는 열하루째 날에 나온다.","s104.x":"{N05}가 진료 침대 위에 상자를 놓는다. “상담 결과가 나왔어요. 맞춰 볼까요?”","s104.h":"{N05}가 연결부를 살핀다. “수리 승인이 났어요. 오늘 바로 손볼 수 있어요.”","s104.n":"{N05}가 결과지를 넘긴다. “지금 쓰시는 건 관리가 잘 돼 있어요. 바꿀 건 없네요.” 대기실 옆자리 사람이 서류를 든 채 줄을 찾는다.","s104.a":"{N05} 앞에 앉는다","s104.x.r":"{N05}가 보는 동안 {hero}는 의족이 맞는지 살핀다. “아프면 알려 주세요.” {hero}는 한 걸음 걷고 멈춘다. 연결부를 관리하는 방법을 묻는다.","s104.h.r":"연결부에서 전과 같은 소리가 나지 않는다. {hero}는 일어나기 전에 한 번 더 확인한다. {N05}가 수리 기록을 준다. {hero}는 다른 서류와 함께 보관한다.","s104.n.r":"다음 사람이 직원이 말한 줄을 찾지 못한다. {hero}는 그 줄을 가리키고 손을 뗀다. 상대는 자기 말로 답을 적는다.","s104.rehab":"{N05}가 재활 운동 안내지를 접어 준다. “매일 조금씩요. 한 번에 전부 나아지지는 않아요.”","k4.t":"{N03}가 서류철을 손가락으로 두드린다. “주소가 없으면 쉼터 주소를 써도 되는지 물어봐. 그런 양식이 있어. 물어봐야 나오지.”","k4.a":"귀담아듣는다","k4.b":"다음에 듣는다","k4.a.r":"{hero}는 그 말을 서류철 안쪽에 적는다. {N03}가 기침을 하고 담요를 끌어올린다.","k4.b.r":"{N03}가 어깨를 으쓱한다. “급할 건 없지.”","k4.key":"열쇠 하나: 창구 요령. 서류판의 ‘주소 등록’ 화살표를 연다.","d10.t":"열흘째 아침. 오늘 오후는 면회일이다.","d10.t9":"쉼터의 열흘째 아침. 오늘 오후는 면회일이다.","d10.plan":"면회일에는 급식소가 점심을 일찍 주고, 오후에 승합차가 떠난다.","d10.a":"급식소로 간다","d10.b":"햇살의 집 쪽으로 걷는다","d10.c":"조금 더 쉰다","d10.a.r":"급식소 쪽으로 걷는다. 면회일의 줄은 일찍 선다.","d10.b.r":"햇살의 집 쪽 길로 든다. 오후까지는 시간이 있다.","d10.c.r":"수첩에서 면회 날짜를 한 번 더 확인한다.","gift.give.picturebook":"그림책을 건넨다.","gift.r.picturebook":"{son}이 그림책을 무릎에 올리고 첫 장을 넘긴다. “이거 읽어 줄 수 있어요?”","lgive.t":"가방 속에 밤마다 쓴 편지가 접혀 있다. 원장에게 맡기면 {son}에게 전해 줄 수 있다.","lgive.a":"원장에게 맡긴다","lgive.b":"아직 가지고 있는다","lgive.r":"원장이 편지를 받아 서랍에 넣는다. “전해 줄게요.”","m05.t":"{son}이 학교 공책을 편다. 사진을 보고 그린 엄마 얼굴이 있다. 그 옆에 빈자리가 남아 있다. “아빠 얼굴이 기억이 안 나요.” 아이가 말한다.","m05.a":"함께 공책을 본다","m05.b":"아빠도 보고 싶을 거라 한다","m05.c":"그림을 도와주겠다고 한다","m05.a.r":"{hero}는 공책 옆에 손을 놓는다. {son}이 모서리에 작은 나무를 그린다. “우리 창문 근처에 있어요.” 아이가 두 사람 모두 보도록 공책을 돌린다.","m05.b.r":"“아빠도 너를 보고 싶어 할 거야.” {son}은 빈자리를 본다. “그럼 자리를 남겨 둘래요.” 아이가 그 아래에 의자 끝을 그린다.","m05.c.r":"“그림 그리는 것 도와줄까?” {son}이 연필을 내민다. “아빠 얼굴을 그려 주실래요?” {hero}의 손이 종이 위에서 멈춘다. 아이는 연필을 거두지 않고 기다린다.","m05.c2":"“그건 천천히 그리고 싶어.” {hero}가 말한다. “조금 더 같이 앉아 있어도 될까?” {son}이 공책을 탁자 가운데로 옮긴다.","d11.s104":"열하루째 아침. 오늘 병원에서 상담 결과가 나온다.","d11.go":"병원으로 간다","d11.stay":"오늘은 천천히 시작한다","d11.go.r":"병원 쪽으로 걷는다.","d11.stay.r":"서두르지 않고 하루를 시작한다.","mont.day":"11일째","mont.go":"하루를 보낸다","mont.r":"점심, 오후의 쉼, 밤의 잠자리. 하루가 그렇게 흘러가기 시작한다.","mont.stop":"성한 다리가 먼저 알려 준다. 오늘은 계획대로 되지 않을 것이다.","mont.P01":"서류 가방의 남자가 지나가며 고개를 끄덕인다.","mont.P07":"청소 노동자가 빗자루에 기대어 먼저 인사한다.","mont.P08":"광장의 기타리스트가 첫 곡을 그가 있는 쪽으로 향해 친다.","mont.P12":"순찰하던 경찰관이 지나가며 쉼터 쪽을 가리킨다.","mont.P10":"벤치의 노부부가 가운데 자리를 비워 둔다.","mont.P06":"개가 먼저 달려와 그의 신발 냄새를 맡는다.","mont.P02":"유모차를 미는 엄마가 장갑 낀 손을 들어 보인다.","mont.obj.receipt":"접수증은 사진 옆에 있다. 접힌 자리가 하나 늘어 있다.","mont.wx.rain":"비가 그친 뒤에도 벤치는 하루 내내 젖어 있다.","mont.obj.paper":"서류철 맨 앞 종이가 밤사이 조금 휘어 있다.","lunch3.t8":"배식대 옆에 쉼터 저녁 시간을 알리는 안내문이 새로 붙어 있다.","lunch3.t9":"{N01}이 국자를 든 채 고개를 끄덕인다. 오늘은 줄이 빨리 줄어든다.","lunch3.t10":"면회일이라 반찬 통이 문 옆에 쌓여 있다. 오후에 승합차가 실어 간다.","lunch3.t11":"국에 무가 들어 있다. 김이 창문을 뿌옇게 덮는다.","n8.t":"여덟째 날 밤. 도시의 창들이 하나씩 꺼진다.","n9.t":"아홉째 날 밤. 가방 속 빈 칸이 손끝에 걸린다.","n10.t":"열흘째 밤. 햇살의 집 쪽 하늘이 먼저 어두워진다.","n11.t":"열하루째 밤. 어디선가 라디오가 내일 날씨를 알린다.","ltr3.t":"잠자리를 고르기 전, 수첩에서 한 장을 뜯는다. 오늘의 한 줄.","letter.d08.a":"오늘은 바람이 조금 덜 찼어.","letter.d08.b.in":"오늘부터 잠자는 자리에 번호가 생겼어.","letter.d08.b.out":"오늘은 할 일을 세 가지 적었어. 하나씩 해 볼게.","letter.d08.c":"다음 면회까지 이틀 남았어.","letter.d09.a":"오늘은 줄을 많이 섰어.","letter.d09.b.ctr":"오늘은 서류에 이름을 또박또박 적었어.","letter.d09.b.no":"잃어버린 걸 하나 찾고 있어. 천천히 찾을게.","letter.d09.c":"내일은 면회 날이야.","letter.d10.a":"오늘은 하루가 길었어.","letter.d10.b.seen":"네 공책의 그림들이 계속 생각나.","letter.d10.b.miss":"오늘은 가지 못했어. 다음 날짜를 다시 적어 둘게.","letter.d10.c":"다음 면회 날엔 일찍 갈게.","letter.d11.a":"오늘은 조용한 하루였어.","letter.d11.b.leg":"오늘 병원에서 다리를 맞췄어. 한 걸음씩 걸어 볼게.","letter.d11.b.help":"오늘은 누군가의 서류에서 한 줄을 같이 찾았어.","letter.d11.b.quiet":"오늘은 별일 없었어. 그래도 하루를 잘 보냈어.","letter.d11.c":"날을 세는 게 조금 쉬워졌어.","p10.t":"벤치에 노부부가 앉아 있다. 할머니가 가방을 무릎으로 옮겨 자리를 만든다. “여기 앉으세요.”","p10.a":"고맙다고 하고 앉는다","p10.b":"괜찮다며 서 있는다","p10.a.r":"“고맙습니다.” {hero}는 벤치 끝에 앉는다.","p10.ok":"할아버지가 보온병 뚜껑에 차를 따라 내민다. 두 사람의 얼굴이 보인다.","p10.no":"노부부는 말없이 공원을 바라본다. 대화는 거기까지다.","p10.b.r":"{hero}는 고개를 숙여 인사하고 비켜 선다.","p06.t":"목줄을 맨 개가 꼬리를 흔들며 다가온다. 주인이 목줄을 당긴다.","p06.a":"개에게 먼저 인사한다","p06.b":"길을 비켜 준다","p06.a.r":"{hero}는 몸을 낮추고 손등을 내민다. 개가 냄새를 맡는다.","p06.ok":"주인이 목줄을 느슨하게 푼다. “얘가 먼저 알아보네요.” 목줄 위로 처음으로 얼굴이 보인다.","p06.no":"주인이 짧게 고개를 숙이고 개와 함께 지나간다.","p06.b.r":"개와 주인이 지나간다. 발자국 두 줄이 길 위에 남는다.","p02.t":"유모차가 지나간 자리에 작은 장갑 한 짝이 떨어져 있다.","p02.a":"장갑을 주워 건넨다","p02.b":"그대로 둔다","p02.a.r":"{hero}는 장갑을 주워 유모차를 따라간다. “이거 떨어뜨리셨어요.”","p02.ok":"엄마가 장갑을 받아 아이 손에 끼운다. “고맙습니다. 한 짝만 남을 뻔했어요.” 유모차 뒤로 처음으로 얼굴이 보인다.","p02.no":"엄마가 장갑을 받아 들고 서둘러 길을 건넌다.","p02.b.r":"장갑은 벤치 옆에 남는다. 누군가 다시 찾으러 올지도 모른다.","h101.t":"벤치의 노부부가 보자기를 푼다. 도시락 두 개가 나온다. “많이 싸 왔어요. 하나는 내일 드세요.”","h101.a":"두 개 다 받는다","h101.b":"하나만 받는다","h101.a.r":"도시락 두 개를 가방 깊이 넣는다. 아직 따뜻하다.","h101.b.r":"“하나면 충분합니다.” 할머니가 고개를 끄덕이고 남은 하나를 다시 싼다.","h061.t":"멀리서 개가 먼저 알아보고 달려온다. 목줄이 팽팽해진다.","h061.a":"개를 쓰다듬는다","h061.a.r":"개가 그의 무릎에 머리를 기댄다. 주인이 기다려 준다. 오늘 하루는 어깨가 덜 무겁다.","h021.t":"유모차 엄마가 종이 가방을 내민다. “아이가 커서 못 입는 옷이랑 그림책이에요. 혹시 쓰실 데가 있을까 해서요.”","h021.a":"그림책을 받는다","h021.b":"마음만 받는다","h021.a.r":"공룡이 나오는 그림책이다. 모서리가 조금 닳아 있다. 가방 맨 위에 넣는다.","h021.b.r":"“마음만 받을게요.” 엄마가 가방을 다시 유모차에 건다.","item.picturebook":"그림책","item.bento":"도시락","u3.bento":"도시락을 먹는다","bento.r":"뚜껑을 열자 밥 냄새가 퍼진다. 천천히 먹는다.","doc.title":"서류","doc.box.card":"신분증 재발급","doc.box.address":"주소 등록","doc.box.shelter":"쉼터 등록","doc.box.id":"신원 확인","doc.need.card":"필요: 주소 등록","doc.need.address":"필요: 쉼터 등록","doc.need.shelter":"필요: 신원 확인","doc.need.id":"필요: 신분증","doc.st.lock":"잠김","doc.st.open":"열림","doc.st.wait":"신청 접수","doc.key.K1":"사실 확인서 — 신원 확인을 연다","doc.key.K2":"진료 기록 — 신원 확인을 연다","doc.key.K3":"상담원 면담 기록 — 쉼터 등록을 연다","doc.key.K4":"창구 요령 — 주소 등록을 연다","doc.used":"창구에 냄","doc.held":"가지고 있음","doc.nokeys":"아직 열쇠가 없다.","doc.rule":"서로 다른 화살표 두 개를 열면 신분증 재발급을 신청할 수 있다. 같은 화살표를 여는 서류 두 장으로는 되지 않는다.","doc.solved":"재발급 신청 접수. 찾으러 갈 날은 접수증에 적혀 있다.","doc.issued":"신분증 발급. 외출 허가의 세 조건(방·근무 기록·추천서) 옆에 이제 \"신분 있음\"을 적을 수 있다.","alt.u3.act":"1막의 새벽 일곱 개가 가로 띠로 놓여 있다. 희망이 낮았던 날일수록 잿빛이다. 그는 왼쪽 끝에 앉아 있다.","alt.u3.office":"원장실. 책상 위 종이 세 장, 창밖의 파란 그네.","alt.u3.desk":"쉼터 사무실. 책상 위 신청서, 의자에 접힌 보랏빛 담요.","alt.u3.bag":"땅에 펼친 가방. 접힌 종이 두 장, 그리고 없어진 카드의 점선 윤곽.","alt.u3.counter":"유리 너머 민원 창구, 번호표, 나란히 놓인 종이 두 장. 벽의 초록 십자.","alt.u3.house.notebook":"탁자 위에 펼친 공책. 엄마 얼굴과 그 옆의 점선 빈자리. 아이가 맞은편에 앉아 있다.","alt.u3.montage":"하루의 공원. 벤치와 노란 들꽃 위로 해가 지나간 자리 여섯 점.","alt.u3.park.p10":"공원 벤치의 노부부가 자리를 만든다. 그는 옆에 서 있다.","alt.u3.park.p06":"공원에서 개를 데리고 걷는 남자. 그는 벤치에 앉아 있다.","alt.u3.park.p02":"공원의 유모차와 엄마. 땅에 작은 장갑 한 짝.","alt.u3.L7.p06":"빨간 모금함 옆으로 광장을 지나는 개와 남자.","alt.u3.L7.p02":"광장의 유모차와 엄마. 돌바닥에 작은 장갑 한 짝.","alt.u3.L7.p10":"지팡이를 짚은 노부부가 광장을 천천히 건넌다."}}</script><!-- HS:MOD L-ko-U3 END -->
