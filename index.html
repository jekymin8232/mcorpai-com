  --ink:#ece4d8;
  --ink-dim:#8c8276;
  --signal:#f4a83d;        /* 새벽 앰버 */
  --ok:#7bcf9a;            /* 검증 완료 시 초록 */
  --line:#2a221b;

  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Helvetica Neue","Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  box-sizing:border-box; display:block; width:100%; margin:0 auto;
  background:radial-gradient(120% 80% at 50% -8%, rgba(244,168,61,.10), transparent 55%), var(--bg);
  color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden;
}
#mcorp-hub *{box-sizing:border-box;}
#mcorp-hub .mc-wrap{ max-width:920px; margin:0 auto; padding:clamp(24px,5vw,56px) clamp(20px,5vw,44px); }

/* ===== 상단 바 ===== */
#mcorp-hub .mc-top{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
#mcorp-hub .mc-brand{
  font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-decoration:none;
  color:var(--ink); transition:color .15s ease;
}
#mcorp-hub .mc-brand b{ color:var(--signal); font-weight:700; }
#mcorp-hub .mc-brand:hover{ color:var(--signal); }
#mcorp-hub .mc-lang{
  font-family:var(--mono); font-size:12px; letter-spacing:.05em; color:var(--ink);
  background:var(--bg-soft); border:1px solid var(--line); border-radius:8px;
  padding:8px 30px 8px 12px; cursor:pointer; appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23f4a83d' stroke-width='1.4'/></svg>");
  background-repeat:no-repeat; background-position:right 11px center;
}
#mcorp-hub .mc-lang:focus{ outline:1px solid var(--signal); }

/* ===== 상단 진입 존: ECG 애니메이션 + 핵심 진입 버튼 ===== */
#mcorp-hub .mc-enter{ text-align:center; padding:clamp(34px,7vw,70px) 0 clamp(10px,3vw,24px); }
#mcorp-hub .mc-ecg{ width:min(280px,72%); height:auto; display:block; margin:0 auto 14px; }
#mcorp-hub .mc-ecg .base{ fill:none; stroke:var(--line); stroke-width:2; }
#mcorp-hub .mc-ecg .run{
  fill:none; stroke:var(--signal); stroke-width:2.4; stroke-linecap:round;
  stroke-dasharray:38 240; animation:mc-trace 2.6s linear infinite;
  filter:drop-shadow(0 0 5px rgba(244,168,61,.85));
}
@keyframes mc-trace{ from{ stroke-dashoffset:240; } to{ stroke-dashoffset:0; } }
#mcorp-hub .mc-kicker{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-dim); margin:0 0 26px;
}
#mcorp-hub .mc-cta{
  display:inline-block; font-family:var(--mono); font-size:14px; letter-spacing:.03em;
  text-decoration:none; background:var(--signal); color:var(--bg);
  padding:15px 30px; border-radius:10px; font-weight:600;
  box-shadow:0 10px 34px -12px rgba(244,168,61,.7); transition:transform .15s ease, filter .15s ease;
}
#mcorp-hub .mc-cta:hover{ transform:translateY(-2px); filter:brightness(1.07); }

/* ===== 중앙: 사연(심장) ===== */
#mcorp-hub .mc-heart{ text-align:center; padding:clamp(40px,8vw,86px) 0; }
#mcorp-hub .mc-origin{
  font-family:var(--serif); font-size:clamp(27px,5.2vw,50px); line-height:1.2;
  font-weight:500; letter-spacing:-.01em; margin:0 auto 22px; max-width:20ch;
}
#mcorp-hub .mc-origin .mc-mark{ color:var(--signal); font-style:italic; }
#mcorp-hub .mc-sub{ font-size:clamp(15px,2.1vw,19px); line-height:1.6; color:var(--ink-dim); max-width:48ch; margin:0 auto; }

/* ===== 일반 섹션 ===== */
#mcorp-hub .mc-sec{ margin-top:clamp(46px,8vw,88px); text-align:center; }
#mcorp-hub .mc-label{
  font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--signal); margin-bottom:18px;
}
#mcorp-hub .mc-body{ font-size:clamp(15px,2vw,18px); line-height:1.7; color:var(--ink); max-width:52ch; margin:0 auto; }

/* 세 가지 약속 */
#mcorp-hub .mc-pillars{ display:grid; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:12px; overflow:hidden; margin-top:6px; text-align:left; }
@media(min-width:720px){ #mcorp-hub .mc-pillars{ grid-template-columns:repeat(3,1fr); } }
#mcorp-hub .mc-pill{ background:var(--bg-soft); padding:24px 20px; }
#mcorp-hub .mc-pill .n{ font-family:var(--mono); color:var(--signal); font-size:12px; letter-spacing:.1em; }
#mcorp-hub .mc-pill h3{ font-family:var(--serif); font-weight:500; font-size:20px; margin:10px 0 9px; }
#mcorp-hub .mc-pill p{ font-size:14px; line-height:1.6; color:var(--ink-dim); margin:0; }

/* 적용 영역 */
#mcorp-hub .mc-apps{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
#mcorp-hub .mc-app{ font-family:var(--mono); font-size:13px; border:1px solid var(--line); border-radius:999px; padding:9px 16px; }
#mcorp-hub .mc-app::before{ content:"› "; color:var(--signal); }

/* 공개/검증 */
#mcorp-hub .mc-verify{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:center; margin-top:26px; }
#mcorp-hub .mc-btn{
  font-family:var(--mono); font-size:13px; letter-spacing:.04em; text-decoration:none;
  padding:13px 20px; border-radius:9px; border:1px solid var(--signal); color:var(--signal);
  transition:background .18s ease,color .18s ease;
}
#mcorp-hub .mc-btn:hover{ background:var(--signal); color:var(--bg); }

/* 보안 무결 검증서 배지 (눈에 띄게) */
#mcorp-hub .mc-cert{
  display:inline-flex; align-items:center; gap:13px; text-decoration:none; color:var(--ink);
  border:1px solid var(--signal); border-radius:12px; padding:13px 18px;
  background:linear-gradient(180deg, rgba(244,168,61,.13), rgba(244,168,61,.03));
  box-shadow:0 0 0 1px rgba(244,168,61,.14), 0 10px 32px -14px rgba(244,168,61,.55);
  transition:box-shadow .18s ease, transform .15s ease;
}
#mcorp-hub .mc-cert:hover{ transform:translateY(-2px); box-shadow:0 0 0 1px rgba(244,168,61,.3), 0 16px 40px -14px rgba(244,168,61,.7); }
#mcorp-hub .mc-cert .shield{ color:var(--signal); flex:0 0 auto; }
#mcorp-hub .mc-cert-label{ font-family:var(--mono); font-size:13px; letter-spacing:.03em; color:var(--signal); }
#mcorp-hub .mc-cert-status{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:999px; padding:3px 9px; color:var(--ink-dim); white-space:nowrap;
}

#mcorp-hub.cert-verified .mc-cert-status{ color:var(--ok); border-color:var(--ok); }
#mcorp-hub.cert-verified .mc-cert .shield{ color:var(--ok); }

/* 연락 */
#mcorp-hub .mc-mail{ font-family:var(--mono); font-size:clamp(16px,2.6vw,22px); color:var(--signal);

#mcorp-hub .mc-mail:hover{ border-color:var(--signal); }

/* 푸터 */
#mcorp-hub .mc-foot{ margin-top:clamp(54px,9vw,100px); padding-top:24px; border-top:1px solid var(--line);

}

  var root = document.getElementById('mcorp-hub');
  var sel  = document.getElementById('mcLang');

  function applyLang(lang){
    var dict = I18N[lang] || I18N.en;
    var nodes = root.querySelectorAll('[data-i18n]');
    for(var i=0;i<nodes.length;i++){
      var key = nodes[i].getAttribute('data-i18n');
      if(dict[key] !== undefined){ nodes[i].textContent = dict[key]; }
    }
    // 사연 문장 안의 mcorpai 를 앰버색으로 강조
    var origin = root.querySelector('.mc-origin');
    if(origin){
      origin.innerHTML = origin.textContent.replace(/mcorpai/i,'<span class="mc-mark">mcorpai</span>');
    }
    root.setAttribute('lang', lang);
    root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    try{ localStorage.setItem('mcorpai_lang', lang); }catch(e){}
  }

  function initLang(){
    var saved;
    try{ saved = localStorage.getItem('mcorpai_lang'); }catch(e){}
    if(saved && I18N[saved]) return saved;
    var nav = (navigator.language || 'en').slice(0,2).toLowerCase();
    return I18N[nav] ? nav : 'en';
  }

  var start = initLang();
  sel.value = start;
  applyLang(start);
  sel.addEventListener('change', function(){ applyLang(sel.value); });
})();
