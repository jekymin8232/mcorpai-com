<!-- HS:MOD L-en-U4 START 47792fe80c3906d6 --><script type="application/json" data-hs-pack data-hs-lang="en" data-hs-mod="L-en-U4">{"id":"L-en-U4","lang":"en","unit":4,"strings":{"d12.slug":"Day 12 · The second cold","d13.slug":"Day 13 · The underpass","d14.slug":"Day 14 · The reply","d15.slug":"Day 15 · A name on a card","u4.rest":"Gather himself and rest","d12.t":"The dawn of the twelfth day. The board on the square runs the cold-weather warning again. Tonight, fourteen below.","d12.t9":"The twelfth morning at the shelter. A staff member reads out the warning for tonight and sets out an extra blanket on each bunk.","d12.bed":"His bed number is on the shelter's list. Tonight he knows where he will sleep.","d12.open":"The shelter by the underpass opens its doors tonight as well.","d12.none":"The second cold of the winter. He has to think about tonight's place before the evening.","d12.a":"Walk toward the meal centre","d12.b":"Walk toward the underpass","d12.a.r":"He walks toward the meal centre. His breath hangs long in the air.","d12.b.r":"He walks toward the underpass. The fluorescent tubes are on even in the daytime.","d12.c.r":"He turns up his collar and stays a little longer.","h4.cold":"Tonight is a cold night. Sleeping outside will cost his body a great deal.","h4.cold.bed":"Tonight is a cold night. There is a bed with his number at the shelter.","h4.cold.open":"Tonight is a cold night. The shelter by the underpass takes people in.","c1202.t":"The officer on patrol stops again. “Below zero again tonight. The shelter door is open. Shall we walk there together?”","c1202.a":"Say he will go to the shelter","c1202.b":"Say he will be all right","c1202.a.r":"The officer nods and points the way to the shelter.","c1202.a.far":"“The door stays open all night.” The officer explains the way in a few words.","c1202.b.r":"The officer puts a leaflet in his hand and moves on.","n12.t":"The night of the twelfth day. The second coldest night of the winter.","n12.cold":"Each breath stings at the tip of his nose.","u4.paper":"Wrap himself in newspaper","u4.drum":"Light the drum fire with the others","u4.hotpack":"Use the hand warmer","u4.paper.r":"He wraps the newspaper in layers. Each time it rustles, a little less wind gets through.","u4.drum.r.N03":"{N03} feeds dry cardboard into the drum. The firelight reaches both their hands.","u4.drum.r.N10":"{N10} holds his hands to the fire. “This side, it's warmer.”","u4.hotpack.r":"He shakes the hand warmer. Slowly his palm warms.","item.hotpack":"hand warmer","d13.t":"The dawn of the thirteenth day. The wind has eased a little.","d13.t9":"The thirteenth morning at the shelter. Blankets are folded on every bunk.","d13.walt":"{N03} says on his way past, “There's a new one in the underpass. Still young.”","d13.a":"Walk toward the meal centre","d13.b":"Go to the underpass","d13.a.r":"He walks toward the meal centre. The line has already begun.","d13.b.r":"He goes down the underpass stairs. Someone has laid out fresh cardboard by the far wall.","d13.c.r":"He rests until his hands stop aching.","h4.jun":"The young man {N03} talked about is in the underpass.","c1301.t":"By the underpass wall, a young man he has not seen before sits on flattened cardboard, a page on his knee. He looks up first. “Is this… is someone sitting here?”","c1301.a":"Sit down beside him","c1301.b":"Share something to eat","c1301.c":"Just nod","c1301.a.r":"{hero} sits down, leaving room for one person between them. The young man says his name. “I'm {N10}.”","c1301.b.r":"{hero} breaks what he has into two. The young man hesitates, then takes half. “Thanks. I'm… {N10}.”","c1301.c.r":"{hero} nods and goes to his own spot. The young man looks back at his page.","s05.1.t":"{N10} has copied three addresses onto a page. “I know how to get to these two,” he says. He leaves the third one unmarked. The bus notice beside him is wet at the edge.","s05.1.a":"Look at the route together","s05.1.b":"Ask which place he will try first","s05.1.a.r":"They trace the way on the page with one finger each. {N10} circles the second address. “This one,” he says. “I want to ask the questions myself.” {hero} holds the dry edge while {N10} finishes marking the route.","s05.1.b.r":"“This one,” {N10} says, tapping the page. “I want to ask the questions myself.” {hero} holds the dry edge while {N10} finishes marking the route.","s05.2.t":"“Could you walk as far as the crossing with me?” {N10} asks. “After that, I want to go in alone.” He checks the time on the notice before folding it.","s05.2.a":"Walk together","s05.2.b":"Tell him when you can meet again","s05.2.a.r":"At the crossing, {N10} takes the page back. “I can find it from here.” {hero} waits for the light to change. {N10} crosses carrying the page in his own hand.","s05.2.b.r":"{N10} writes the meeting time beside the address. “I will tell you how it went.” He does not erase the route they checked together.","n13.t":"The night of the thirteenth day. Low voices drift up from the underpass.","d14.t":"The morning of the fourteenth day. This afternoon is a visiting day.","d14.t9":"The fourteenth morning at the shelter. This afternoon is a visiting day.","d14.a":"Go to the meal centre","d14.b":"Walk toward Sunshine House","d14.a.r":"He walks toward the meal centre. Today the visit comes after lunch.","d14.b.r":"He takes the road toward Sunshine House. The afternoon is still far off.","d14.c.r":"He reads the visiting date in his notebook again.","m06.a":"“I read your letter,” {son} says. He unfolds a page. A blue swing fills the middle. “I made this while I was waiting.” He smooths the page with both hands.","m06.b":"{son} shows {hero} a page in his notebook. “This is the swing.” He closes the notebook when the visit ends. {hero} looks at the folded paper still inside his own bag.","m06.b0":"{son} shows {hero} a page in his notebook. “This is the swing.” {hero} watches the notebook close. At the door, he checks the next visit date. {son} is already looking for his yellow pencil.","m06.ask":"Ask what he should write about","m06.look":"Look at the page with him","m06.a.r":"“What would you like me to write about?” {hero} asks. “Something you saw,” {son} says. “It does not have to be a big thing.”","m06.b.r":"{son} pushes one edge of the page toward {hero}. For a while they look at it without speaking. Then {son} goes back to his own drawing.","m06.reply":"{son} folds the drawing once and holds it out. “You keep it. I can draw another.”","item.reply":"reply drawing","u4.reply":"Look at the reply drawing","u4.reply.r":"He unfolds the page. The blue swing. He flattens the fold with his hand.","diary.t":"Near the end of the visit, {son} holds out a small notebook. His name is written on the cover in uneven letters. “It's my diary. You keep it.”","diary.r":"{hero} puts the diary in the inner pocket of his bag, beside the photograph.","item.diary":"the son's diary","m16.t":"{son} holds the notebook against his chest. “You feel like my dad.” {hero}'s hand stops above the child's hair. The director waits beside the open door.","m16.a":"Tell him you are his father","m16.b":"Wait a little longer","m16.a.r":"“I am your dad.” {son} looks at him, then at the director. She nods. He puts the notebook on the table. “Will you sit here?” He points to the chair beside him.","m16.a2":"{hero} sits. {son} opens a page and moves the pencil toward him. “Can we draw here?” They look at the page before either of them draws a line.","m16.after":"After {son} returns to his room, the director asks, “What can you tell him for certain?” {hero} looks at the next visit date. “That I want to come again. I will check the rest first.”","m16.b.r":"“I would like to stay with you a little longer today.” {son} moves the chair toward him. “Then help me choose what to draw.” He opens a page.","n14.t":"The night of the fourteenth day. The windows toward Sunshine House go dark one by one.","d15.t":"The morning of the fifteenth day. The date written on the receipt is today.","d15.t9":"The fifteenth morning at the shelter. The date written on the receipt is today.","d15.receipt":"The receipt is in the pocket beside the photograph. The counter opens in the morning.","d15.a":"Go to the counter","d15.b":"Go to the meal centre first","d15.a.r":"He walks toward the hospital building. He checks the receipt once on the way.","d15.b.r":"He walks toward the meal centre. The counter can wait until after lunch.","d15.c.r":"He rests a while with his hand over the pocket.","d15.t0":"The morning of the fifteenth day. The circle of papers is still closed.","d15.t09":"The fifteenth morning at the shelter. The circle of papers is still closed.","d15.circle":"Word comes that {N01} at the meal centre has something ready for him.","d15.a0":"Go to the meal centre","d15.b0":"Go to the counter","d15.a0.r":"He walks toward the meal centre.","d15.b0.r":"He walks toward the hospital building.","d15.c0.r":"He rests a while before the day begins.","h4.counter":"The ID card is handed out at the counter on the hospital's ground floor. It is open until early evening.","h4.park":"{N01} at the meal centre knows the step that is left.","m07.rescue":"{N01} brings a confirmation sheet. “This is the remaining step. Take it to the desk.” {hero} checks the opening time before putting the sheet with the other papers.","m07.rescue.a":"Take the confirmation","m07.rescue.r":"{N01} unties her apron. “I'll come to the counter with you. My name has to go on it.”","id.b1":"The clerk slides the card across the counter. His name is printed on it, in the same letters as everyone else's.","id.b1.late":"{N01} signs the bottom of the letter, then slides it across with the form. The clerk slides the card across the counter. His name is printed on it, in the same letters as everyone else's.","id.take":"Take the card","id.b5":"He reads it twice. Then he puts it in the pocket with the photo.","id.photo":"In the small square, a face he has not seen in a long time looks back.","id.photoA":"He looks at the photograph for a long time.","n15.next":"Tomorrow, for the first time, he can choose work.","id.open":"The circle on the form board is open now.","id.name":"The last time he heard it, it came with soup.","item.idcard":"ID card","note.t":"{hero} walks back through the underpass with the card in his pocket, beside the photograph. {N10}'s cardboard is folded flat against the wall. A stone sits on top of it. Under the stone, a page torn from a notebook.","note.text":"You've got a name now. That's good. I'm going to try somewhere else. — {N10}","note.a":"Put the note in the pocket with the card","note.b":"Unfold the cardboard and leave it against the wall","note.a.r":"The pocket holds three things now: a card with his name, a photograph, and a page with someone else's goodbye.","note.b.r":"He stands the cardboard back up, the way it was. If {N10} comes back, the place will still be there.","note.none":"Someone's cardboard is folded and gone.","note.go":"Walk on","n15.t":"The night of the fifteenth day. A half moon hangs between the buildings.","lunch4.t12":"On cold days {N01} adds another spoonful of rice without being asked.","lunch4.t13":"A notice about reissuing ID cards is pinned beside the counter.","lunch4.t14":"The side-dish tins are stacked by the door again. The van takes them in the afternoon.","lunch4.t15":"{N01} looks up from the ladle. “Today's the day, isn't it?”","letter.d12.a":"It was very cold today. I hope you slept somewhere warm.","letter.d12.b.bed":"Tonight I sleep in a bed that has a number.","letter.d12.b.cold":"Tonight is cold. I will wait for the morning all the same.","letter.d12.c":"Keep your hands in your pockets.","letter.d13.a":"The wind was a little gentler today.","letter.d13.b.jun":"Today I met a young man in the underpass.","letter.d13.b.quiet":"Today went by quietly.","letter.d13.c":"Tomorrow is a visiting day.","letter.d14.a":"The sun went down early today.","letter.d14.b.reply":"I got the swing drawing. I keep it folded in a safe place.","letter.d14.b.seen":"I looked at your notebook again today. Thank you.","letter.d14.b.miss":"I could not come today. I will wait for the next visiting day.","letter.d14.c":"I sleep well on the days I see you.","letter.d15.a":"Today was a busy day.","letter.d15.b.id":"Today I got a card with my name on it.","letter.d15.b.wait":"I am still waiting for some papers.","letter.d15.c":"I wrote my name very carefully.","p03.t":"A jogger stops to catch his breath. He frowns at the map on his phone. “Excuse me, which way is the river path?”","p03.a":"Show him the way","p03.b":"Say he doesn't know","p03.a.r":"{hero} points. “Past the fountain, then left.”","p03.ok":"The young man nods. “Thank you.” For the first time, there is a face above the running jacket.","p03.no":"The young man puts his earphones back in and runs on.","p03.b.r":"The young man asks someone else.","p04.t":"The rain comes down harder. An old woman with a cane steps in under the eaves, sees him, and stops.","p04.a":"Make room and stand together","p04.b":"Leave in the rain","p04.a.r":"{hero} moves to the outer edge. They stand side by side and listen to the rain.","p04.ok":"The woman shakes the rain off her sleeve. “Thank you.” For the first time, there is a face above the cane.","p04.no":"When the rain eases, the woman walks out without a word.","p04.b.r":"He walks in the rain to the next shelter of eaves.","p05.t":"Two students in school uniform go past and snigger. “Mister, do you live here?”","p05.a":"Take it as a joke","p05.b":"Pretend not to hear","p05.a.r":"“The rent is free. The wind's a bit strong, though.” One of them laughs, surprised.","p05.ok":"The other lowers his head. “Sorry.” The faces of the two of them come into view.","p05.no":"They hold back their laughter and hurry on.","p05.b.r":"The laughter grows smaller down the street.","h031.t":"The jogger waves. “Walk with me at dawn. Slowly. They say it's good for the knee.”","h031.a":"Say he will walk with him","h031.b":"Say another time","h031.a.r":"For the next three dawns they walk the river path slowly. His steps come a little easier.","h031.b.r":"The young man gives a thumbs-up and runs on.","h041.t":"The old woman with the cane takes a scarf from her bag. “I knitted it for my granddaughter. She doesn't like the colour.”","h041.a":"Take the scarf","h041.a.r":"He winds it round his neck. The back of his neck warms at once. The cold nights will bite a little less.","item.scarf":"knitted scarf","h051.t":"The two students come up holding a notebook. “It's for our social studies homework… could we interview you?”","h051.a":"Agree to the interview","h051.b":"Decline politely","h051.a.r":"They ask their questions in the order they wrote them. {hero} answers only what he knows. The last question is, “What do you need most?”","h051.b.r":"The students bow their heads. “Thank you anyway.”","alt.u4.L4":"The underpass under green fluorescent tubes. He sits by the wall.","alt.u4.L4.jun":"A young man in a hood sits on flattened cardboard with a page on his knee. A bus notice on the wall is wet at the edge.","alt.u4.L4.note":"Folded cardboard against the underpass wall, a stone on top, a torn page under the stone.","alt.u4.L4.empty":"Folded cardboard against the underpass wall. No one is there.","alt.u4.house.reply":"At the table the child holds up a drawing: a big blue swing in the middle of the page.","alt.u4.house.diary":"The child holds a notebook to his chest. The man's hand stops above the child's hair. The director waits by the open door.","alt.u4.counter.id":"Behind the glass, the clerk slides a pale card across the counter.","alt.u4.board.open":"Four boxes in a circle. Every arrow between them is broken open, and colour spreads from the stamp. In the middle, the ID card, close up.","alt.u4.park.p03":"A jogger stops on the park path, phone in hand.","alt.u4.L7.p03":"A jogger stops on the square, phone in hand.","alt.u4.park.p04":"Rain. An old woman with a cane and the man stand under the same eaves.","alt.u4.L7.p04":"Rain on the square. An old woman with a cane and the man stand under the same eaves.","alt.u4.park.p05":"Two students with school bags walk past the bench.","alt.u4.L7.p05":"Two students with school bags walk across the square."}}</script><!-- HS:MOD L-en-U4 END -->
<!-- HS:MOD L-ko-U4 START 70b8bf0049f1ed7a --><script type="application/json" data-hs-pack data-hs-lang="ko" data-hs-mod="L-ko-U4">{"id":"L-ko-U4","lang":"ko","unit":4,"strings":{"d12.slug":"12일 · 두 번째 한파","d13.slug":"13일 · 지하도","d14.slug":"14일 · 답장","d15.slug":"15일 · 이름이 적힌 카드","u4.rest":"몸을 추스르고 쉰다","d12.t":"열이틀째 새벽. 광장 전광판에 다시 한파 경보가 흐른다. 오늘 밤은 영하 14도.","d12.t9":"쉼터의 열이틀째 아침. 직원이 오늘 밤 한파 경보를 읽어 주고, 침대마다 담요를 한 장씩 더 꺼내 둔다.","d12.bed":"쉼터 명단에 그의 침대 번호가 있다. 오늘 밤 잘 곳이 정해져 있다.","d12.open":"지하도 옆 쉼터가 오늘 밤에도 문을 연다.","d12.none":"이번 겨울 두 번째 한파다. 오늘 밤 잘 곳을 저녁 전에 생각해 두어야 한다.","d12.a":"급식소 쪽으로 걷는다","d12.b":"지하도 쪽으로 걷는다","d12.a.r":"급식소 쪽으로 걷는다. 입김이 길게 남는다.","d12.b.r":"지하도 쪽으로 걷는다. 형광등이 낮에도 켜져 있다.","d12.c.r":"외투 깃을 세우고 조금 더 앉아 있는다.","h4.cold":"오늘 밤은 한파다. 바깥에서 자면 몸이 크게 상한다.","h4.cold.bed":"오늘 밤은 한파다. 쉼터에 그의 번호가 붙은 침대가 있다.","h4.cold.open":"오늘 밤은 한파다. 지하도 옆 쉼터가 사람을 받는다.","c1202.t":"순찰하던 경찰관이 다시 멈춘다. “오늘 밤도 영하예요. 쉼터 문이 열려 있어요. 같이 가 보시겠어요?”","c1202.a":"쉼터로 가겠다고 한다","c1202.b":"괜찮다고 한다","c1202.a.r":"경찰관이 고개를 끄덕이고 쉼터 쪽을 가리킨다.","c1202.a.far":"“문은 밤새 열려 있어요.” 경찰관이 쉼터로 가는 길을 짧게 알려 준다.","c1202.b.r":"경찰관이 전단 한 장을 그의 손에 쥐여 주고 간다.","n12.t":"열이틀째 밤. 이번 겨울 두 번째로 추운 밤이다.","n12.cold":"숨을 쉴 때마다 코끝이 얼얼하다.","u4.paper":"신문지를 몸에 두른다","u4.drum":"동료들과 드럼통 불을 피운다","u4.hotpack":"핫팩을 쓴다","u4.paper.r":"신문지를 겹겹이 두른다. 바스락거릴 때마다 바람이 조금 덜 들어온다.","u4.drum.r.N03":"{N03}가 드럼통에 마른 박스를 넣는다. 불빛이 두 사람의 손을 비춘다.","u4.drum.r.N10":"{N10}이 불 쪽으로 손을 내민다. “이쪽이 더 따뜻해요.”","u4.hotpack.r":"핫팩을 흔들자 손바닥이 천천히 데워진다.","item.hotpack":"핫팩","d13.t":"열사흘째 새벽. 바람이 조금 누그러져 있다.","d13.t9":"쉼터의 열사흘째 아침. 침대마다 담요가 개어진다.","d13.walt":"{N03}가 지나가며 말한다. “지하도에 새로 온 녀석이 있어. 아직 어려.”","d13.a":"급식소 쪽으로 걷는다","d13.b":"지하도로 가 본다","d13.a.r":"급식소 쪽으로 걷는다. 줄이 벌써 서기 시작한다.","d13.b.r":"지하도 계단을 내려간다. 먼 벽 쪽에 누군가 새 박스를 펴 두었다.","d13.c.r":"손이 덜 시릴 때까지 쉰다.","h4.jun":"{N03}가 말한 새로 온 청년은 지하도에 있다.","c1301.t":"지하도 벽 쪽에 처음 보는 청년이 박스를 펴고 앉아 있다. 무릎 위에 종이 한 장. 그가 먼저 고개를 든다. “여기… 자리 있어요?”","c1301.a":"옆에 앉는다","c1301.b":"먹을 것을 나눈다","c1301.c":"고개만 끄덕인다","c1301.a.r":"{hero}는 한 사람 자리를 두고 앉는다. 청년이 자기 이름을 말한다. “{N10}이에요.”","c1301.b.r":"{hero}가 가진 것을 반으로 나눈다. 청년은 잠시 망설이다 반을 받는다. “고마워요. 저는… {N10}이에요.”","c1301.c.r":"{hero}는 고개를 끄덕이고 자기 자리로 간다. 청년은 다시 종이를 본다.","s05.1.t":"{N10}은 종이에 주소 세 개를 옮겨 적었다. “이 두 곳은 가는 길을 알아요.” 세 번째에는 표시가 없다. 곁의 버스 안내문 가장자리가 젖어 있다.","s05.1.a":"함께 길을 확인한다","s05.1.b":"먼저 갈 곳을 묻는다","s05.1.a.r":"두 사람이 종이 위의 길을 손가락으로 따라간다. {N10}이 두 번째 주소에 동그라미를 친다. “여기요. 질문은 제가 해 보고 싶어요.” {N10}이 길을 표시하는 동안 {hero}는 마른 가장자리를 잡아 준다.","s05.1.b.r":"{N10}이 종이를 짚는다. “여기요. 질문은 제가 해 보고 싶어요.” {N10}이 길을 표시하는 동안 {hero}는 마른 가장자리를 잡아 준다.","s05.2.t":"“건널목까지만 같이 가 주실래요? 그다음에는 혼자 들어가고 싶어요.” {N10}이 묻는다. 그는 안내문의 시간을 확인하고 접는다.","s05.2.a":"함께 걷는다","s05.2.b":"다시 만날 때를 알려 준다","s05.2.a.r":"건널목에서 {N10}은 종이를 돌려받는다. “여기부터는 찾을 수 있어요.” {hero}는 신호가 바뀌기를 기다린다. {N10}은 자기 손에 종이를 들고 건넌다.","s05.2.b.r":"{N10}은 주소 옆에 만날 시간을 적는다. “어땠는지 알려 드릴게요.” 함께 확인한 길은 지우지 않는다.","n13.t":"열사흘째 밤. 지하도 쪽에서 낮은 말소리가 들린다.","d14.t":"열나흘째 아침. 오늘 오후는 면회일이다.","d14.t9":"쉼터의 열나흘째 아침. 오늘 오후는 면회일이다.","d14.a":"급식소로 간다","d14.b":"햇살의 집 쪽으로 걷는다","d14.a.r":"급식소 쪽으로 걷는다. 오늘은 점심 뒤에 면회가 있다.","d14.b.r":"햇살의 집 쪽 길로 든다. 오후는 아직 멀다.","d14.c.r":"수첩에서 면회 날짜를 다시 읽는다.","m06.a":"“편지 읽었어요.” {son}이 종이를 편다. 가운데에 파란 그네가 크게 그려져 있다. “기다리면서 그렸어요.” 아이가 두 손으로 종이를 편다.","m06.b":"{son}이 공책 속 종이를 보여 준다. “이게 그네예요.” 면회가 끝나자 아이는 공책을 덮는다. {hero}는 자기 가방 안에 접힌 종이를 본다.","m06.b0":"{son}이 공책 속 종이를 보여 준다. “이게 그네예요.” {hero}는 공책이 닫히는 것을 본다. 문 앞에서 다음 면회 날짜를 확인한다. {son}은 벌써 노란 연필을 찾고 있다.","m06.ask":"무슨 이야기를 써 줄까 묻는다","m06.look":"그림을 함께 본다","m06.a.r":"“무슨 이야기를 써 줄까?” {hero}가 묻는다. “아저씨가 본 거요.” {son}이 답한다. “큰일이 아니어도 돼요.”","m06.b.r":"{son}이 종이 한쪽 끝을 {hero} 쪽으로 밀어 준다. 둘은 한동안 말없이 본다. 그러다 {son}은 자기 그림으로 돌아간다.","m06.reply":"{son}이 그림을 한 번 접어 내민다. “가져가요. 또 그릴 수 있어요.”","item.reply":"답장 그림","u4.reply":"답장 그림을 꺼내 본다","u4.reply.r":"종이를 펴자 파란 그네가 보인다. 접힌 자리를 손으로 편다.","diary.t":"면회가 끝나 갈 무렵, {son}이 작은 공책 하나를 내민다. 표지에 이름이 삐뚤게 적혀 있다. “제 일기장이에요. 아저씨가 가져요.”","diary.r":"{hero}는 일기장을 가방 안쪽 주머니, 사진 옆에 넣는다.","item.diary":"아들의 일기장","m16.t":"{son}이 공책을 가슴에 안는다. “아저씨는 우리 아빠 같아요.” {hero}의 손이 아이 머리 위에서 멈춘다. 원장은 열린 문 옆에서 기다린다.","m16.a":"아빠라고 말한다","m16.b":"조금 더 기다린다","m16.a.r":"“내가 네 아빠야.” {son}은 {hero}를 보고 원장을 본다. 원장이 고개를 끄덕인다. 아이가 공책을 탁자에 놓는다. “여기 앉아 주실래요?” 옆 의자를 가리킨다.","m16.a2":"{hero}가 앉는다. {son}이 페이지를 펴고 연필을 {hero} 쪽으로 옮긴다. “여기에 그릴까요?” 두 사람은 선을 긋기 전에 종이를 본다.","m16.after":"{son}이 방으로 돌아간 뒤 원장이 묻는다. “확실하게 말해 주실 수 있는 건 무엇인가요?” {hero}는 다음 면회 날짜를 본다. “다시 오고 싶다는 거요. 다른 건 먼저 확인하겠습니다.”","m16.b.r":"“오늘은 조금 더 같이 있고 싶어.” {son}은 의자를 {hero} 쪽으로 옮긴다. “그럼 뭘 그릴지 같이 골라 주세요.” 아이가 페이지를 편다.","n14.t":"열나흘째 밤. 햇살의 집 쪽 창들이 하나씩 꺼진다.","d15.t":"보름째 아침. 접수증에 적힌 날짜가 오늘이다.","d15.t9":"쉼터의 보름째 아침. 접수증에 적힌 날짜가 오늘이다.","d15.receipt":"접수증은 사진 옆 주머니에 있다. 창구는 오전부터 연다.","d15.a":"창구로 간다","d15.b":"급식소에 먼저 간다","d15.a.r":"병원 건물 쪽으로 걷는다. 가는 길에 접수증을 한 번 확인한다.","d15.b.r":"급식소 쪽으로 걷는다. 창구는 점심 뒤에 가도 된다.","d15.c.r":"주머니 위에 손을 얹고 잠시 쉰다.","d15.t0":"보름째 아침. 서류판의 원은 아직 닫혀 있다.","d15.t09":"쉼터의 보름째 아침. 서류판의 원은 아직 닫혀 있다.","d15.circle":"급식소의 {N01}이 무언가를 준비해 두었다는 말이 들린다.","d15.a0":"급식소로 간다","d15.b0":"창구로 간다","d15.a0.r":"급식소 쪽으로 걷는다.","d15.b0.r":"병원 건물 쪽으로 걷는다.","d15.c0.r":"하루가 시작되기 전에 잠시 쉰다.","h4.counter":"신분증은 병원 건물 1층 창구에서 받는다. 창구는 저녁 무렵까지 연다.","h4.park":"급식소의 {N01}이 남은 절차를 알고 있다.","m07.rescue":"{N01}이 확인서를 가져온다. “남은 절차가 이거예요. 창구에 내세요.” {hero}는 운영 시간을 확인하고 확인서를 다른 서류와 함께 넣는다.","m07.rescue.a":"확인서를 받는다","m07.rescue.r":"{N01}이 앞치마를 푼다. “창구까지 같이 가요. 제 이름이 들어가야 하니까요.”","id.b1":"직원이 카드를 창구 너머로 밀어 준다. 그의 이름이 다른 사람들의 이름과 같은 글자로 찍혀 있다.","id.b1.late":"{N01}이 확인서 끝에 자기 이름을 적고, 서류와 함께 창구로 밀어 준다. 직원이 카드를 창구 너머로 밀어 준다. 그의 이름이 다른 사람들의 이름과 같은 글자로 찍혀 있다.","id.take":"카드를 받는다","id.b5":"그는 두 번 읽는다. 그리고 사진이 든 주머니에 넣는다.","id.photo":"작은 네모 안에서, 오래 보지 못한 얼굴이 그를 마주 본다.","id.photoA":"그는 사진을 오래 본다.","n15.next":"내일은 처음으로 일을 고를 수 있다.","id.open":"서류판의 원이 열렸다.","id.name":"마지막으로 이 이름을 들은 건 국과 함께였다.","item.idcard":"신분증","note.t":"{hero}는 신분증을 사진 옆 주머니에 넣은 채 지하도를 지난다. {N10}의 박스가 벽에 기대어 납작하게 접혀 있다. 그 위에 돌 하나. 돌 밑에 공책에서 찢은 종이 한 장.","note.text":"아저씨, 이제 이름 있네요. 잘됐어요. 저는… 다른 데 가 볼게요. — {N10}","note.a":"쪽지를 신분증과 같은 주머니에 넣는다","note.b":"박스를 다시 펴서 벽에 세워 둔다","note.a.r":"이제 주머니에는 세 가지가 있다. 그의 이름이 찍힌 카드, 사진 한 장, 그리고 다른 사람의 작별 인사.","note.b.r":"그는 박스를 원래대로 세워 둔다. {N10}이 돌아온다면, 자리는 그대로 있을 것이다.","note.none":"누군가의 박스가 접힌 채 비어 있다.","note.go":"지나간다","n15.t":"보름째 밤. 반달이 건물 사이에 걸려 있다.","lunch4.t12":"한파의 날, {N01}은 말하지 않아도 밥을 한 주걱 더 얹어 준다.","lunch4.t13":"배식대 옆에 신분증 재발급 안내가 붙어 있다.","lunch4.t14":"오늘도 반찬 통이 문 옆에 쌓인다. 승합차가 오후에 실어 간다.","lunch4.t15":"{N01}이 국자를 든 채 고개를 든다. “오늘이죠?”","letter.d12.a":"오늘은 아주 추웠어. 너는 따뜻하게 잤으면 해.","letter.d12.b.bed":"오늘 밤은 번호가 있는 침대에서 자.","letter.d12.b.cold":"오늘 밤은 추워. 그래도 내일 아침을 기다릴게.","letter.d12.c":"추운 날엔 손을 주머니에 넣어.","letter.d13.a":"오늘은 바람이 조금 순했어.","letter.d13.b.jun":"오늘 지하도에서 젊은 친구를 만났어.","letter.d13.b.quiet":"오늘은 조용히 지나갔어.","letter.d13.c":"다음 면회는 내일이야.","letter.d14.a":"오늘은 해가 일찍 졌어.","letter.d14.b.reply":"그네 그림 잘 받았어. 접어서 잘 넣어 뒀어.","letter.d14.b.seen":"오늘 네 공책을 또 봤어. 고마워.","letter.d14.b.miss":"오늘은 가지 못했어. 다음 면회 날까지 기다릴게.","letter.d14.c":"보고 온 날은 잠이 잘 와.","letter.d15.a":"오늘은 바쁜 하루였어.","letter.d15.b.id":"오늘 내 이름이 적힌 카드를 받았어.","letter.d15.b.wait":"아직 서류를 기다리는 중이야.","letter.d15.c":"이름을 또박또박 써 봤어.","p03.t":"조깅하던 청년이 숨을 고르며 멈춘다. 휴대전화 지도를 들여다보다 고개를 갸웃한다. “혹시 강변 길이 어느 쪽이에요?”","p03.a":"길을 알려 준다","p03.b":"모른다고 한다","p03.a.r":"{hero}가 손으로 방향을 가리킨다. “분수대를 지나서 왼쪽이에요.”","p03.ok":"청년이 고개를 끄덕인다. “감사합니다.” 운동복 위로 처음으로 얼굴이 보인다.","p03.no":"청년은 이어폰을 다시 꽂고 달려간다.","p03.b.r":"청년은 다른 사람에게 다시 묻는다.","p04.t":"빗줄기가 굵어진다. 지팡이를 짚은 할머니가 처마 밑으로 들어오다 그를 보고 멈칫한다.","p04.a":"자리를 내주고 함께 선다","p04.b":"비를 맞으며 자리를 뜬다","p04.a.r":"{hero}는 처마 바깥쪽으로 비켜 선다. 둘은 나란히 서서 빗소리를 듣는다.","p04.ok":"할머니가 젖은 소매를 털며 말한다. “고마워요.” 지팡이 위로 처음으로 얼굴이 보인다.","p04.no":"비가 잦아들자 할머니는 말없이 걸어 나간다.","p04.b.r":"그는 비를 맞으며 다음 처마까지 걷는다.","p05.t":"교복을 입은 학생 둘이 지나가다 킥킥거린다. “아저씨, 여기서 살아요?”","p05.a":"농담으로 받는다","p05.b":"못 들은 척한다","p05.a.r":"“집세는 공짜인데, 바람이 좀 세.” 학생 하나가 뜻밖이라는 듯 웃는다.","p05.ok":"다른 학생이 머쓱하게 고개를 숙인다. “죄송해요.” 두 사람의 얼굴이 보인다.","p05.no":"학생들은 웃음을 참으며 서둘러 지나간다.","p05.b.r":"웃음소리가 길 끝으로 멀어진다.","h031.t":"조깅하던 청년이 손을 흔든다. “새벽에 같이 걸어요. 천천히요. 무릎에 좋대요.”","h031.a":"같이 걷겠다고 한다","h031.b":"다음에 하자고 한다","h031.a.r":"그날부터 사흘, 둘은 새벽 강변을 천천히 걷는다. 걸음이 조금 가벼워진다.","h031.b.r":"청년이 엄지를 들어 보이고 달려간다.","h041.t":"지팡이 할머니가 가방에서 목도리 하나를 꺼낸다. “손녀 주려고 떴는데, 색이 마음에 안 든대요.”","h041.a":"목도리를 받는다","h041.a.r":"목도리를 두르자 목덜미가 금세 따뜻해진다. 추운 밤이 조금 덜 매서울 것이다.","item.scarf":"뜨개 목도리","h051.t":"학생 둘이 공책을 들고 다가온다. “사회 숙제인데요… 인터뷰해 주실 수 있어요?”","h051.a":"인터뷰에 응한다","h051.b":"정중히 사양한다","h051.a.r":"학생들이 적어 온 순서대로 묻는다. {hero}는 아는 만큼만 대답한다. 마지막 질문은 “제일 필요한 게 뭐예요?”다.","h051.b.r":"학생들이 고개를 숙인다. “그래도 고맙습니다.”","alt.u4.L4":"초록 형광등 아래 지하도. 그는 벽 쪽에 앉아 있다.","alt.u4.L4.jun":"모자 달린 옷의 청년이 펼친 박스 위에 앉아 무릎에 종이를 올려 두었다. 벽의 버스 안내문 가장자리가 젖어 있다.","alt.u4.L4.note":"지하도 벽에 기댄 접힌 박스, 그 위의 돌 하나, 돌 밑의 찢은 종이.","alt.u4.L4.empty":"지하도 벽에 기댄 접힌 박스. 아무도 없다.","alt.u4.house.reply":"탁자에서 아이가 그림을 들어 보인다. 종이 한가운데 커다란 파란 그네.","alt.u4.house.diary":"아이가 공책을 가슴에 안고 있다. 남자의 손이 아이 머리 위에서 멈춘다. 원장이 열린 문 옆에서 기다린다.","alt.u4.counter.id":"유리 너머 직원이 연한 빛깔의 카드를 창구 너머로 밀어 준다.","alt.u4.board.open":"원을 이룬 네 칸. 칸 사이의 화살표가 모두 끊겨 열려 있고, 도장 자리에서 색이 번진다. 가운데에 신분증이 크게 놓여 있다.","alt.u4.park.p03":"공원 길에 조깅하던 청년이 휴대전화를 들고 멈춰 서 있다.","alt.u4.L7.p03":"광장에 조깅하던 청년이 휴대전화를 들고 멈춰 서 있다.","alt.u4.park.p04":"비. 지팡이를 짚은 할머니와 남자가 같은 처마 밑에 서 있다.","alt.u4.L7.p04":"광장의 비. 지팡이를 짚은 할머니와 남자가 같은 처마 밑에 서 있다.","alt.u4.park.p05":"책가방을 멘 학생 둘이 벤치 앞을 지나간다.","alt.u4.L7.p05":"책가방을 멘 학생 둘이 광장을 가로지른다."}}</script><!-- HS:MOD L-ko-U4 END -->

<!-- HS:MOD L-en-U5 START 46d3c15162760075 --><script type="application/json" data-hs-pack data-hs-lang="en" data-hs-mod="L-en-U5">{"id":"L-en-U5","lang":"en","unit":5,"strings":{"a3.slug":"Act 3 · Hands","a3.h":"Act Three — Hands","a3.faces":"By the end of act two, the faces of {n} people have come back.","a3.faces0":"By the end of act two, no face has come back yet.","a3.son.rev":"With the boy: the day the word was said.","a3.son.reply":"With the boy: a blue swing on a folded page.","a3.son.seen":"With the boy: the notebook he keeps bringing.","a3.son.miss":"With the boy: the next visiting day, written down.","a3.mem.note":"What stayed longest: a note kept beside the ID card.","a3.mem.space":"What stayed longest: a piece of cardboard set upright against the wall.","a3.mem.park":"What stayed longest: a name signed at the bottom of a letter for him.","a3.mem.diary":"What stayed longest: a diary put beside the photograph.","a3.mem.bed":"What stayed longest: a bed number on the shelter list.","a3.mem.days":"What stayed longest: eight days of papers and waiting.","a3.new":"Now he can choose work.","a3.pol.welfare":"The board on the square: “No one left behind.” The meal centre adds a supper. Scrap pays less.","a3.pol.economy":"The board on the square: “Work is the best welfare.” Scrap pays more, and so does work this act. The meal centre closes two days a week.","a3.pol.steady":"The board on the square: “Keeping an ordinary day.” Everything stays as it was.","a3.go":"Begin the sixteenth day","d16.slug":"Day 16 · Choosing work","d17.slug":"Day 17 · The visit","d18.slug":"Day 18 · The first work","d19.slug":"Day 19 · The cold, once more","d16.t":"The sixteenth dawn. The ID card is in the pocket beside the photograph. The day ahead has no papers in it.","d16.t9":"The sixteenth morning at the shelter. On the desk by the door, the staff have set out the job notices.","d16.rest":"Rest and gather himself","d16.counsel":"See the job counsellor first","d16.terminal":"Look for {N10} at the bus terminal","d16.rest.r":"He sits until his hands are warm. The notices can wait until the morning.","d16.counsel.r":"The counsellor spreads three notices on the desk. “Read them first. You don't have to decide in a hurry.”","d16.terminal.r":"{N10} is sitting on a bench by the ticket window. “I can't buy a ticket. It's just warm in here.” {hero} sits beside him. {N10} speaks first. “If you find work… ask about me too.”","d17.t":"The seventeenth dawn. Today is a visiting day, from the afternoon to the evening.","d17.t9":"The seventeenth morning at the shelter. Today is a visiting day.","d17.plan":"The van leaves from the meal centre in the afternoon and the evening.","d17.plan.w":"The work is in the afternoon. The visit lasts until the evening. Both may fit, or one may have to wait.","d17.a":"Walk toward the meal centre","d17.b":"Walk toward Sunshine House","d17.a.r":"He walks toward the meal centre. The van will leave from there.","d17.b.r":"He takes the road toward Sunshine House. The afternoon is still far off.","d17.c.r":"He reads the visit date in his notebook once more.","d18.t":"The eighteenth dawn.","d18.t9":"The eighteenth morning at the shelter.","d18.none":"The notices are still in his bag. Nobody is waiting for an answer today.","d18.how.art":"The portrait stall on the square opens after lunch. He will need a clean sheet for each face. The meal centre is two streets away.","d18.how.warehouse":"The loading dock behind the convenience store starts in the afternoon. He will check the labels from a seat. The work burns the body's fuel, and the meal centre is far; the store sells bread in the evening.","d18.how.kitchen":"The kitchen work starts after the lunch line. If he has not eaten, there will be a work meal at the end.","d18.used.art":"He knows now which chair takes the afternoon light.","d18.used.warehouse":"He remembers where the unchecked list was left.","d18.used.kitchen":"He remembers which shelf the trays go on.","d18.a":"Walk toward the meal centre","d18.a.art":"Walk toward the square","d18.a.warehouse":"Walk toward the convenience store","d18.a.kitchen":"Walk toward the meal centre","d18.b":"Go to the meal centre first","d18.a.r":"He walks toward the place of the afternoon.","d18.b.r":"He walks toward the meal centre. Lunch first.","d18.c.r":"He stretches the stiff leg and waits for the light.","d19.t":"The nineteenth dawn. The board on the square runs the cold-weather warning once more.","d19.t9":"The nineteenth morning at the shelter. The staff read the warning aloud and count the blankets.","d19.bed":"His bed number is on the list tonight.","d19.plan":"Before the evening, he will need a place for the night.","d19.a.r":"He walks toward the place of the afternoon. His breath stays in the air.","d19.b.r":"He walks toward the meal centre. The queue is already long.","d19.c.r":"He turns his collar up and stays a little longer.","m08.t":"{hero} reads three notices. One asks for a drawing, one for careful sorting, and one for help in the kitchen. He checks the hours before reading the pay again.","m08.a":"Choose drawing work","m08.b":"Choose warehouse work","m08.c":"Choose kitchen work","m08.later":"Keep the notices for now","m08.sub.art":"The square · afternoon · one sheet a face · hunger −2","m08.sub.wh":"Behind the convenience store · afternoon · hunger −8","m08.sub.kit":"The meal centre · afternoon · hunger −4 · a work meal if he missed lunch","m08.terms":"Pay a day: drawing {art0}~{art1}, by how the drawing goes · warehouse {wh} · kitchen {kit}. The work is in the afternoon. On a visiting day he may skip work; then there is no pay.","m08.b.no":"He reads the lifting and movement requirements. This notice does not offer the seated work he needs. He keeps the other two notices beside it.","m08.c.no":"The kitchen notice asks for someone who has eaten at the centre five times or more. He counts the days on his fingers and folds this notice away for later.","m08.a.r":"He counts the clean sheets in his bag. On the notice, a chair faces another chair. He writes down where he can get more paper.","m08.b.r":"He checks the loading time. The small print lists the work he can do from a seat. He keeps the notice open until he has read that line twice.","m08.c.r":"He knows the kitchen door and the order of the tables. The notice asks him to arrive before the afternoon work begins. He writes the time beside the visit dates.","m08.later.r":"He folds the three notices together and puts them in his bag.","u5.notices":"Take out the job notices","h5.notice":"The three job notices are in his bag. He can choose until day 21.","h5.work.art":"Drawing work: the portrait stall on the square, in the afternoon. The square is two streets from the meal centre: after the lunch line he cannot be there in time. Food has to come from somewhere else today.","h5.work.warehouse":"Warehouse work: behind the convenience store, in the afternoon. It is far from the meal centre: after the lunch line he cannot be there in time. The store sells bread in the evening.","h5.work.kitchen":"Kitchen work: at the meal centre, in the afternoon, after the lunch line.","h5.paper":"No clean paper left. The shop on the square sells three sheets for 1.","h5.away":"The afternoon work is somewhere else. Today it will have to wait.","h5.19":"Without work today, the day is the day: a meal, a warm place, and the night.","u5.work.art":"Open the portrait stall","u5.work.warehouse":"Check the labels at the dock","u5.work.kitchen":"Help in the kitchen","u5.work.sub.art":"One sheet of paper · hunger −2","u5.work.sub.warehouse":"Hunger −8","u5.work.sub.kitchen":"Hunger −4 · a work meal if he missed lunch","u5.workG.art":"Draw against the clock (a challenge)","u5.workG.warehouse":"Sort against the clock (a challenge)","u5.workG.kitchen":"Serve against the clock (a challenge)","u5.game.full":"The challenge went well.","u5.game.small":"Most of it went well.","u5.game.none":"The challenge ends where it ends. The work is done all the same.","u5.paper":"Buy three sheets of paper (1)","u5.paper.r":"The shopkeeper slides three sheets into a thin paper bag.","u5.sweep":"Sweep the square with the cleaner","u5.sweep.r":"They sweep from the fountain to the steps. The cleaner hands him the pay before the shops open.","u5.meal":"At the end, a bowl is set aside for him: the work meal.","w.pay1":"The first pay of this work: {n}. He counts it once and puts it away.","m09.a.1":"The customer sits still until {hero} lowers the pencil. “My ears really are that large,” he says. He takes the page carefully and leaves the agreed payment on the table.","m09.a.2":"{hero} clears the small scraps before counting the money. The customer keeps the finished page. Before another customer sits, he checks what paper remains.","m09.a.3":"The chair has a folded cloth on it now. {hero} places the paper before the customer sits. This time, he knows where the light will fall across the face.","m09.a.five":"Other people's faces, he can draw five a day.","m09.b.1":"The supervisor puts the last box beside {hero}'s list. “This label was facing the wrong way. You caught it.” She signs the work record before handing over the pay.","m09.b.2":"{hero} checks that the date is correct. He puts the work record beside his identity card. The empty boxes stay stacked in the order he gave them.","m09.b.3":"The next worker follows the marks on the list. “Leave this here for tomorrow,” she says. {hero} sets the pencil beside the first unchecked line.","m09.c.1":"The last bowl goes across the counter. {N01} turns the work sheet toward {hero}. “Your name goes here.” The space is beside the other workers' names.","m09.c.2":"He writes his name and puts the pen back. {N01} moves the clean bowls to the next shelf. {hero} carries the empty tray to the washing area.","m09.c.3":"“I will handle the hot pot,” {N01} says. “You can start with the trays.” {hero} puts the trays in order. They no longer need to point to every shelf.","oil.cook":"The cook wipes the pan and pours what is left of the oil into a small cup. “Take it, if you need it.”","oil.kitchen":"Wiping the last pan, {N01} pours the leftover oil into a small cup and sets it by his bag.","oil.warehouse":"A small can of lubricant is left over from the shelf rails. The supervisor puts it on his list. “You might find a use for it.”","item.oil":"A little oil","lunch5.t16":"{N01} slides the tray across. “I heard the notices came out today.”","lunch5.t17":"The van's keys hang on the hook by the kitchen door. It will leave in the afternoon.","lunch5.t18":"The line moves slowly. Someone behind him talks about the cold coming back.","lunch5.t19":"The soup is hotter than usual today. Nobody says why.","m10.t":"“What did you do today?” {son} asks. He pushes the second chair out with his foot. {hero} checks the edge of his bag before sitting down.","m10.talk":"Tell him what he did today","m10.talk3":"Listen to what he wants to say","m10.draw":"Draw in the empty space.","m10.drawWith":"Draw in the notebook together.","m10.draw.dim":"His hand shakes. The line won't go that far today.","m10.swing":"Check the swing chain.","m10.A":"“I drew someone's face.” {son} touches his own ears. “Were these the hard part?” {hero} smiles. “Today, yes.” The child turns his head to give him a better view.","m10.B":"“I checked boxes and their labels.” {son} puts three pencils in a row. “This one keeps rolling away.” {hero} places it across the other two. It stays still.","m10.C":"“I helped serve lunch.” {son} lifts an empty cup. “I can carry two.” He tries, then puts one down. “One is easier.” {hero} takes the other cup.","m10.D":"“I am getting ready to start.” {son} moves the pencils aside. “Can you look at this first?” He opens the notebook to a drawing he wants to show.","m10.E":"“I started work this week. Today I came here first.” {son} nods and pulls the notebook closer. “Then look at this.”","draw.end":"{son} doesn't ask anything.","draw.dir":"In the hallway, the director says only, “Then let's do this properly, together.”","draw.f5":"The boy looks at the drawing for a long time. He picks up the pencil, then puts it down without writing anything.","draw.f7":"The boy folds down a small corner of the page.","draw.part":"“You can finish it next time,” {son} says.","draw.none":"The pencil rests on the page. {son} leaves the notebook open between them.","u5.dad.hand":"DAD","swing.r":"While {son} goes to wash his hands with the director, {hero} oils the links of the chain. He pushes the swing once. It moves without a sound.","m11.t.warehouse":"“Do you stay near the park?” a worker asks. The question reaches {hero} across the table. The day's unfinished work is still between them.","m11.t.art":"“Do you stay near the park?” the customer asks across the board. Half of the face on the page is still empty.","m11.t.kitchen":"“Do you stay near the park?” asks the worker drying bowls beside him. Trays are still waiting on the counter.","m11.a":"Answer briefly","m11.b":"Say you would rather work","m11.a.warehouse":"“For now.” {hero} returns to the next task. The worker moves a box out of his path. Neither of them asks the other to explain everything.","m11.b.warehouse":"“I would like to finish this first.” The worker nods and picks up the list. “Then this row is next.” {hero} checks the first mark.","m11.a.art":"“For now,” {hero} says. The customer looks at the paper. “May I turn this way?” {hero} adjusts the board. They return to the face he is drawing.","m11.b.art":"“I would like to finish the drawing first.” The customer stays still. {hero} puts the next line where the cheek meets the ear.","m11.a.kitchen":"“For now.” {hero} sets the clean tray down. {N01} moves the wet cloth away from the work sheet. “These bowls go on the next shelf.”","m11.b.kitchen":"“I would like to finish this first.” {N01} nods. {hero} carries the tray to the shelf. The next person waits until the path is clear.","m11.x":"A laugh comes from the doorway. {hero} sets his tool down for a moment. The supervisor closes the door. “The work is here,” she says, pointing to the table.","letter.d16.a":"The cold is easing a little.","letter.d16.b.job":"Today I read three notices and chose one.","letter.d16.b.wait":"Today I read three notices. I am still thinking.","letter.d16.c":"Tomorrow I will get up a little earlier.","letter.d17.a":"Another day has gone by.","letter.d17.b.drew":"Today a face went into an empty place.","letter.d17.b.seen":"Today you showed me your notebook again.","letter.d17.b.miss":"Today I could not come. The next date is the twenty-first.","letter.d17.c":"Next time, tell me about the swing.","letter.d18.a":"The sun went down early today.","letter.d18.b.work":"Today I worked, and someone wrote my name on a sheet.","letter.d18.b.wait":"Today I did not work. I got ready for it.","letter.d18.c":"I am thinking again about the work my hands can do.","letter.d19.a":"It is cold again. Wear your scarf.","letter.d19.b.work":"Even in the cold, I went to work today.","letter.d19.b.cold":"Today I looked for a warm place first.","letter.d19.c":"On cold days I remember your voice for longer.","n16.t":"The night of the sixteenth day. The notices crackle when he turns over.","n17.t":"The night of the seventeenth day. The visit stays with him a little longer.","n18.t":"The night of the eighteenth day. His hands remember the afternoon.","n19.t":"The night of the nineteenth day.","n19.cold":"The wind comes down the street without stopping. Tonight is the third cold wave of the winter.","p07.t":"The cleaner is sweeping the square. A gust scatters the pile she has just made across the stones.","p07.a":"Pick up the scattered rubbish","p07.b":"Step around it","p07.a.r":"{hero} picks up the papers nearest his feet and drops them in her bin.","p07.ok":"She straightens and nods. “Thanks. The wind doesn't help.” Above the work gloves, her face can be seen for the first time.","p07.no":"She is already sweeping the next corner.","p07.b.r":"The broom goes on behind him.","p09.t":"A delivery motorbike has tipped over at the edge of the square. The rider is trying to lift it alone.","p09.a":"Help lift the bike","p09.b":"Keep walking","p09.a.r":"{hero} takes the back of the seat. On three, they lift it together.","p09.ok":"The rider pulls off a glove. “You saved me a fine.” Under the helmet, his face can be seen for the first time.","p09.no":"The rider nods quickly and rides off.","p09.b.r":"Behind him, an engine starts after a while.","h011.t":"The office worker stops with his coffee. “You're looking for work? I write these all day. Shall we do your page together?”","h011.a":"Write it together","h011.b":"Thank him and decline","h011.a.r":"They write on the back of a receipt. Under “experience,” {hero} writes two lines and stops at the third.","h011.b.r":"The office worker nods and hurries on.","h091.t":"The rider leans on his bike. “The depot behind the shop needs someone for checking. You can do it sitting. I'll tell them.”","h091.a":"Ask him to tell them","h091.b":"Say he will think about it","h091.a.r":"The rider writes a name on the back of a delivery slip and hands it over.","h091.b.r":"“The offer stays,” the rider says, and starts the engine.","h071.t":"The cleaner leans her broom against the bench. “I start before the shops open. If you come at dawn, there's pay for two hands.”","h071.a":"Say he will come at dawn","h071.b":"Thank her and decline","h071.a.r":"She shows him where the second broom is kept.","h071.b.r":"She picks up her broom again.","alt.u5.act":"A band of eight colours, from the eighth dawn to the fifteenth. A man sits on a low wall, looking at the last square.","alt.u5.notice":"Three notices on a desk: two chairs facing each other, a stack of labelled boxes, a row of bowls.","alt.u5.terminal":"A bus terminal before dawn. By the ticket window, a young man in a hood sits on a bench. The man sits down beside him.","alt.u5.L7.stall":"The square in the afternoon. Two folding chairs face each other at a small board. A customer sits still while the man draws.","alt.u5.L8.dock":"The loading dock behind the convenience store. The man sits at a table with a list; boxes are stacked in order beside him.","alt.u5.L2.work":"The kitchen of the meal centre after lunch. Trays in a row on the counter; the man carries one toward the shelf.","alt.u5.notebook":"The child's notebook open on the table. On the left, a woman's face drawn by a child. On the right, a man's face in pencil.","alt.u5.swing":"The yard of Sunshine House. One swing is moving; the man's hand has just left the chain.","alt.u5.park.p07":"In the park, a cleaner sweeps leaves into a pile.","alt.u5.L7.p07":"On the square, a cleaner's pile of rubbish is scattered by the wind.","alt.u5.L7.p09":"At the edge of the square, a delivery motorbike lies on its side.","alt.u5.park.p09":"On the park road, a delivery motorbike lies on its side."}}</script><!-- HS:MOD L-en-U5 END -->
<!-- HS:MOD L-ko-U5 START 8105657ad2e0f5c5 --><script type="application/json" data-hs-pack data-hs-lang="ko" data-hs-mod="L-ko-U5">{"id":"L-ko-U5","lang":"ko","unit":5,"strings":{"a3.slug":"3막 · 손","a3.h":"3막 — 손","a3.faces":"2막이 끝날 때까지 얼굴을 되찾은 사람: {n}명.","a3.faces0":"2막이 끝날 때까지 얼굴을 되찾은 사람은 아직 없다.","a3.son.rev":"아이와: 그 말을 한 날.","a3.son.reply":"아이와: 접힌 종이 위의 파란 그네.","a3.son.seen":"아이와: 아이가 계속 가져오는 공책.","a3.son.miss":"아이와: 적어 둔 다음 면회 날짜.","a3.mem.note":"가장 오래 남은 순간: 신분증 옆에 넣어 둔 쪽지.","a3.mem.space":"가장 오래 남은 순간: 벽에 다시 세워 둔 박스.","a3.mem.park":"가장 오래 남은 순간: 그를 위해 확인서 끝에 적힌 이름.","a3.mem.diary":"가장 오래 남은 순간: 사진 옆에 넣은 일기장.","a3.mem.bed":"가장 오래 남은 순간: 쉼터 명단 위의 침대 번호.","a3.mem.days":"가장 오래 남은 순간: 서류와 기다림의 여덟 날.","a3.new":"이제 일을 고를 수 있다.","a3.pol.welfare":"광장 전광판: “누구도 뒤에 남기지 않겠습니다.” 급식소에 저녁 배식이 늘고, 고물 값은 내려간다.","a3.pol.economy":"광장 전광판: “일자리가 최고의 복지입니다.” 고물 값과 이번 막의 급여가 오르고, 급식소는 일주일에 이틀 쉰다.","a3.pol.steady":"광장 전광판: “평범한 하루를 지키겠습니다.” 모든 것이 그대로다.","a3.go":"열엿새째 날을 시작한다","d16.slug":"16일 · 일을 고르는 날","d17.slug":"17일 · 면회","d18.slug":"18일 · 첫 근무","d19.slug":"19일 · 다시 추위","d16.t":"열엿새째 새벽. 신분증은 사진 옆 주머니에 있다. 오늘 하루에는 서류가 없다.","d16.t9":"쉼터의 열엿새째 아침. 문 옆 책상에 직원이 일자리 안내문을 꺼내 두었다.","d16.rest":"몸을 추스르고 쉰다","d16.counsel":"일자리 상담을 먼저 받는다","d16.terminal":"터미널에 준을 찾으러 간다","d16.rest.r":"손이 따뜻해질 때까지 앉아 있는다. 안내문은 오전까지 기다릴 수 있다.","d16.counsel.r":"상담원이 안내문 세 장을 책상에 펼친다. “먼저 읽어 보세요. 서둘러 정하지 않아도 돼요.”","d16.terminal.r":"{N10}은 매표소 앞 의자에 앉아 있다. “표 살 돈은 없어요. 그냥, 여기 따뜻해서요.” {hero}가 옆에 앉는다. {N10}이 먼저 말한다. “아저씨 일 구하면… 저도 한번 물어봐 주세요.”","d17.t":"열이레째 새벽. 오늘은 면회일이다. 오후부터 저녁까지.","d17.t9":"쉼터의 열이레째 아침. 오늘은 면회일이다.","d17.plan":"승합차는 오후와 저녁에 급식소에서 떠난다.","d17.plan.w":"근무는 오후다. 면회는 저녁까지다. 둘 다 될 수도 있고, 하나는 미뤄야 할 수도 있다.","d17.a":"급식소 쪽으로 걷는다","d17.b":"햇살의 집 쪽으로 걷는다","d17.a.r":"급식소 쪽으로 걷는다. 승합차는 거기서 떠난다.","d17.b.r":"햇살의 집 쪽 길로 든다. 오후는 아직 멀다.","d17.c.r":"수첩에서 면회 날짜를 다시 읽는다.","d18.t":"열여드레째 새벽.","d18.t9":"쉼터의 열여드레째 아침.","d18.none":"안내문은 아직 가방에 있다. 오늘 답을 기다리는 사람은 없다.","d18.how.art":"광장의 초상화 노점은 점심 뒤에 연다. 얼굴 하나에 깨끗한 종이 한 장이 든다. 급식소는 두 길 건너에 있다.","d18.how.warehouse":"편의점 뒤 물류 입고장은 오후에 시작한다. 앉아서 표지를 확인하는 일이다. 몸의 기운을 많이 쓰고 급식소는 멀다. 저녁에는 편의점에서 빵을 판다.","d18.how.kitchen":"부엌 일은 점심 배식 뒤에 시작한다. 먹지 못했다면 일이 끝날 때 작업 식사가 있다.","d18.used.art":"이제 어느 의자에 오후 빛이 드는지 안다.","d18.used.warehouse":"확인하지 않은 목록을 어디 두었는지 기억한다.","d18.used.kitchen":"쟁반이 어느 선반으로 가는지 기억한다.","d18.a":"급식소 쪽으로 걷는다","d18.a.art":"광장 쪽으로 걷는다","d18.a.warehouse":"편의점 쪽으로 걷는다","d18.a.kitchen":"급식소 쪽으로 걷는다","d18.b":"급식소에 먼저 간다","d18.a.r":"오후의 일터 쪽으로 걷는다.","d18.b.r":"급식소 쪽으로 걷는다. 점심이 먼저다.","d18.c.r":"굳은 다리를 펴고 빛이 들 때까지 기다린다.","d19.t":"열아흐레째 새벽. 광장 전광판에 다시 한파 경보가 흐른다.","d19.t9":"쉼터의 열아흐레째 아침. 직원이 경보를 소리 내어 읽고 담요 수를 센다.","d19.bed":"오늘 밤 명단에 그의 침대 번호가 있다.","d19.plan":"저녁 전에 오늘 밤 잘 곳이 필요하다.","d19.a.r":"오후의 일터 쪽으로 걷는다. 입김이 공중에 머문다.","d19.b.r":"급식소 쪽으로 걷는다. 줄이 벌써 길다.","d19.c.r":"외투 깃을 세우고 조금 더 있는다.","m08.t":"{hero}는 안내문 세 장을 읽는다. 그림, 물건 분류, 부엌 보조 일이다. 그는 급여를 다시 보기 전에 근무 시간을 확인한다.","m08.a":"그림 일을 고른다","m08.b":"창고 일을 고른다","m08.c":"부엌 일을 고른다","m08.later":"오늘은 안내문만 넣어 둔다","m08.sub.art":"광장 · 오후 · 얼굴 하나에 종이 한 장 · 허기 −2","m08.sub.wh":"편의점 뒤 · 오후 · 허기 −8","m08.sub.kit":"급식소 · 오후 · 허기 −4 · 점심을 못 받은 날 작업 식사","m08.terms":"하루 급여: 그림 {art0}~{art1}(그림 결과에 따라) · 창고 {wh} · 부엌 {kit}. 근무는 오후다. 면회일에는 쉴 수 있지만 그날 급여는 없다.","m08.b.no":"{hero}는 물건을 들고 이동하는 조건을 읽는다. 이 안내문에는 필요한 앉은 작업이 없다. 그는 다른 안내문 두 장을 곁에 둔다.","m08.c.no":"부엌 안내문은 급식소에서 다섯 번 이상 먹은 사람을 찾는다. 그는 손가락으로 날을 세어 보고 이 안내문은 나중을 위해 접어 둔다.","m08.a.r":"{hero}는 가방 속 깨끗한 종이를 센다. 안내문에는 의자 두 개가 마주 보고 있다. 종이를 더 구할 곳을 적는다.","m08.b.r":"{hero}는 물건이 들어오는 시간을 확인한다. 작은 글씨에 앉아서 할 수 있는 작업이 적혀 있다. 그는 그 줄을 두 번 읽을 때까지 안내문을 편 채로 둔다.","m08.c.r":"{hero}는 부엌 문과 탁자 순서를 안다. 안내문에는 오후 작업 전에 오라고 적혀 있다. 그는 면회 날짜 옆에 시간을 적는다.","m08.later.r":"그는 안내문 세 장을 함께 접어 가방에 넣는다.","u5.notices":"일자리 안내문을 다시 꺼낸다","h5.notice":"가방에 일자리 안내문 세 장이 있다. 21일까지 고를 수 있다.","h5.work.art":"그림 일: 오후, 광장의 초상화 노점. 급식소에서 두 길이라 점심 배식 뒤에는 제때 닿지 못한다. 오늘 먹을 것은 다른 데서 챙겨야 한다.","h5.work.warehouse":"창고 일: 오후, 편의점 뒤. 급식소에서 멀어 점심 배식 뒤에는 제때 닿지 못한다. 저녁에는 편의점에서 빵을 판다.","h5.work.kitchen":"부엌 일: 오후, 급식소. 점심 배식이 끝난 뒤.","h5.paper":"깨끗한 종이가 없다. 광장 가게에서 세 장을 1에 판다.","h5.away":"오후의 일터는 다른 곳에 있다. 오늘 일은 미뤄진다.","h5.19":"오늘 일이 없으면 하루는 하루대로다. 한 끼, 따뜻한 곳, 그리고 밤.","u5.work.art":"초상화 노점을 연다","u5.work.warehouse":"입고장에서 표지를 확인한다","u5.work.kitchen":"부엌 일을 돕는다","u5.work.sub.art":"종이 한 장 · 허기 −2","u5.work.sub.warehouse":"허기 −8","u5.work.sub.kitchen":"허기 −4 · 점심을 못 받았으면 작업 식사","u5.workG.art":"시간 안에 그려 본다(도전)","u5.workG.warehouse":"시간 안에 분류해 본다(도전)","u5.workG.kitchen":"시간 안에 배식해 본다(도전)","u5.game.full":"도전이 잘 끝났다.","u5.game.small":"도전이 대부분 잘 끝났다.","u5.game.none":"도전은 거기서 끝난다. 일은 그대로 끝났다.","u5.paper":"종이 세 장을 산다(1)","u5.paper.r":"가게 주인이 종이 세 장을 얇은 봉투에 넣어 준다.","u5.sweep":"청소 노동자와 광장을 쓴다","u5.sweep.r":"둘은 분수대에서 계단까지 쓴다. 가게 문이 열리기 전에 청소 노동자가 품삯을 건넨다.","u5.meal":"일이 끝나자 그의 몫으로 그릇 하나가 놓여 있다. 작업 식사다.","w.pay1":"이 일의 첫 급여: {n}. 그는 한 번 세고 넣어 둔다.","m09.a.1":"손님은 {hero}가 연필을 내릴 때까지 앉아 있다. “제 귀가 정말 저렇게 크네요.” 손님이 종이를 조심히 들고 약속한 값을 탁자에 놓는다.","m09.a.2":"{hero}는 돈을 세기 전에 작은 부스러기를 치운다. 완성된 종이는 손님이 갖고 간다. 다음 손님이 앉기 전에 {hero}는 종이가 얼마나 남았는지 확인한다.","m09.a.3":"이제 의자에는 접힌 천이 놓여 있다. {hero}는 손님이 앉기 전에 종이를 놓는다. 이번에는 얼굴에 빛이 어디로 들어올지 안다.","m09.a.five":"남의 얼굴은 하루에 다섯 개도 그린다.","m09.b.1":"담당자가 마지막 상자를 {hero}의 목록 옆에 놓는다. “이 표지가 반대로 붙었네요. 찾아 주셨군요.” 담당자는 급여를 건네기 전에 근무표에 서명한다.","m09.b.2":"{hero}는 날짜가 맞는지 확인한다. 근무 기록을 신분증 옆에 넣는다. 빈 상자들은 {hero}가 정한 순서대로 쌓여 있다.","m09.b.3":"다음 작업자가 목록의 표시를 따라간다. “내일도 보게 여기 두세요.” {hero}는 아직 확인하지 않은 첫 줄 옆에 연필을 놓는다.","m09.c.1":"마지막 그릇이 배식대 너머로 간다. {N01}이 근무표를 {hero} 쪽으로 돌린다. “여기에 이름 적으세요.” 다른 작업자들의 이름 옆에 빈칸이 있다.","m09.c.2":"{hero}는 이름을 쓰고 볼펜을 돌려놓는다. {N01}은 깨끗한 그릇들을 옆 선반으로 옮긴다. {hero}는 빈 쟁반을 설거지하는 곳으로 가져간다.","m09.c.3":"“뜨거운 냄비는 제가 할게요. 쟁반부터 맡아 주세요.” {N01}이 말한다. {hero}는 쟁반을 순서대로 놓는다. 이제 선반마다 손으로 가리키지 않아도 된다.","oil.cook":"조리사가 팬을 닦고 남은 기름을 작은 컵에 따라 준다. “필요하면 가져가요.”","oil.kitchen":"마지막 팬을 닦으며 {N01}이 남은 기름을 작은 컵에 따라 그의 가방 옆에 둔다.","oil.warehouse":"선반 레일에 쓰고 남은 윤활유 한 통이 있다. 담당자가 그의 목록 위에 올려 둔다. “쓸 데가 있을지도 몰라요.”","item.oil":"기름 조금","lunch5.t16":"{N01}이 쟁반을 밀어 준다. “오늘 안내문이 나왔다면서요.”","lunch5.t17":"부엌 문 옆 고리에 승합차 열쇠가 걸려 있다. 오후에 떠날 것이다.","lunch5.t18":"줄이 천천히 움직인다. 뒤에서 누군가 추위가 다시 온다고 말한다.","lunch5.t19":"오늘 국이 평소보다 뜨겁다. 아무도 이유를 말하지 않는다.","m10.t":"“오늘 뭐 하셨어요?” {son}이 묻는다. 아이가 발로 옆 의자를 꺼낸다. {hero}는 앉기 전에 가방 가장자리를 살핀다.","m10.talk":"오늘 한 일을 말해 준다","m10.talk3":"아이가 하려는 말을 듣는다","m10.draw":"빈 자리에 그린다.","m10.drawWith":"공책에 함께 그린다.","m10.draw.dim":"손이 떨린다. 오늘은 선이 거기까지 가지 않는다.","m10.swing":"그네 사슬을 살펴본다.","m10.A":"“어떤 분 얼굴을 그렸어.” {son}이 자기 귀를 만진다. “여기가 어려웠어요?” {hero}가 웃는다. “오늘은 그랬어.” 아이가 더 잘 보이도록 고개를 돌린다.","m10.B":"“상자와 표지를 확인했어.” {son}이 연필 세 자루를 나란히 놓는다. “이건 자꾸 굴러가요.” {hero}가 다른 두 자루 위에 가로로 놓는다. 연필이 멈춘다.","m10.C":"“점심 배식을 도왔어.” {son}이 빈 컵을 든다. “전 두 개 들 수 있어요.” 아이가 시도하다 하나를 내려놓는다. “하나가 편하네요.” {hero}가 다른 컵을 든다.","m10.D":"“시작할 준비를 하고 있어.” {son}이 연필을 치운다. “그 전에 이것 좀 봐 주세요.” 아이가 보여 주고 싶은 그림 쪽으로 공책을 편다.","m10.E":"“이번 주에 일을 시작했어. 오늘은 여기 먼저 왔지.” {son}이 고개를 끄덕이고 공책을 끌어당긴다. “그럼 이거 봐요.”","draw.end":"아이는 아무것도 묻지 않는다.","draw.dir":"복도에서 원장은 한마디만 한다. “그럼 이제 순서대로, 같이 해 봐요.”","draw.f5":"아이가 그림을 오래 본다. 연필을 집었다가, 아무것도 쓰지 않고 내려놓는다.","draw.f7":"아이는 그 장의 귀퉁이를 작게 접어 둔다.","draw.part":"“다음에 마저 그려요.” {son}이 말한다.","draw.none":"연필이 종이 위에 놓여 있다. {son}은 공책을 둘 사이에 펼쳐 둔다.","u5.dad.hand":"아빠","swing.r":"{son}이 원장과 손을 씻으러 간 사이, {hero}는 사슬 고리에 기름을 바른다. 그네를 한 번 밀어 본다. 소리 없이 움직인다.","m11.t.warehouse":"“공원 근처에서 지내세요?” 작업자가 탁자 너머로 묻는다. 그날 아직 끝내지 못한 작업이 둘 사이에 있다.","m11.t.art":"“공원 근처에서 지내세요?” 손님이 판 너머로 묻는다. 종이 위의 얼굴은 아직 반쯤 비어 있다.","m11.t.kitchen":"“공원 근처에서 지내세요?” 옆에서 그릇을 닦던 작업자가 묻는다. 배식대에는 아직 쟁반이 남아 있다.","m11.a":"짧게 대답한다","m11.b":"일을 먼저 하자고 한다","m11.a.warehouse":"“지금은요.” {hero}는 다음 작업으로 돌아간다. 작업자가 {hero}의 길에서 상자를 치운다. 어느 쪽도 상대에게 모든 것을 설명하라고 하지 않는다.","m11.b.warehouse":"“이것부터 끝내고 싶어요.” 작업자는 고개를 끄덕이고 목록을 든다. “그럼 다음은 이 줄이에요.” {hero}는 첫 표시를 확인한다.","m11.a.art":"“지금은요.” {hero}가 말한다. 손님이 종이를 본다. “이쪽으로 돌아도 될까요?” {hero}는 판을 조정한다. 둘은 그리고 있던 얼굴로 돌아간다.","m11.b.art":"“그림부터 마치고 싶어요.” 손님이 가만히 앉는다. {hero}는 뺨과 귀가 만나는 곳에 다음 선을 긋는다.","m11.a.kitchen":"“지금은요.” {hero}가 깨끗한 쟁반을 놓는다. {N01}이 근무표에서 젖은 행주를 치운다. “이 그릇은 다음 선반에 놓아 주세요.”","m11.b.kitchen":"“이것부터 마치고 싶어요.” {N01}이 고개를 끄덕인다. {hero}가 쟁반을 선반으로 가져간다. 다음 사람은 통로가 비워질 때까지 기다린다.","m11.x":"문 쪽에서 웃음소리가 난다. {hero}는 도구를 잠시 내려놓는다. 담당자가 문을 닫는다. “일은 여기 있어요.” 담당자가 탁자를 가리킨다.","letter.d16.a":"추위가 조금 누그러졌다.","letter.d16.b.job":"오늘 안내문 세 장을 읽고 하나를 골랐어.","letter.d16.b.wait":"오늘 안내문 세 장을 읽었어. 아직 생각하는 중이야.","letter.d16.c":"내일은 조금 더 일찍 일어날게.","letter.d17.a":"오늘 하루도 지나갔어.","letter.d17.b.drew":"오늘 빈 자리에 얼굴 하나가 들어갔어.","letter.d17.b.seen":"오늘 네가 또 공책을 보여 줬지.","letter.d17.b.miss":"오늘은 가지 못했어. 다음 날짜는 21일이야.","letter.d17.c":"다음에 만나면 그네 이야기를 해 줘.","letter.d18.a":"오늘은 해가 일찍 졌어.","letter.d18.b.work":"오늘 일을 했어. 누군가 내 이름을 종이에 적었어.","letter.d18.b.wait":"오늘은 일을 하지 않았어. 준비를 했지.","letter.d18.c":"손으로 하는 일을 다시 생각하고 있어.","letter.d19.a":"다시 추워. 목도리 꼭 해.","letter.d19.b.work":"추운데도 오늘 일하러 갔어.","letter.d19.b.cold":"오늘은 따뜻한 곳을 먼저 찾았어.","letter.d19.c":"추운 날일수록 네 목소리를 오래 떠올려.","n16.t":"열엿새째 밤. 몸을 뒤척일 때마다 안내문이 바스락거린다.","n17.t":"열이레째 밤. 면회가 조금 더 오래 그의 곁에 남는다.","n18.t":"열여드레째 밤. 손이 오후를 기억한다.","n19.t":"열아흐레째 밤.","n19.cold":"바람이 쉬지 않고 길을 내려온다. 이번 겨울 세 번째 한파의 밤이다.","p07.t":"청소 노동자가 광장을 쓸고 있다. 바람이 방금 모아 둔 더미를 돌바닥 위로 흩어 놓는다.","p07.a":"흩어진 쓰레기를 줍는다","p07.b":"비켜서 지나간다","p07.a.r":"{hero}는 발치에 가장 가까운 종이부터 주워 그녀의 쓰레기통에 넣는다.","p07.ok":"그녀가 허리를 펴고 고개를 끄덕인다. “고마워요. 바람이 안 도와주네요.” 작업 장갑 위로 처음으로 얼굴이 보인다.","p07.no":"그녀는 벌써 다음 모퉁이를 쓸고 있다.","p07.b.r":"등 뒤에서 빗자루 소리가 이어진다.","p09.t":"광장 가장자리에 배달 오토바이가 넘어져 있다. 배달 기사가 혼자 세우려고 애쓴다.","p09.a":"오토바이를 함께 세운다","p09.b":"그냥 지나간다","p09.a.r":"{hero}가 안장 뒤쪽을 잡는다. 셋에 맞춰 둘이 함께 세운다.","p09.ok":"기사가 장갑을 벗는다. “덕분에 벌금 면했어요.” 헬멧 아래로 처음으로 얼굴이 보인다.","p09.no":"기사는 짧게 고개를 숙이고 떠난다.","p09.b.r":"한참 뒤 등 뒤에서 시동 소리가 난다.","h011.t":"회사원이 커피를 든 채 멈춘다. “일 찾으세요? 저 이런 거 매일 써요. 이력서 한 장 같이 써 볼까요?”","h011.a":"같이 쓴다","h011.b":"고맙다고 하고 사양한다","h011.a.r":"둘은 영수증 뒷면에 쓴다. ‘경력’ 칸에 {hero}가 두 줄을 쓰고 세 번째 줄에서 멈춘다.","h011.b.r":"회사원이 고개를 끄덕이고 서둘러 간다.","h091.t":"기사가 오토바이에 기대어 선다. “가게 뒤 창고에서 검수할 사람을 찾아요. 앉아서 해도 돼요. 제가 말해 둘게요.”","h091.a":"말해 달라고 한다","h091.b":"생각해 보겠다고 한다","h091.a.r":"기사가 배달 전표 뒷면에 이름 하나를 적어 건넨다.","h091.b.r":"“말은 남아 있어요.” 기사가 말하고 시동을 건다.","h071.t":"청소 노동자가 빗자루를 벤치에 기대 둔다. “가게 문 열기 전에 시작해요. 새벽에 오면 두 손 몫 품삯이 있어요.”","h071.a":"새벽에 오겠다고 한다","h071.b":"고맙다고 하고 사양한다","h071.a.r":"그녀가 두 번째 빗자루를 두는 곳을 알려 준다.","h071.b.r":"그녀가 다시 빗자루를 든다.","alt.u5.act":"여덟째 새벽부터 열닷새째까지 여덟 칸의 색 띠. 낮은 담에 앉은 남자가 마지막 칸을 보고 있다.","alt.u5.notice":"책상 위 안내문 세 장: 마주 보는 의자 둘, 표지가 붙은 상자 더미, 줄지어 놓인 그릇.","alt.u5.terminal":"새벽 전의 버스 터미널. 매표소 옆 의자에 모자 달린 옷의 청년이 앉아 있다. 남자가 그 옆에 앉는다.","alt.u5.L7.stall":"오후의 광장. 작은 판 앞에 접이식 의자 둘이 마주 보고 있다. 남자가 그리는 동안 손님이 가만히 앉아 있다.","alt.u5.L8.dock":"편의점 뒤 물류 입고장. 남자가 목록을 놓고 탁자에 앉아 있고, 곁에 상자가 순서대로 쌓여 있다.","alt.u5.L2.work":"점심 뒤 급식소 부엌. 배식대에 쟁반이 줄지어 있고, 남자가 하나를 선반 쪽으로 옮긴다.","alt.u5.notebook":"탁자 위에 펼친 아이의 공책. 왼쪽에는 아이가 그린 여자의 얼굴, 오른쪽에는 연필로 그린 남자의 얼굴.","alt.u5.swing":"햇살의 집 마당. 그네 하나가 오가고, 남자의 손이 방금 사슬에서 떨어졌다.","alt.u5.park.p07":"공원에서 청소 노동자가 낙엽을 한데 쓸어 모은다.","alt.u5.L7.p07":"광장에서 청소 노동자가 모아 둔 쓰레기 더미가 바람에 흩어진다.","alt.u5.L7.p09":"광장 가장자리에 배달 오토바이가 옆으로 넘어져 있다.","alt.u5.park.p09":"공원 길에 배달 오토바이가 옆으로 넘어져 있다."}}</script><!-- HS:MOD L-ko-U5 END -->
